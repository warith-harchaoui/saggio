# Packaging and tooling for saggio.
#
# The package layout is flat, like the rest of this author's helper suite
# (os-helper, audio-helper, vocal-helper): the importable package sits at the
# repository root rather than under src/.
#
# Runtime dependencies are deliberately four. os-helper owns every
# per-operating-system question (what CPU is this, what GPU, how much memory,
# which platform, where are the temporary files, how do I time a block), PyYAML
# parses the models and the catalogues, platformdirs finds the per-user config
# directory portably, and Babel owns every question whose answer is a property
# of a language rather than of this package. Everything else the package does,
# it does itself.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saggio"
version = "1.5.0"
description = "What it costs to run your code, per unit of work, with every number saying how far it can be trusted: money, time, energy, carbon, water, and any dimension you register."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai" }]
keywords = [
    "cost of running",
    "green software",
    "carbon footprint",
    "energy measurement",
    "sustainability",
    "FinOps",
    "Green Algorithms",
    "provenance",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Benchmark",
]
dependencies = [
    # os-helper answers every question about the machine and the operating
    # system on the two this package supports: CPU model and core count,
    # installed memory, discrete GPUs, platform detection, temporary files,
    # timers, logging. This package asks rather than re-implementing.
    "os-helper>=2.0.0,<3",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    # Babel carries the Common Locale Data Repository (CLDR), the Unicode
    # Consortium's database of how each language writes a number, orders a
    # list, pluralises a count and names a country. This package had three of
    # those written by hand, and the hand got one wrong: the space before a
    # per-cent sign in French is a no-break space and I had written the narrow
    # no-break one. Thirty-eight country names were also hand-written, and
    # thirty-seven agreed with the database — the thirty-eighth is Türkiye,
    # which this said was Turkey.
    #
    # Taken for locale *data* only. The sentences stay in this repository's own
    # catalogue, with its own gates: Babel knows how French writes a thousand
    # and nothing about what this package has to say. What it does not carry is
    # collation, which is why sorting a list of country names is still done
    # here, and said so where it is done.
    "Babel>=2.12",
    # click declares the command line. It was argparse, which is in the standard
    # library and therefore free, and the move was a decision rather than a
    # discovery: a fifth dependency is a real cost and is being paid for three
    # things argparse made this package work around. A mistyped verb names the
    # nearest one, out of thirteen -- click's own doing, not this package's. The verbs are *public* -- a contract
    # test used to read `parser._subparsers._group_actions`, with a comment
    # apologising for it. And completion exists, which argparse never offered.
    #
    # What it is not taken for: anything the library does. click is reached only
    # from `saggio.cli`, and a gate refuses an import of it anywhere else, so
    # the four above remain the whole cost of `import saggio`.
    #
    # 8.5 and not 8.1, and the floor was raised rather than worked around.
    # argparse gave every positional argument a line of help and this surface
    # has twelve of them written and translated; click learned `argument(...,
    # help=...)` in 8.5. A shim that carried the help was written here against
    # 8.4, passed locally, and failed the moment continuous integration
    # resolved 8.5 -- where `Argument.__init__` takes `help` itself and set the
    # shim's to None. Pinning a library's internals to keep an older floor is
    # the arrangement that breaks quietly; using the feature is not.
    #
    # The floor is mandatory rather than preferred, and that was measured:
    # under 8.4 this package does not merely lose the twelve lines of help, it
    # does not start. `click.argument(..., help=...)` raises `TypeError:
    # Parameter.__init__() got an unexpected keyword argument 'help'` while the
    # commands are being declared, before any verb runs.
    "click>=8.5",
]

[project.optional-dependencies]
# Word and PDF output shells out to md2star, which wraps Pandoc. Large, and
# needed by nobody who is reading Markdown or HTML, so it stays out of the
# default install.
office = ["md2star>=1.0"]
# Reading a vendor's product carbon footprint. One verb needs it, a handful of
# times a year, and the runtime dependencies are deliberately three; a reader
# who never adds a catalogue row should not carry a document parser. The verb
# says what to install when it is missing, rather than failing on an import.
#
# Kreuzberg rather than a bare PDF text layer, because a vendor's summary is as
# likely to be a scan as a born-digital file, and a reader who has to find out
# which before asking has been given a worse tool. It brings OCR with it, and
# that is precisely why the parsing below refuses anything that is not a
# sentence: OCR turns a bar chart into text too, and a figure lifted off a
# chart is the one thing this package will not put in a catalogue.
pcf = ["kreuzberg>=4.0"]
# The HTTP and agent surfaces. Nobody who wants a cost model in a pull request
# should have to install a web framework to get one, so they stay out of the
# default install and the library, the command line and the skill never import
# them. fastapi-mcp reads the application's own OpenAPI document, which is why
# the agent tools cannot drift away from the endpoints they describe.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-mcp>=0.4",
    # fastapi-mcp 0.4 asks for `mcp>=1.12` with no upper bound, and calls
    # `Server(name, description)` with two positional arguments. mcp 2.0 made
    # everything after the name keyword-only, so a fresh resolve installs a
    # version of the protocol library that fastapi-mcp cannot import: the
    # failure is a TypeError at import time, not a dependency conflict, so
    # nothing in the resolver objects. Bounded here because the package that
    # should bound it does not, and this one is what a user installs.
    "mcp>=1.12,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    # Pinned exactly, and not out of caution. `ruff format` is a gate, and an
    # unpinned gate changes its own rules: 0.16 began formatting the Python
    # inside Markdown fences, so continuous integration started failing on files
    # a developer's older ruff had declared clean, with no commit in between.
    # A check nobody can reproduce locally is a check nobody can fix.
    "ruff==0.16.10",
    "pillow>=10.0",
    # The default run collects doctests from every module in the package, the
    # HTTP and agent surfaces included, and the contract tests call the routes
    # for real. A surface nobody tests is a surface that is already broken.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-mcp>=0.4",
    # The same bound as the `api` extra, for the same reason: without it a fresh
    # continuous-integration environment installs an mcp that fastapi-mcp cannot
    # import, and the suite fails at collection on a machine nobody can see.
    "mcp>=1.12,<2",
    "httpx>=0.27",
]

[project.scripts]
saggio = "saggio.cli.app:run"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/saggio"
Source = "https://github.com/warith-harchaoui/saggio"
Issues = "https://github.com/warith-harchaoui/saggio/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["saggio*"]

[tool.setuptools.package-data]
# The catalogues, the templates, and the report's own assets all ship inside the
# wheel and are read through importlib.resources, so a checkout and an installed
# copy behave identically.
"saggio.data" = ["*.yaml", "templates/*.yaml", "report/*", "messages/*.yaml"]

# --- Linting and formatting -------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, NumPy docstrings, bugbear, comprehensions,
# pyupgrade, and the security checks that matter for a tool that runs subprocesses.
select = ["E", "W", "F", "I", "D", "B", "C4", "UP", "S", "RUF"]
ignore = [
    # D203 and D213 contradict the NumPy convention that D itself enforces.
    "D203",
    "D213",
    # __all__ is grouped by layer with a comment per group, which is how a reader
    # meets the public surface. Alphabetical order would scatter the groups.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# The package refuses to import on an unsupported platform before it imports
# anything else, which is the whole point of putting the check there: on Windows
# a submodule import would otherwise fail on a missing stdlib module, three
# frames deep, with no explanation. Every import below that guard is therefore
# "not at top of file" on purpose.
"saggio/__init__.py" = ["E402"]

# Tests say what they check in their names; a docstring rule on every assertion
# helper adds noise rather than clarity. assert is what a test is made of.
"tests/*" = [
    "D100",
    "D103",
    # A test's docstring names what is being checked; "An empty catalogue overlay"
    # is the right sentence for a fixture and is not an instruction.
    "D401",
    # assert is what a test is made of.
    "S101",
]

# This file's whole job is to read the typography a page is written in: the
# multiplication sign, the true minus sign, and the French no-break spaces are
# the characters it exists to recognise, so a rule against them has it backwards.
# S105 fires on `token == "("`, which is a parser cursor and not a password.
"tests/contract/test_arithmetic_in_prose.py" = ["RUF001", "RUF002", "S105"]

# The form-factor pattern has to match both `8x` and `8×`, because a vendor's
# typography is not this package's to choose. A rule against the character the
# document uses would be a rule against reading the document.
"saggio/catalog/pcf.py" = ["RUF001"]

# The front pages' figures draw a derivation, and a derivation is written with a
# multiplication sign. The package's own sentences already use it -- the scaling
# fit prints `coefficient × size^exponent` in both languages -- so a figure
# spelling it `x` would be the odd one out on the page it illustrates.
"assets/make_readme_figures.py" = ["RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["saggio"]

# --- Tests ------------------------------------------------------------------

[tool.pytest.ini_options]
# The doctests are part of the suite on purpose: every example in every docstring
# is executed, so the documentation cannot drift away from the code.
testpaths = ["tests", "saggio"]
addopts = "-q --doctest-modules"
filterwarnings = [
    "error::DeprecationWarning",
    # Raised by pydantic while fastapi-mcp builds the tool schemas from the
    # OpenAPI document, on an override inside fastapi-mcp rather than in
    # anything here. Nothing in this repository can stop it, and turning the
    # whole class of warning back into a non-error to silence one library would
    # hide the next deprecation that is ours.
    "ignore:The `__get_pydantic_core_schema__` method of the `BaseModel` class is deprecated:DeprecationWarning",
]
markers = [
    # Run by default, deliberately. Three tests that spawn a real subprocess are
    # exactly the ones a package about measuring real subprocesses should not
    # skip, and the whole suite still finishes in minutes. The marker is here so
    # that somebody iterating on an unrelated file can say `-m "not slow"` and
    # mean it, not so that the default run is quieter than it should be.
    "slow: exercises a real subprocess and takes seconds rather than milliseconds",
]
