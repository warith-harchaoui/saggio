schema_version: '2.1'
date_updated: '2026-10-01'
project:
  name: fastapi
  audited_from: https://github.com/fastapi/fastapi
unit_of_work:
  name: one invocation of the command
  description: 'Proposed from the repository''s shape, which reads as command-line-tool. Confirm or replace
    it: every number below is per one of these, so the whole model means whatever this sentence means.'
  status: placeholder
  out_of_scope: []
deployment:
  provider: on-prem
  country: FR
  country_provenance: Stated by the caller.
  operating_system: darwin
  logical_cores: 12
  physical_cores: 12
  cpu: Apple M2 Max
  machine_provenance: This describes the machine that ran the audit, not where the code runs. https://github.com/fastapi/fastapi
    was cloned and read here. Replace the machine, the provider and the country with the ones it actually
    runs on before any number below means anything about this project.
assumptions:
  power_draw:
    value: 83.75999999999999
    status: estimated
    unit: W
    source_url: https://doi.org/10.1002/advs.202100707
    retrieved_date: '2026-09-12'
    notes: 'Nameplate sum, Green Algorithms method: 12 cores x 4.0 W + 96 GB x 0.3725 W/GB'
  pue:
    value: 1.5
    status: estimated
    unit: ratio
    source_url: https://www.uptimeinstitute.com/resources/research-and-reports/uptime-institute-global-data-center-survey-results-2024
    retrieved_date: '2026-09-12'
    notes: Power usage effectiveness published by On-premises.
  electricity_price:
    value: 0.276
    status: estimated
    unit: USD/kWh
    currency: USD
    source_url: "https://www.globalpetrolprices.com/electricity_prices/"
    retrieved_date: "2026-10-02"
    notes: "Indicative tariff for France. Collected Q3 2026."
  grid_carbon_intensity:
    value: 41.2
    status: estimated
    unit: gCO2e/kWh
    source_url: "https://api.ember-energy.org/v1/carbon-intensity/yearly"
    retrieved_date: "2026-10-02"
    notes: "Annual average for France, data year 2025."
  water_usage_effectiveness:
    value: null
    status: TODO
    unit: L/kWh
    notes: On-premises publishes no water usage effectiveness. Leave this open rather than inventing a
      figure.
  hardware_embodied_carbon:
    value: null
    status: TODO
    unit: kgCO2e
    notes: No accelerator was identified, so the carbon of building one is not this model's to carry.
      A processor's own footprint is not in the catalogue yet; it is excluded rather than assumed to be
      zero.
  hardware_lifetime:
    value: null
    status: TODO
    unit: years
    notes: How long this hardware stays in service, which only you know. The published footprints are
      cradle-to-gate and exclude the use phase, so none of them states a lifespan. Reported figures cluster
      between three and six years; choosing within that range moves the embodied carbon by a factor of
      two, which is why this is asked rather than assumed.
  machine_energy:
    value: null
    status: TODO
    unit: kWh
    derived_from:
    - scenarios[0].runtime
    - assumptions.power_draw
    notes: Needs both a runtime and an average power draw.
models_called:
- model: alexnet
  detected_at: tests/test_tutorial/test_path_params/test_tutorial005.py:12
  evidence: 'assert response.json() == {"model_name": "alexnet", "message": "Deep Learning FTW!"}'
  caveat: Found only in the code that tests this repository, so it may not be part of the workload. Confirm
    before pricing it.
  units_per_unit_of_work:
    value: null
    status: TODO
    notes: How much of each rate one unit of work spends. Reading the code cannot establish this; measure
      a real call, or state it.
- model: lenet
  detected_at: tests/test_tutorial/test_path_params/test_tutorial005.py:18
  evidence: 'assert response.json() == {"model_name": "lenet", "message": "LeCNN all the images"}'
  caveat: Found only in the code that tests this repository, so it may not be part of the workload. Confirm
    before pricing it.
  units_per_unit_of_work:
    value: null
    status: TODO
    notes: How much of each rate one unit of work spends. Reading the code cannot establish this; measure
      a real call, or state it.
- model: resnet
  detected_at: tests/test_tutorial/test_path_params/test_tutorial005.py:24
  evidence: 'assert response.json() == {"model_name": "resnet", "message": "Have some residuals"}'
  caveat: Found only in the code that tests this repository, so it may not be part of the workload. Confirm
    before pricing it.
  units_per_unit_of_work:
    value: null
    status: TODO
    notes: How much of each rate one unit of work spends. Reading the code cannot establish this; measure
      a real call, or state it.
scenarios:
- name: as-audited
  description: One unit of work as this audit found it, on the machine it ran on.
  runtime:
    value: null
    status: TODO
    unit: s
    notes: No run was measured. Measure the real command with `saggio measure`, or audit again with --run.
  costs:
    time:
      value: null
      status: TODO
      unit: s
      derived_from:
      - scenarios[0].runtime
      notes: No run was measured. Measure the real command with `saggio measure`, or audit again with
        --run.
    energy:
      value: null
      status: TODO
      unit: kWh
      derived_from:
      - assumptions.machine_energy
      - assumptions.pue
      notes: Needs the machine's own energy and the site's power usage effectiveness.
    money:
      value: null
      status: TODO
      unit: currency
      currency: USD
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.electricity_price
      notes: Needs the energy drawn and a price per kilowatt-hour.
    carbon:
      value: null
      status: TODO
      unit: gCO2e
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.grid_carbon_intensity
      notes: Needs the energy drawn and the grid carbon intensity where it runs.
    embodied_carbon:
      value: null
      status: TODO
      unit: gCO2e
      derived_from:
      - assumptions.hardware_embodied_carbon
      - assumptions.hardware_lifetime
      - scenarios[0].runtime
      notes: No product carbon footprint is on file for this hardware, so the carbon of building it is
        open. Nobody has read one for this part; that is not the same as it having been free to build.
        Add an `embodied_kgco2e` to the catalogue row with the footprint's own URL and the date it was
        read.
    water:
      value: null
      status: TODO
      unit: L
      derived_from:
      - assumptions.machine_energy
      - assumptions.water_usage_effectiveness
      notes: Needs the machine's energy and a published water usage effectiveness.
analysis:
  evidence_source: static
  archetype: command-line-tool
  languages:
  - Python
  - Shell
  - JavaScript
  language_file_counts:
    Python: 1166
    Shell: 5
    JavaScript: 4
  has_tests: true
exclusions:
- Making the hardware. Only the electricity to run it is counted.
- The people. Salaries, offices, and travel are out of scope.
- Idle capacity. This is the cost of one unit of work, not of being ready.
provenance_rules:
- Every sourced value carries source_url and retrieved_date.
- A derived value names its inputs and never outranks the weakest of them.
- The country is stated by a human, never inferred from a developer's locale.
