        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
        - Nothing here checked that the work is uniform. Measuring a few slices of different sizes would
          turn that assumption into an exponent; see saggio.estimate.scaling.
analysis:
  evidence_source: static
  archetype: command-line-tool
  languages:
  - Python
  - JavaScript
  language_file_counts:
    Python: 126
    JavaScript: 2
  frameworks:
  - ffmpeg
  total_work:
    unit: num_samples
    stated_as: '400000'
    source: examples/walkthrough/counter/config.py::num_samples
  has_tests: true
  llm_note: No local model was reachable; the read is static only.
measurement:
  command:
  - python3
  - -c
  - "\nimport yaml\nfrom saggio import render_html\nmodel = yaml.safe_load(open(\"examples/saggio.yaml\"\
    , encoding=\"utf-8\"))\nfor _ in range(50):\n    render_html(model)\n"
  exit_code: 0
  measured_on: '2026-10-18'
  power_scope: 'The figure covers the chip''s processor cores, graphics cores, and neural engine, from
    the system-on-chip''s own energy counters and the chip''s memory, from its own energy counter, read
    from the CPU Energy, GPU Energy, ANE0, DRAM0 counters. Memory is measured rather than estimated here:
    the machine publishes its own memory energy counter, so the figure is what the memory drew rather
    than what its installed capacity suggests it would draw. These are the chip''s own energy counters,
    which are a model inside the silicon rather than a meter on the power rail, and Apple says they are
    not a basis for comparing one machine against another. Left out of them: the display, storage, networking,
    the fans, and the power supply''s own losses.'
  power_sources:
  - system-on-chip
  - memory
  cpu_seconds: 1.3256
  idle_watts: 13.83
  power_note: 'Machine at rest before the slice: 13.8 W. Subtracting it gives 3.6 W as the slice''s own
    draw, which holds only if the rest of the machine did the same thing during the run as it did just
    before it.'
  power_by_domain:
    cpu: 15.178
    gpu: 0.118
    ane: 0.0
    memory: 2.146
  cpu_share:
    share: 0.198141
    run_cpu_seconds: 1.326
    machine_cpu_seconds: 6.69
  attributed_watts: 3.01
  attributed_scope: the processor cores alone, which is the only part a share of processor work can price
  warnings:
  - The machine was already drawing 13.8 W before the slice started, against 17.4 W while it ran, so most
    of the measured power was not this slice's. The difference, 3.6 W, is what the slice added if nothing
    else changed in between; measure on a quiet machine if the total is what you need.
  - 'No function-level profile was taken: the profiler changes what is being timed, so a series with one
    profiled run among several plain ones would report a spread the profiler put there. Run it once for
    the profile.'
  - The runtime moved from 1.326 s to 1.538 s across 5 runs of the same command — 15% of the median, which
    is wider than the gate `saggio diff` applies to a release. The model carries the median run; this
    is how much it would move if you took it again.
  - The measured power moved from 16.13 W to 37.36 W across 5 runs of the same command — 109% of the median,
    which is wider than the gate `saggio diff` applies to a release. The model carries the median run;
    this is how much it would move if you took it again.
  repeats: 5
  spread:
    runtime_s:
      low: 1.325554
      median: 1.381332
      high: 1.538204
      relative: 0.1539
      runs:
      - 1.381332
      - 1.407821
      - 1.325554
      - 1.330669
      - 1.538204
    power_w:
      low: 16.132957
      median: 19.423457
      high: 37.363475
      relative: 1.093
      runs:
      - 17.442897
      - 19.423457
      - 16.132957
      - 21.654895
      - 37.363475
exclusions:
- Making the hardware. Only the electricity to run it is counted.
- The people. Salaries, offices, and travel are out of scope.
- Idle capacity is inside these figures, not outside them. The power was read from the machine's own counters,
  which meter hardware and not processes, and 13.8 W of the 17.4 W was being drawn before the slice started.
  The measurement block carries 3.0 W as the run's attributable share, from its 20% of the machine's processor
  work; the costs below do not use it.
provenance_rules:
- Every sourced value carries source_url and retrieved_date.
- A derived value names its inputs and never outranks the weakest of them.
- The country is stated by a human, never inferred from a developer's locale.
