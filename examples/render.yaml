scenarios:
- name: as-audited
  description: One unit of work as this audit found it, on the machine it ran on.
  runtime:
    value: 0.02762663166000493
    status: measured
    unit: s
    notes: "Timed with `saggio measure`: python3 -c \nimport yaml\nfrom saggio import render_html\nmodel\
      \ = yaml.safe_load(open(\"examples/saggio.yaml\", encoding=\"utf-8\"))\nfor _ in range(50):\n  \
      \  render_html(model)\n. The command performed 50 units of work, so the figure is the wall-clock\
      \ time divided by 50. The median of 5 runs of the same command. Across them this figure ranged 1.326\
      \ s to 1.538 s, a spread of 15% of their median. That range is what a second measurement would be\
      \ free to land anywhere inside."
  costs:
    time:
      value: 0.02762663166000493
      status: measured
      unit: s
      derived_from:
      - scenarios[0].runtime
      notes: "Timed with `saggio measure`: python3 -c \nimport yaml\nfrom saggio import render_html\n\
        model = yaml.safe_load(open(\"examples/saggio.yaml\", encoding=\"utf-8\"))\nfor _ in range(50):\n\
        \    render_html(model)\n. The command performed 50 units of work, so the figure is the wall-clock\
        \ time divided by 50. The median of 5 runs of the same command. Across them this figure ranged\
        \ 1.326 s to 1.538 s, a spread of 15% of their median. That range is what a second measurement\
        \ would be free to land anywhere inside."
    energy:
      value: 2.0078686745833334e-07
      status: estimated
      unit: kWh
      source_url: https://doi.org/10.1002/advs.202100707
      derived_from:
      - assumptions.machine_energy
      - assumptions.pue
      notes: 'Machine energy x power usage effectiveness: what the building draws.'
    money:
      value: 5.5417175418500006e-08
      status: estimated
      unit: USD
      currency: USD
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.electricity_price
      notes: Facility energy x price per kilowatt-hour; hardware and staff are not included.
    carbon:
      value: 8.272418939283334e-06
      status: estimated
      unit: gCO2e
      source_url: https://doi.org/10.1002/advs.202100707
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.grid_carbon_intensity
      notes: Facility energy x grid carbon intensity, operating emissions only.
    carbon_market_based:
      value: null
      status: TODO
      unit: gCO2e
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.market_carbon_intensity
      notes: Needs the energy drawn and the emission factor of the electricity you contracted for. A grid
        average is the other method and will not do here.
    embodied_carbon:
      value: null
      status: TODO
      unit: gCO2e
      derived_from:
      - assumptions.hardware_embodied_carbon
      - assumptions.hardware_lifetime
      - scenarios[0].runtime
      notes: No product carbon footprint is on file for this hardware, so the carbon of building it is
        open. Nobody has read one for this part; that is not the same as it having been free to build.
        Add an `embodied_kgco2e` to the catalogue row with the footprint's own URL and the date it was
        read.
    water:
      value: null
      status: TODO
      unit: L
      derived_from:
      - assumptions.machine_energy
      - assumptions.water_usage_effectiveness
      notes: Needs the machine's energy and a published water usage effectiveness.
projections:
  whole_run:
    description: What a whole run would cost, from the per-unit costs in scenarios[0]. A whole run performs
      400000 num_samples, as examples/walkthrough/counter/config.py::num_samples states. This assumes
      one unit of work is one num_sample; if the model's unit of work means something else, restate this.
    costs:
      time:
        method: Whole run = measured slice / 2.5e-06.
        result:
          value: 11050.652664001971
          status: estimated
          unit: s
          notes: Projected from a slice covering 0.00025% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
        - Nothing here checked that the work is uniform. Measuring a few slices of different sizes would
          turn that assumption into an exponent; see saggio.estimate.scaling.
      energy:
        method: Whole run = measured slice / 2.5e-06.
        result:
          value: 0.08031474698333332
          status: estimated
          unit: kWh
          notes: Projected from a slice covering 0.00025% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
        - Nothing here checked that the work is uniform. Measuring a few slices of different sizes would
          turn that assumption into an exponent; see saggio.estimate.scaling.
      money:
        method: Whole run = measured slice / 2.5e-06.
        result:
          value: 0.022166870167400002
          status: estimated
          unit: USD
          currency: USD
          notes: Projected from a slice covering 0.00025% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
        - Nothing here checked that the work is uniform. Measuring a few slices of different sizes would
          turn that assumption into an exponent; see saggio.estimate.scaling.
      carbon:
        method: Whole run = measured slice / 2.5e-06.
        result:
          value: 3.3089675757133334
          status: estimated
          unit: gCO2e
          notes: Projected from a slice covering 0.00025% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
