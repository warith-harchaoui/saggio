analysis:
  evidence_source: static
  archetype: inference
  languages:
  - Python
  language_file_counts:
    Python: 2
  total_work:
    unit: num_samples
    stated_as: '400000'
    source: config.py::num_samples
  entrypoint: predict.py
  has_tests: false
measurement:
  command:
  - ~/miniconda3/bin/python3.13
  - ~/saggio/examples/walkthrough/counter/predict.py
  - --num_samples
  - '400'
  exit_code: 0
  measured_on: '2026-10-01'
  power_scope: 'The figure covers the chip''s processor cores, graphics cores, and neural engine, from
    the system-on-chip''s own energy counters and the chip''s memory, from its own energy counter, read
    from the CPU Energy, GPU Energy, ANE0, DRAM0 counters. Memory is measured rather than estimated here:
    the machine publishes its own memory energy counter, so the figure is what the memory drew rather
    than what its installed capacity suggests it would draw. These are the chip''s own energy counters,
    which are a model inside the silicon rather than a meter on the power rail, and Apple says they are
    not a basis for comparing one machine against another. Left out of them: the display, storage, networking,
    the fans, and the power supply''s own losses.'
  power_sources:
  - system-on-chip
  - memory
  cpu_seconds: 0.4714
  power_by_domain:
    cpu: 28.525
    gpu: 0.123
    ane: 0.0
    memory: 3.234
  cpu_share:
    share: 0.100948
    run_cpu_seconds: 0.471
    machine_cpu_seconds: 4.67
  attributed_watts: 2.88
  attributed_scope: the processor cores alone, which is the only part a share of processor work can price
  scaling:
    method: 'Least squares of log(seconds) on log(size) over 3 runs: seconds = 0.007966 × size^0.687.'
    reading: The work grew more slowly than the size, by a power of 0.69. Over these sizes the run is
      dominated by costs that do not grow with the job — start-up, imports, loading a model — so the slices
      are mostly measuring overhead and a projection from them would overstate the whole run.
    exponent:
      value: 0.6868470626474811
      status: measured
      unit: exponent
      notes: Fitted over 3 runs of sizes 25 to 400, R² = 0.999.
    r_squared: 0.999494
    observations:
    - size: 25.0
      seconds: 0.07358683299389668
    - size: 100.0
      seconds: 0.18373870798677672
    - size: 400.0
      seconds: 0.4941358750074869
    limits:
    - The exponent was measured between sizes 25 and 400. Outside that range it is an extrapolation like
      any other.
    - A cost that changes shape partway through a real run — a learning-rate schedule that changes batch
      size, a dataset that stops fitting in memory — is not visible in slices that all ran before it.
exclusions:
- Making the hardware. Only the electricity to run it is counted.
- The people. Salaries, offices, and travel are out of scope.
- Idle capacity. This is the cost of one unit of work, not of being ready.
provenance_rules:
- Every sourced value carries source_url and retrieved_date.
- A derived value names its inputs and never outranks the weakest of them.
- The country is stated by a human, never inferred from a developer's locale.
