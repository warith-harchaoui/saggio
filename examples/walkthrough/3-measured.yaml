schema_version: '2.1'
date_updated: '2026-10-01'
project:
  name: counter
  audited_from: ~/saggio/examples/walkthrough/counter
unit_of_work:
  name: one inference on a median-sized input
  description: 'Proposed from the repository''s shape, which reads as inference. Confirm or replace it:
    every number below is per one of these, so the whole model means whatever this sentence means.'
  status: placeholder
  out_of_scope: []
deployment:
  provider: on-prem
  country: FR
  country_provenance: Stated by the caller.
  operating_system: darwin
  logical_cores: 12
  physical_cores: 12
  cpu: Apple M2 Max
assumptions:
  power_draw:
    value: 31.10468175364349
    status: measured
    unit: W
    notes: 'Read from the machine while the command ran. The figure covers the chip''s processor cores,
      graphics cores, and neural engine, from the system-on-chip''s own energy counters and the chip''s
      memory, from its own energy counter, read from the CPU Energy, GPU Energy, ANE0, DRAM0 counters.
      Memory is measured rather than estimated here: the machine publishes its own memory energy counter,
      so the figure is what the memory drew rather than what its installed capacity suggests it would
      draw. These are the chip''s own energy counters, which are a model inside the silicon rather than
      a meter on the power rail, and Apple says they are not a basis for comparing one machine against
      another. Left out of them: the display, storage, networking, the fans, and the power supply''s own
      losses.'
  pue:
    value: 1.5
    status: estimated
    unit: ratio
    source_url: https://www.uptimeinstitute.com/resources/research-and-reports/uptime-institute-global-data-center-survey-results-2024
    retrieved_date: '2026-09-12'
    notes: Power usage effectiveness published by On-premises.
  electricity_price:
    value: 0.24
    status: estimated
    unit: USD/kWh
    currency: USD
    source_url: https://ember-energy.org/data/electricity-data-explorer/
    retrieved_date: '2026-09-12'
    notes: Indicative tariff for France.
  grid_carbon_intensity:
    value: 56
    status: estimated
    unit: gCO2e/kWh
    source_url: https://ember-energy.org/data/electricity-data-explorer/
    retrieved_date: '2026-09-12'
    notes: Annual average for France.
  water_usage_effectiveness:
    value: null
    status: TODO
    unit: L/kWh
    notes: On-premises publishes no water usage effectiveness. Leave this open rather than inventing a
      figure.
  hardware_embodied_carbon:
    value: null
    status: TODO
    unit: kgCO2e
    notes: No accelerator was identified, so the carbon of building one is not this model's to carry.
      A processor's own footprint is not in the catalogue yet; it is excluded rather than assumed to be
      zero.
  hardware_lifetime:
    value: null
    status: TODO
    unit: years
    notes: How long this hardware stays in service, which only you know. The published footprints are
      cradle-to-gate and exclude the use phase, so none of them states a lifespan. Reported figures cluster
      between three and six years; choosing within that range moves the embodied carbon by a factor of
      two, which is why this is asked rather than assumed.
  machine_energy:
    value: 1.1409963358333333e-08
    status: measured
    unit: kWh
    source_url: https://doi.org/10.1002/advs.202100707
    derived_from:
    - scenarios[0].runtime
    - assumptions.power_draw
    notes: runtime in hours x average power in watts / 1000.
scenarios:
- name: as-audited
  description: One unit of work as this audit found it, on the machine it ran on.
  runtime:
    value: 0.0013205686660076026
    status: measured
    unit: s
    notes: 'Timed with `saggio measure`: python predict.py --num_samples 500. The command performed 500
      units of work, so the figure is the wall-clock time divided by 500.'
  costs:
    time:
      value: 0.0013205686660076026
      status: measured
      unit: s
      derived_from:
      - scenarios[0].runtime
      notes: 'Timed with `saggio measure`: python predict.py --num_samples 500. The command performed
        500 units of work, so the figure is the wall-clock time divided by 500.'
    energy:
      value: 1.71149450375e-08
      status: estimated
      unit: kWh
      source_url: https://doi.org/10.1002/advs.202100707
      derived_from:
      - assumptions.machine_energy
      - assumptions.pue
      notes: 'Machine energy x power usage effectiveness: what the building draws.'
    money:
      value: 4.107586809e-09
      status: estimated
      unit: USD
      currency: USD
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.electricity_price
      notes: Facility energy x price per kilowatt-hour; hardware and staff are not included.
    carbon:
      value: 9.584369221e-07
      status: estimated
      unit: gCO2e
      source_url: https://doi.org/10.1002/advs.202100707
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.grid_carbon_intensity
      notes: Facility energy x grid carbon intensity, operating emissions only.
    embodied_carbon:
      value: null
      status: TODO
      unit: gCO2e
      derived_from:
      - assumptions.hardware_embodied_carbon
      - assumptions.hardware_lifetime
      - scenarios[0].runtime
      notes: No product carbon footprint is on file for this hardware, so the carbon of building it is
        open. Nobody has read one for this part; that is not the same as it having been free to build.
        Add an `embodied_kgco2e` to the catalogue row with the footprint's own URL and the date it was
        read.
    water:
      value: null
      status: TODO
      unit: L
      derived_from:
      - assumptions.machine_energy
      - assumptions.water_usage_effectiveness
      notes: Needs the machine's energy and a published water usage effectiveness.
projections:
  whole_run:
    description: What a whole run would cost, from the per-unit costs in scenarios[0]. A whole run performs
      400000 num_samples, as config.py::num_samples states. This assumes one unit of work is one num_sample;
      if the model's unit of work means something else, restate this.
    costs:
      time:
        method: Whole run = measured slice / 2.5e-06.
        result:
          value: 528.227466403041
          status: estimated
          unit: s
          notes: Projected from a slice covering 0.00025% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
        - Nothing here checked that the work is uniform. Measuring a few slices of different sizes would
          turn that assumption into an exponent; see saggio.estimate.scaling.
      energy:
        method: Whole run = measured slice / 2.5e-06.
        result:
          value: 0.006845978014999999
          status: estimated
          unit: kWh
          notes: Projected from a slice covering 0.00025% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
        - Nothing here checked that the work is uniform. Measuring a few slices of different sizes would
          turn that assumption into an exponent; see saggio.estimate.scaling.
      money:
        method: Whole run = measured slice / 2.5e-06.
        result:
          value: 0.0016430347235999998
          status: estimated
          unit: USD
          currency: USD
          notes: Projected from a slice covering 0.00025% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
        - Nothing here checked that the work is uniform. Measuring a few slices of different sizes would
          turn that assumption into an exponent; see saggio.estimate.scaling.
      carbon:
        method: Whole run = measured slice / 2.5e-06.
        result:
          value: 0.38337476883999994
          status: estimated
          unit: gCO2e
          notes: Projected from a slice covering 0.00025% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
        - Nothing here checked that the work is uniform. Measuring a few slices of different sizes would
          turn that assumption into an exponent; see saggio.estimate.scaling.
analysis:
  evidence_source: static
  archetype: inference
  languages:
  - Python
  language_file_counts:
    Python: 2
  total_work:
    unit: num_samples
    stated_as: '400000'
    source: config.py::num_samples
  entrypoint: predict.py
  has_tests: false
exclusions:
- Making the hardware. Only the electricity to run it is counted.
- The people. Salaries, offices, and travel are out of scope.
- Idle capacity. This is the cost of one unit of work, not of being ready.
provenance_rules:
- Every sourced value carries source_url and retrieved_date.
- A derived value names its inputs and never outranks the weakest of them.
- The country is stated by a human, never inferred from a developer's locale.
