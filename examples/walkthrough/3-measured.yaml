schema_version: '2.1'
date_updated: '2026-09-14'
project:
  name: counter
  audited_from: ~/saggio/examples/walkthrough/counter
unit_of_work:
  name: one inference on a median-sized input
  description: 'Proposed from the repository''s shape, which reads as inference. Confirm or replace it:
    every number below is per one of these, so the whole model means whatever this sentence means.'
  status: placeholder
  out_of_scope: []
deployment:
  provider: on-prem
  country: FR
  country_provenance: Stated by the caller.
  operating_system: darwin
  logical_cores: 12
  physical_cores: 12
  cpu: Apple M2 Max
assumptions:
  power_draw:
    value: 83.75999999999999
    status: estimated
    unit: W
    source_url: https://doi.org/10.1002/advs.202100707
    retrieved_date: '2026-09-12'
    notes: 'Nameplate sum, Green Algorithms method: 12 cores x 4.0 W + 96 GB x 0.3725 W/GB'
  pue:
    value: 1.5
    status: estimated
    unit: ratio
    source_url: https://www.uptimeinstitute.com/resources/research-and-reports/uptime-institute-global-data-center-survey-results-2024
    retrieved_date: '2026-09-12'
    notes: Power usage effectiveness published by On-premises.
  electricity_price:
    value: 0.24
    status: estimated
    unit: USD/kWh
    currency: USD
    source_url: https://ember-energy.org/data/electricity-data-explorer/
    retrieved_date: '2026-09-12'
    notes: Indicative tariff for France.
  grid_carbon_intensity:
    value: 56
    status: estimated
    unit: gCO2e/kWh
    source_url: https://ember-energy.org/data/electricity-data-explorer/
    retrieved_date: '2026-09-12'
    notes: Annual average for France.
  water_usage_effectiveness:
    value: null
    status: TODO
    unit: L/kWh
    notes: On-premises publishes no water usage effectiveness. Leave this open rather than inventing a
      figure.
  machine_energy:
    value: 2.6197405799967234e-08
    status: estimated
    unit: kWh
    source_url: https://doi.org/10.1002/advs.202100707
    derived_from:
    - scenarios[0].runtime
    - assumptions.power_draw
    notes: runtime in hours x average power in watts / 1000.
scenarios:
- name: as-audited
  description: One unit of work as this audit found it, on the machine it ran on.
  runtime:
    value: 0.0011259629999985918
    status: measured
    unit: s
    notes: 'Timed with `saggio measure`: python predict.py --num_samples 500. The command performed 500
      units of work, so the figure is the wall-clock time divided by 500.'
  costs:
    time:
      value: 0.0011259629999985918
      status: measured
      unit: s
      derived_from:
      - scenarios[0].runtime
      notes: 'Timed with `saggio measure`: python predict.py --num_samples 500. The command performed
        500 units of work, so the figure is the wall-clock time divided by 500.'
    energy:
      value: 3.929610869995085e-08
      status: estimated
      unit: kWh
      source_url: https://doi.org/10.1002/advs.202100707
      derived_from:
      - assumptions.machine_energy
      - assumptions.pue
      notes: 'Machine energy x power usage effectiveness: what the building draws.'
    money:
      value: 9.431066087988204e-09
      status: estimated
      unit: USD
      currency: USD
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.electricity_price
      notes: Facility energy x price per kilowatt-hour; hardware and staff are not included.
    carbon:
      value: 2.2005820871972474e-06
      status: estimated
      unit: gCO2e
      source_url: https://doi.org/10.1002/advs.202100707
      derived_from:
      - scenarios[0].costs.energy
      - assumptions.grid_carbon_intensity
      notes: Facility energy x grid carbon intensity, operating emissions only.
    water:
      value: null
      status: TODO
      unit: L
      derived_from:
      - assumptions.machine_energy
      - assumptions.water_usage_effectiveness
      notes: Needs the machine's energy and a published water usage effectiveness.
projections:
  whole_run:
    description: What a whole run would cost, from the per-unit costs in scenarios[0]. A whole run performs
      5000 num_samples, as config.py::num_samples states. This assumes one unit of work is one num_sample;
      if the model's unit of work means something else, restate this.
    costs:
      time:
        method: Whole run = measured slice / 0.0002.
        result:
          value: 5.629814999992959
          status: estimated
          unit: s
          notes: Projected from a slice covering 0.02% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
      energy:
        method: Whole run = measured slice / 0.0002.
        result:
          value: 0.00019648054349975422
          status: estimated
          unit: kWh
          notes: Projected from a slice covering 0.02% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
      money:
        method: Whole run = measured slice / 0.0002.
        result:
          value: 4.715533043994102e-05
          status: estimated
          unit: USD
          currency: USD
          notes: Projected from a slice covering 0.02% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
      carbon:
        method: Whole run = measured slice / 0.0002.
        result:
          value: 0.011002910435986236
          status: estimated
          unit: gCO2e
          notes: Projected from a slice covering 0.02% of the run.
        assumptions:
        - The remaining work costs the same per unit as the slice that was run.
        - Warm-up, checkpointing, and data loading are spread evenly across the run.
        limits:
        - A run whose later stages differ in shape, such as a learning-rate schedule that changes batch
          size, will not scale linearly.
        - One-off costs paid entirely inside the slice are counted as though they recurred throughout.
analysis:
  evidence_source: static
  archetype: inference
  languages:
  - Python
  language_file_counts:
    Python: 2
  total_work:
    unit: num_samples
    stated_as: '5000'
    source: config.py::num_samples
  has_tests: false
exclusions:
- Making the hardware. Only the electricity to run it is counted.
- The people. Salaries, offices, and travel are out of scope.
- Idle capacity. This is the cost of one unit of work, not of being ready.
provenance_rules:
- Every sourced value carries source_url and retrieved_date.
- A derived value names its inputs and never outranks the weakest of them.
- The country is stated by a human, never inferred from a developer's locale.
