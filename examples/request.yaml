analysis:
  evidence_source: static
  archetype: command-line-tool
  languages:
  - Python
  - JavaScript
  language_file_counts:
    Python: 126
    JavaScript: 2
  frameworks:
  - ffmpeg
  total_work:
    unit: num_samples
    stated_as: '400000'
    source: examples/walkthrough/counter/config.py::num_samples
  has_tests: true
  llm_note: No local model was reachable; the read is static only.
exclusions:
- Making the hardware. Only the electricity to run it is counted.
- The people. Salaries, offices, and travel are out of scope.
- Idle capacity is inside these figures, not outside them. The power was read from the machine's own counters,
  which meter hardware and not processes.
provenance_rules:
- Every sourced value carries source_url and retrieved_date.
- A derived value names its inputs and never outranks the weakest of them.
- The country is stated by a human, never inferred from a developer's locale.
