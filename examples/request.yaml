schema_version: '2.1'
date_updated: '2026-10-18'
project:
  name: saggio — one HTTP request served
  audited_from: ~/saggio
unit_of_work:
  name: one /scopes request handled end to end
  description: 'One POST to the HTTP surface''s /scopes route, placing a small cost model in a greenhouse-gas
    inventory and answering as JSON. Measured over two hundred requests from a client on the same machine,
    so the figure covers the client and the server together: that is what the machine''s counter can see,
    and splitting it would be a model rather than a measurement.'
  status: measured
  out_of_scope:
  - Network transit, since client and server are the same machine.
  - Server start-up, which happens before the measurement window.
  - TLS, which a local HTTP listener does not do.
deployment:
  provider: on-prem
  country: FR
  country_provenance: Stated by the caller.
  operating_system: darwin
  logical_cores: 12
  physical_cores: 12
  cpu: Apple M2 Max
assumptions:
  power_draw:
    value: 17.97703767288531
    status: measured
    unit: W
    notes: 'Read from the machine while the command ran. The figure covers the chip''s processor cores,
      graphics cores, and neural engine, from the system-on-chip''s own energy counters and the chip''s
      memory, from its own energy counter, read from the CPU Energy, GPU Energy, ANE0, DRAM0 counters.
      Memory is measured rather than estimated here: the machine publishes its own memory energy counter,
      so the figure is what the memory drew rather than what its installed capacity suggests it would
      draw. These are the chip''s own energy counters, which are a model inside the silicon rather than
      a meter on the power rail, and Apple says they are not a basis for comparing one machine against
      another. Left out of them: the display, storage, networking, the fans, and the power supply''s own
      losses. This is the whole machine''s draw, not this run''s alone: these counters meter hardware
      and not processes, so whatever else the machine was doing while the command ran is inside the figure.
      Nothing here established how much of it was, so treat the figure as an upper bound on what the run
      cost and not as what it cost.'
  pue:
    value: 1.5
    status: estimated
    unit: ratio
    source_url: https://www.uptimeinstitute.com/resources/research-and-reports/uptime-institute-global-data-center-survey-results-2024
    retrieved_date: '2026-09-12'
    notes: Power usage effectiveness published by On-premises.
  electricity_price:
    value: 0.276
    status: estimated
    unit: USD/kWh
    currency: USD
    source_url: https://www.globalpetrolprices.com/electricity_prices/
    retrieved_date: '2026-10-17'
    notes: Indicative tariff for France. Collected Q3 2026.
  grid_carbon_intensity:
    value: 41.2
    status: estimated
    unit: gCO2e/kWh
    source_url: https://ember-energy.org/data/yearly-electricity-data/
    retrieved_date: '2026-10-17'
    notes: Annual average for France, data year 2025.
  market_carbon_intensity:
    value: null
    status: TODO
    unit: gCO2e/kWh
    source_url: ''
    notes: 'The emission factor of the electricity you contracted for, which no catalogue can hold: it
      is a property of your contract, not of your country. It is built from your supplier''s own emission
      factor, from the contractual instruments you hold — guarantees of origin, RECs, a PPA — or, failing
      both, from your market''s residual mix, which exists precisely so that unclaimed electricity is
      not counted as clean by default. Record it with the supplier document or certificate that states
      it and the date you read it — this is the one figure in the model nobody else can check and nothing
      here can refresh. Leaving it open is a complete answer; a zero because the electricity is ''green''
      is not one.'
  water_usage_effectiveness:
    value: null
    status: TODO
    unit: L/kWh
    notes: On-premises publishes no water usage effectiveness. Leave this open rather than inventing a
      figure.
  hardware_embodied_carbon:
    value: null
    status: TODO
    unit: kgCO2e
    notes: No product carbon footprint is on file for apple-m2-max. Add `embodied_kgco2e` to its catalogue
      row with the footprint's own URL and the date it was read; `saggio catalog add cpu` does the rest.
  hardware_lifetime:
    value: null
    status: TODO
    unit: years
    notes: How long this hardware stays in service, which only you know. The published footprints are
      cradle-to-gate and exclude the use phase, so none of them states a lifespan. Reported figures cluster
      between three and six years; choosing within that range moves the embodied carbon by a factor of
      two, which is why this is asked rather than assumed.
  machine_energy:
    value: 1.9242426598611112e-08
    status: measured
    unit: kWh
    source_url: https://doi.org/10.1002/advs.202100707
    derived_from:
    - scenarios[0].runtime
    - assumptions.power_draw
    notes: runtime in hours x average power in watts / 1000.
