# A conda environment for people who prefer one. It installs Python and pip, then
# this package from the checkout, with the test and lint tooling. Installing the
# package is what puts the `saggio` command on the path; installing only its
# dependencies would leave you with an environment that cannot run it.
#
# The dependency list itself lives in pyproject.toml and nowhere else. The
# requirements*.txt files in this repository are a convenience for tools that
# still expect that shape, and are kept in step with pyproject.toml by hand.
name: env-for-saggio
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - pip
  - pip:
      - --editable .[dev]
