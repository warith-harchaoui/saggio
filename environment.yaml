# A conda environment for people who prefer one. It installs Python and pip, then
# the package itself; every dependency of the package is a pip dependency, so
# there is no second list here that could drift out of step with pyproject.toml.
name: env-for-saggio
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - pip
  - pip:
      - -r requirements-dev.txt
