pitch:
  problem:
  - 0
  - 1
  - 2
  solution:
  - 3
  magic:
  - 4
scenes:
- start: 0.0
  text: Any tool will give you a number, confidently. This one, just as confidently, will tell you when it has no business giving you one.
- start: 8.145
  text: saggio reads your repository and writes what it costs to run as a file, committed next to the code, reviewable in a pull request. Money, time, energy, carbon, water, per unit of work you name.
- start: 21.196
  text: Because the dangerous number is not the one you are missing. It is the confident one, orders of magnitude out, carrying a perfectly tidy list of its sources.
- start: 31.282
  text: So every number carries a status. Measured means a counter on the machine said so. Estimated means a sourced formula said so. Placeholder holds the field open. TODO means a human still has to answer.
- start: 44.995
  text: And here is the part nobody else does. A derived number names what it came from. It may never outrank the worst of them. Nor may it pin the answer down more tightly than they do. The validator recomputes it. Every unit goes down to its base dimensions. More than a percent out is an error.
- start: 63.017
  text: Here it is on a real model. The French grid intensity is sourced. It is still only good to a fifth either way. So the carbon figure computed from it is not allowed to be a single number. Delete the interval. The model stops validating.
- start: 78.095
  text: Thirteen verbs, five runtime dependencies, five surfaces over one engine. Read it at deraison dot a i slash saggio. If it is useful, leave a star on GitHub.
- start: 89.674
  text: Because a figure that refuses to exist is worth more than one that was invented.
