# The film's checkable contract. Generated by `make_spec.py`.
# -------------------------------------------------------------
# The claims, the pitch and the asset ledger are written by hand in
# `claims.yaml`. The scene starts and the narration below are derived
# from the measured length of each narration file. A scene's own length
# is measured; the share each of its sentences takes of that length is
# apportioned by how long the sentence is, which is the same arithmetic
# the caption writer applies to the halves of a line it splits.
# from the measured length of each narration file, so they cannot
# drift against the voice. Regenerate rather than edit:
#     python film/make_spec.py

name: what-it-costs
claims:
- text: 13 verbs
  value: 13
  source:
    path: saggio/cli/app.py
    method: regex_count
    selector: '@cli\.(?:command|group)\('
- text: 5 runtime dependencies
  value: 5
  source:
    path: pyproject.toml
    method: regex_count
    selector: \n\s*"(?:os-helper|PyYAML|platformdirs|Babel|click)[>=<]
- text: 5 surfaces
  value: 5
  source:
    path: README.md
    method: regex_count
    selector: \n\| (?:Library|Command line|HTTP API|Agent protocol|Skill) \|
- text: 8 footprints of 37 parts
  value: 8
  source:
    path: saggio/data/hardware.yaml
    method: regex_count
    selector: '\n\s*embodied_kgco2e:'
- text: 8 footprints of 37 parts
  value: 37
  source:
    path: saggio/data/hardware.yaml
    method: regex_count
    selector: '\n\s*(?:tdp_w|w_per_core):'
- text: 'value: 0.0014'
  value: '0.0014'
  source:
    path: README.md
    method: literal
    selector: '0.0014'
- text: 'unit: "gCO2e"'
  value: gCO2e
  source:
    path: README.md
    method: literal
    selector: gCO2e
- text: more than 1% out is an error
  value: more than a percent from what its inputs give is an error
  source:
    path: README.md
    method: literal
    selector: more than a percent from what its inputs give is an error
- text: measured, estimated, placeholder, TODO
  value: frozenset({MEASURED, ESTIMATED, PLACEHOLDER, TODO})
  source:
    path: saggio/model/taxonomy.py
    method: literal
    selector: frozenset({MEASURED, ESTIMATED, PLACEHOLDER, TODO})
assets:
- rel: film/script.yaml
  provenance: tracked
  source: film/script.yaml
- rel: film/claims.yaml
  provenance: tracked
  source: film/claims.yaml
- rel: film/composition/fonts/Roboto-Variable.woff2
  provenance: tracked
  source: film/composition/fonts/Roboto-Variable.woff2
- rel: film/composition/fonts/Roboto-Serif-Variable.woff2
  provenance: tracked
  source: film/composition/fonts/Roboto-Serif-Variable.woff2
- rel: film/composition/fonts/Roboto-Mono-Variable.woff2
  provenance: tracked
  source: film/composition/fonts/Roboto-Mono-Variable.woff2
- rel: film/composition/index.en.html
  provenance: derived
  recipe: python film/compose.py
- rel: film/composition/index.fr.html
  provenance: derived
  recipe: python film/compose.py
- rel: film/narration/en/question/narration.wav
  provenance: derived
  recipe: python film/narrate_film.py en
- rel: film/narration/fr/question/narration.wav
  provenance: derived
  recipe: python film/narrate_film.py fr
pitch:
  problem:
  - 0
  - 1
  - 2
  solution:
  - 3
  magic:
  - 5
scenes:
- start: 0.0
  text: Somebody is going to ask what it costs to run your code. Money, time, energy, carbon, water.
- start: 6.31
  text: You will answer with a number. It will come from a spreadsheet, or from a coefficient that was true on a machine that is not yours.
- start: 13.985
  text: The dangerous number is not the one you are missing. It is the confident one, orders of magnitude out, carrying a perfectly tidy list of its sources.
- start: 23.794
  text: saggio writes the answer as a file, committed next to the code, reviewable in a pull request.
- start: 29.784
  text: Every number in it carries a status. Measured means a counter on the machine said so. Estimated means a sourced formula said so. Placeholder holds the field open. TODO means a human still has to answer.
- start: 43.625
  text: Every derived number names the numbers it came from, so one rule follows. A derived value may never claim to be better founded than the worst of its inputs.
- start: 53.434
  text: The derivation is checked rather than declared. The validator reads every unit down to its base dimensions, recomputes the value from its named inputs, then calls anything more than a percent out an error.
- start: 66.549
  text: It never invents. An unresolved country gives a TODO rather than a zero. Eight hardware footprints ship out of thirty-seven parts. The catalogue says so by name.
- start: 77.147
  text: Thirteen verbs, five runtime dependencies, five surfaces over one engine. pip install saggio.
