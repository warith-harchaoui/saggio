scenes:
- start: 0.0
  text: saggio tells you what it costs to run your code. Money, time, energy, carbon and water, per unit of work.
- start: 8.081
  text: Any tool will give you a number, confidently.
- start: 11.361
  text: The dangerous one is orders of magnitude out, with a perfectly tidy list of sources underneath.
- start: 17.905
  text: saggio writes the answer as a file next to your code. Every number in it carries a status. Measured, a counter said so. Estimated, a sourced formula did. Placeholder holds the field open. TODO means a human still has to answer.
- start: 34.823
  text: Here is the part nobody else does. A derived number may never claim to be better founded than the worst of its inputs.
- start: 43.063
  text: Measure the power, the energy becomes measured. The carbon stays estimated, because nobody measured the grid. The validator recomputes every derivation, unit by unit. More than a percent out is an error.
- start: 57.208
  text: On a real model, the French grid intensity is sourced. It is still only known to a fifth either way. So the carbon computed from it is not allowed to be a single number. Delete the interval, the model stops validating.
- start: 71.917
  text: pip install saggio. Read it at deraison dot a i slash saggio. And if it earns it, leave a star on GitHub.
