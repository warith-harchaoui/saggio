# What the film asserts, and where each assertion is checked.
# ------------------------------------------------------------------
# These are the parts of `film.yaml` a person writes. The timings, the
# narration and the scene list are derived from the measured audio by
# `make_spec.py`, because a start time typed by hand is a start time
# that drifts against the voice the moment a line is reworded.
#
# Re-check after any change to the package:
#     make-film verify film/film.yaml --root .
#     make-film scan film/hf/saggio-en-landscape/index.html --spec film/film.yaml
#
# A `regex_count` selector is matched without the multiline flag, so a
# pattern anchored on `^` matches the start of the file and nothing else.
# Line starts are written `\n` here for that reason.

claims:
  - text: "33.8 to 50.2"
    value: "33.827318042561515"
    source:
      path: examples/uncertainty.yaml
      method: literal
      selector: "33.827318042561515"

  - text: "9.76e-07 to 1.45e-06"
    value: "9.76379526692795e-07"
    source:
      path: examples/uncertainty.yaml
      method: literal
      selector: "9.76379526692795e-07"

  # The same two intervals as the French cut writes them, decimal comma and
  # all. The scan reads the screen, and the screen is in French.
  - text: "33,8 à 50,2"
    value: "33.827318042561515"
    source:
      path: examples/uncertainty.yaml
      method: literal
      selector: "33.827318042561515"

  - text: "9,76e-07 à 1,45e-06"
    value: "9.76379526692795e-07"
    source:
      path: examples/uncertainty.yaml
      method: literal
      selector: "9.76379526692795e-07"

  - text: 'unit: "gCO2e"'
    value: "gCO2e"
    source:
      path: README.md
      method: literal
      selector: "gCO2e"

  - text: "more than 1% out is an error"
    value: "more than a percent from what its inputs give is an error"
    source:
      path: README.md
      method: literal
      selector: "more than a percent from what its inputs give is an error"

  - text: "measured, estimated, placeholder, TODO"
    value: "frozenset({MEASURED, ESTIMATED, PLACEHOLDER, TODO})"
    source:
      path: saggio/model/taxonomy.py
      method: literal
      selector: "frozenset({MEASURED, ESTIMATED, PLACEHOLDER, TODO})"


# Which scenes carry which beat, by index into the generated scene list:
# what it is (0), the problem (1, 2), the solution (3), then the one
# non-obvious thing that makes the solution possible (4, 5).
pitch:
  problem: [1, 2]
  solution: [3]
  magic: [4, 5]

assets:
  - rel: film/script.yaml
    provenance: tracked
    source: film/script.yaml
  - rel: film/claims.yaml
    provenance: tracked
    source: film/claims.yaml
  - rel: film/lexicon/en.yaml
    provenance: tracked
    source: film/lexicon/en.yaml
  - rel: film/lexicon/fr.yaml
    provenance: tracked
    source: film/lexicon/fr.yaml
  - rel: film/narration/en/narration.wav
    provenance: derived
    recipe: python film/narrate_film.py en
  - rel: film/narration/fr/narration.wav
    provenance: derived
    recipe: python film/narrate_film.py fr
  - rel: film/hf/saggio-en-landscape/index.html
    provenance: derived
    recipe: python film/compose.py
  - rel: film/hf/saggio-fr-landscape/index.html
    provenance: derived
    recipe: python film/compose.py
