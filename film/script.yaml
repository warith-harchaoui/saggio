# What the film says and shows, scene by scene, in both languages.
# ------------------------------------------------------------------
# Ninety seconds on the spine every Sprezzature film follows, in Guy
# KAWASAKI's order: what it is, the problem, the solution, the secret
# sauce, the finest example, then the ask. The suite's films name the beat
# in a rail above the picture; this one keeps the order and leaves the
# labels off.
#
# A scene's `narration` is what the voice says, one sentence per item.
# Everything else is what the frame shows, drawn by the Sprezzature film
# engine (`~/sprezzature/brag-output/build_films.py`) from the scene's
# `type`: `what`, `held`, `claim`, `panel`, `flow`, `verify`, `cta`.
# They are written separately on purpose: a film whose captions are its
# slides is a film nobody needs to watch.
#
# No scene carries a time. The voice is read first, and every cut is
# placed where the measured audio says the line before it stopped, then
# moved to the next beat of the music.

film:
  name: what-it-costs
  # The length a cut is held to when the voice finishes early. A script
  # that runs past it lengthens the film instead: the voice is never cut.
  duration: 90.0
  # Silence between two sentences of one scene, and between two scenes.
  pause_ms: 280
  scene_pause_ms: 650

scenes:

  # WHAT IT IS --------------------------------------------------------
  - id: what
    beat: what
    type: what
    logo: saggio-logo.png
    tagline:
      en: saggio is a cost model for code
      fr: saggio est un modèle de coût pour le code
    mark: saggio
    line:
      en: What it costs to run your code and how far to trust it.
      fr: Ce que coûte votre code à l'exécution et jusqu'où s'y fier.
    url: deraison.ai/saggio
    narration:
      en:
        - saggio tells you what it costs to run your code.
        - Money, time, energy, carbon and water, per unit of work.
      fr:
        - saggio vous dit ce que coûte l'exécution de votre code.
        - Argent, temps, énergie, carbone, eau, par unité de travail.

  # PROBLEM -----------------------------------------------------------
  - id: any-tool
    beat: problem
    type: held
    line:
      en: Any tool will give you a number.
      fr: Tous les outils vous donnent un chiffre.
    narration:
      en:
        - Any tool will give you a number, confidently.
      fr:
        - Un chiffre, tous les outils vous en donnent un, avec assurance.

  - id: confident
    beat: problem
    type: claim
    line:
      en: The dangerous number is the confident one.
      fr: Le chiffre dangereux est celui qui a l'air sûr de lui.
    narration:
      en:
        - The dangerous one is orders of magnitude out, with a perfectly tidy list of sources underneath.
      fr:
        - Le plus dangereux se trompe de plusieurs ordres de grandeur, avec en dessous une liste de sources impeccable.

  # SOLUTION ----------------------------------------------------------
  - id: statuses
    beat: solution
    type: panel
    eyebrow:
      en: Every number carries a status
      fr: Chaque nombre a un statut
    rows:
      - [measured, {en: "A counter on the machine said so.", fr: "Un compteur de la machine l'a dit."}]
      - [estimated, {en: "A sourced formula said so.", fr: "Une formule sourcée l'a dit."}]
      - [placeholder, {en: "The field is held open.", fr: "Le champ est tenu ouvert."}]
      - [TODO, {en: "A human still has to answer.", fr: "Un humain doit encore répondre."}]
    caption:
      en: One YAML file, committed next to the code.
      fr: Un fichier YAML, versionné à côté du code.
    narration:
      en:
        - saggio writes the answer as a file next to your code. Every number in it carries a status.
        - Measured, a counter said so. Estimated, a sourced formula did.
        - Placeholder holds the field open. TODO means a human still has to answer.
      fr:
        - saggio écrit la réponse dans un fichier, à côté du code. Chaque nombre y a un statut.
        - Mesuré, un compteur l'a dit. Estimé, une formule sourcée.
        - Réservé tient la place. TODO veut dire qu'un humain doit encore répondre.

  # SECRET SAUCE ------------------------------------------------------
  - id: weakest-link
    beat: magic
    type: claim
    line:
      en: A derived number never outranks its weakest input.
      fr: Un nombre dérivé ne dépasse jamais sa plus faible source.
    narration:
      en:
        - Here is the part nobody else does.
        - A derived number may never claim to be better founded than the worst of its inputs.
      fr:
        - Voici ce que personne d'autre ne fait.
        - Un nombre dérivé ne se prétend jamais mieux fondé que le plus faible de ceux dont il découle.

  - id: chain
    beat: magic
    type: flow
    eyebrow:
      en: Power × time, then × the grid
      fr: Puissance × durée, puis × le réseau
    stages:
      - [{en: runtime, fr: durée}, {en: measured, fr: mesurée}]
      - [{en: power, fr: puissance}, {en: measured, fr: mesurée}]
      - [{en: energy, fr: énergie}, {en: measured, fr: mesurée}]
      - [{en: grid intensity, fr: intensité du réseau}, {en: estimated, fr: estimée}]
      - [{en: carbon, fr: carbone}, {en: estimated, fr: estimé}]
    caption:
      en: Recomputed down to base units. More than 1% out is an error.
      fr: Recalculé jusqu'aux unités de base. Plus de 1 % d'écart, c'est une erreur.
    narration:
      en:
        - Measure the power, the energy becomes measured.
        - The carbon stays estimated, because nobody measured the grid.
        - The validator recomputes every derivation, unit by unit. More than a percent out is an error.
      fr:
        - Mesurez la puissance, l'énergie devient mesurée.
        - Le carbone reste estimé, faute de mesure sur le réseau électrique.
        - Le validateur recalcule chaque dérivation, unité par unité. Au-delà d'un pour cent d'écart, c'est une erreur.

  # AT ITS BEST -------------------------------------------------------
  - id: interval
    beat: example
    type: verify
    eyebrow:
      en: At its best, it refuses
      fr: À son meilleur, il refuse
    claims:
      - [{en: "French grid, gCO2e/kWh", fr: "Réseau français, gCO2e/kWh"}, {en: "33.8 to 50.2", fr: "33,8 à 50,2"}]
      - [{en: "One request, gCO2e", fr: "Une requête, gCO2e"}, {en: "9.76e-07 to 1.45e-06", fr: "9,76e-07 à 1,45e-06"}]
    caption:
      en: Delete the interval, the model fails to validate.
      fr: Effacez l'intervalle, le modèle ne passe plus la validation.
    narration:
      en:
        - On a real model, the French grid intensity is sourced. It is still only known to a fifth either way.
        - So the carbon computed from it is not allowed to be a single number.
        - Delete the interval, the model stops validating.
      fr:
        - Sur un vrai modèle, l'intensité du réseau français est sourcée, mais connue à un cinquième près.
        - Le carbone qui en découle n'a donc pas le droit d'être un seul nombre.
        - Effacez l'intervalle, le modèle ne passe plus la validation.

  # YOUR TURN ---------------------------------------------------------
  - id: cta
    beat: cta
    type: cta
    logo: saggio-logo.png
    mark: saggio
    actions:
      - ["★", {en: "A star, if it deserves it", fr: "Une étoile, si ça le mérite"}, github.com/warith-harchaoui/saggio]
      - ["→", {en: "Go and read it", fr: "Allez le lire"}, deraison.ai/saggio]
    punchline:
      en: Every number says how far it can be trusted.
      fr: Chaque nombre dit jusqu'où s'y fier.
    narration:
      en:
        - pip install saggio. Read it at deraison dot a i slash saggio.
        - And if it earns it, leave a star on GitHub.
      fr:
        - pip install saggio. À lire sur deraison point a i slash saggio.
        - Si ça le mérite, laissez une étoile sur GitHub.
