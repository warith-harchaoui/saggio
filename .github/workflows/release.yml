# What a release has to survive before it goes out, and nothing else.
#
# This job does not publish. It did, for an afternoon, through PyPI's trusted
# publishing — no token anywhere, an identity minted per run. The mechanism is
# sound and the configuration is a form on another website, which is a strange
# thing to stand between a tested wheel and an index. So the machine does the
# part a machine is better at, and the one command that publishes stays where
# the person is:
#
#     python -m build && python -m twine upload dist/*
#
# What the machine is better at is the part that has actually caught things. A
# working tree that passes every test can still produce a wheel that does not
# import, because a working tree resolves its dependencies once, long ago, and a
# user resolves them today. That is exactly how 1.5.0 was nearly released with
# an unbounded `mcp`: everything green here, `TypeError` on the first install
# anywhere else. So this builds the artefacts, installs the wheel into an
# environment that has never seen this repository, and runs it there.
#
# The artefacts are kept on the run. Download `dist` and upload *that* — the
# bytes this job tested — rather than rebuilding on a laptop and hoping the two
# agree.

name: release check

on:
  push:
    tags:
      # Releases are tagged without a `v`, which is what the five before this
      # one did. A tag shaped any other way is not a release and is ignored.
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check the artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install the package as a user would, extras included
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev,api]"

      - name: The whole suite, doctests included
        run: python -m pytest -n auto

      - name: Build the wheel and the sdist
        run: |
          rm -rf dist
          python -m build

      # `twine check` is what says the README will render on the index. It is
      # the one defect 1.4.2 existed to fix, so it is checked rather than hoped.
      - name: Check what the index will show
        run: python -m twine check dist/*

      # The artefact is tested as an artefact: installed from the wheel into an
      # environment that has never seen this repository, with the extra a reader
      # is told to install. This is where 1.5.0's dependency bound was found.
      - name: Install the wheel into an empty environment and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install "$(ls dist/*.whl)[api]"
          cd /tmp
          /tmp/fresh/bin/saggio --version
          /tmp/fresh/bin/python -m saggio --version
          # This fails the check when a catalogue row has gone stale, which is
          # deliberate: the figures ship inside the wheel, and a release is the
          # moment they are handed to people who will quote them. Re-read the
          # source with `saggio catalog refresh`; do not re-date it.
          /tmp/fresh/bin/saggio catalog freshness
          /tmp/fresh/bin/python -c "import saggio.api.mcp as m; print('surfaces import:', m.app.title)"

      - name: Say what these artefacts are, and how to publish them
        run: |
          python - <<'PY'
          import email, glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              name = next(n for n in archive.namelist() if n.endswith("METADATA"))
              meta = email.message_from_string(archive.read(name).decode())
          print("version:", meta["Version"])
          print("author:", meta["Author-email"])
          print("extras:", meta.get_all("Provides-Extra"))
          PY
          echo
          echo "Download the dist artefact from this run, then:"
          echo "    python -m twine upload dist/*"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
