# Publishing, with no credential anywhere in it.
#
# This workflow exists because of how the alternative goes wrong. A PyPI API
# token has to live somewhere: in a developer's shell history, in a secrets
# file, in a repository secret. Every one of those is a long-lived credential
# that publishes under the maintainer's name, and the only way to know it has
# leaked is to find out afterwards.
#
# Trusted publishing removes the token entirely. GitHub mints a short-lived
# OpenID Connect identity for *this workflow in this repository*, PyPI verifies
# it against the publisher configured on the project, and the upload is
# authorised for that run and nothing else. Nothing to store and nothing to
# rotate.
#
# It is configured once, on PyPI, under the project's Publishing settings:
#
#   Owner            warith-harchaoui
#   Repository       saggio
#   Workflow         release.yml
#   Environment      pypi
#
# Then a tag publishes the release, and nobody types a secret.
#
# The gate runs here rather than being trusted from elsewhere. The `checks`
# workflow watches branches; a tag can point at a commit no branch run covered,
# which is exactly how a release goes out green-looking and broken. So this
# builds the artefacts, runs the whole suite against the *installed wheel*
# rather than the working tree, and only then publishes. That order is the one
# thing this file is for: the 1.5.0 release was caught by an install into an
# empty environment, after a working tree that passed everything.

name: release

on:
  push:
    tags:
      # Releases are tagged without a `v`, which is what the four before this
      # one did. A tag shaped any other way is not a release and is ignored.
      - "[0-9]+.[0-9]+.[0-9]+"
  # So a release can be re-run after a failure without moving a tag, which is
  # the manoeuvre that made 1.4.0 describe work it did not contain.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check the artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install the package as a user would, extras included
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev,api]"

      - name: The whole suite, doctests included
        run: python -m pytest -n auto

      - name: Build the wheel and the sdist
        run: |
          rm -rf dist
          python -m build

      # `twine check` is what says the README will render on the index. It is
      # the one defect 1.4.2 existed to fix, so it is checked rather than hoped.
      - name: Check what the index will show
        run: python -m twine check dist/*

      # The artefact is tested as an artefact: installed from the wheel into an
      # environment that has never seen this repository, with the extra a reader
      # is told to install. This is where 1.5.0's dependency bound was found.
      - name: Install the wheel into an empty environment and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install "$(ls dist/*.whl)[api]"
          cd /tmp
          /tmp/fresh/bin/saggio --version
          /tmp/fresh/bin/python -m saggio --version
          # This fails the release when a catalogue row has gone stale, which is
          # deliberate: the figures ship inside the wheel, and a release is the
          # moment they are handed to people who will quote them. Re-read the
          # source with `saggio catalog refresh`; do not re-date it.
          /tmp/fresh/bin/saggio catalog freshness
          /tmp/fresh/bin/python -c "import saggio.api.mcp as m; print('surfaces import:', m.app.title)"

      - name: Say what is about to be published
        run: |
          python - <<'PY'
          import email, glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              name = next(n for n in archive.namelist() if n.endswith("METADATA"))
              meta = email.message_from_string(archive.read(name).decode())
          print("version:", meta["Version"])
          print("author:", meta["Author-email"])
          print("extras:", meta.get_all("Provides-Extra"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is half of the trust relationship: PyPI is told to accept
    # this repository's workflow *in this environment*, so a run from anywhere
    # else is refused by the index rather than by a reviewer.
    environment:
      name: pypi
      url: https://pypi.org/project/saggio/
    permissions:
      # The whole credential story, in one line: a token minted for this run.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
