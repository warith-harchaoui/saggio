# Continuous integration, deliberately small.
#
# This used to be four jobs — two operating systems times two Python versions —
# and it had not gone green in twenty-five consecutive runs. A gate that is
# always red is not a gate: nobody reads it, nobody fixes it, and the one time it
# catches something real it looks exactly like the twenty-four times it did not.
# So it is one job that passes, rather than four that do not.
#
# What that costs, said plainly rather than quietly dropped:
#
#   - macOS is no longer exercised here. The package supports it and most of its
#     power-counter code is macOS-only, so that code is covered by the suite on a
#     developer's machine and not by this file.
#   - Only the floor of the supported range is run. `requires-python` is
#     ">=3.10,<3.14"; 3.10 is the version most likely to reject something, so it
#     is the one worth the single slot.
#
# The freshness gate stays a separate, scheduled job. A tariff going out of date
# is not the fault of whoever changed a docstring, so it opens the question on a
# schedule instead of failing a pull request. The list of supported platforms is
# still pinned to `saggio.analyze.capability.SUPPORTED_PLATFORMS` by a contract
# test, so this file dropping an OS cannot silently change what the package
# claims to support.

name: checks

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Monday morning, to ask whether the catalogue numbers still hold.
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux, Python 3.10
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        # The doctests run here too: every example in every docstring is executed,
        # so the documentation cannot drift away from the code.
        run: python -m pytest

  freshness:
    name: catalogue freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Which numbers has nobody checked lately
        run: saggio catalog freshness

      # An alarm with no exit is half a mechanism. When the step above fails,
      # this one says what to run, so the remedy is in the same log as the
      # complaint rather than somewhere in the documentation.
      - name: What to do about it
        if: failure()
        run: |
          echo "A figure above is stale or about to expire."
          echo
          echo "Re-read it, read-only first:"
          echo "    EMBER_API_KEY=... saggio catalog refresh grid --column all"
          echo
          echo "Read the diff, then write it and commit:"
          echo "    EMBER_API_KEY=... saggio catalog refresh grid --column all \\"
          echo "        --write saggio/data/grid.yaml"
          echo
          echo "A free Ember key comes from https://ember-energy.org/data/ ."
          echo "Do not substitute OWID: its series is lifecycle, not operating."
