<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="750" viewBox="0 0 1180 750" role="img" aria-labelledby="landscape-links-title landscape-links-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="landscape-links-title">One question, four links, and nobody answers all four</title>
<desc id="landscape-links-desc">The question “what does running this code cost” drawn as four links in order: what ran and how much of it, what it drew, what that costs, and per what and how well founded. Under each link are the tools that answer it best — the repository and the plan readers for the first, the power meters for the second, the sourced catalogues for the third, almost nobody for the fourth — and a pill saying what this package's own answer is worth: measured, TODO, estimated, measured. No tool on the page answers all four links.</desc>
<style>.paper{fill:#fbfbfa}.surface{fill:#ffffff}.sunken{fill:#f4f4f2}.ink{fill:#1a1a18}.soft{fill:#55554e}.faint{fill:#707068}.edge{stroke:#e2e2dc}.strong{stroke:#c9c9c0}.strong-fill{fill:#c9c9c0}.accent{fill:#1f6f5c}.accent-soft{fill:#e6f1ed}.measured{fill:#1f6f5c}.measured-bg{fill:#e6f1ed}.measured-edge{stroke:#1f6f5c}.estimated{fill:#936511}.estimated-bg{fill:#fbf1dd}.estimated-edge{stroke:#936511}.placeholder{fill:#5b5f97}.placeholder-bg{fill:#ecedf7}.placeholder-edge{stroke:#5b5f97}.todo{fill:#a33a2c}.todo-bg{fill:#fbeae7}.todo-edge{stroke:#a33a2c}.card{stroke-width:1}.t{font-size:26px;font-weight:700;letter-spacing:-.01em}.s{font-size:15px}.k{font-size:11.5px;font-weight:700;letter-spacing:.09em}.h{font-size:15.5px;font-weight:650}.b{font-size:13px}.n{font-size:12.5px}.c{font-size:12.5px}.v{font-size:17px;font-weight:650}@media (prefers-color-scheme: dark){.paper{fill:#14150f}.surface{fill:#1c1d16}.sunken{fill:#232419}.ink{fill:#eceadf}.soft{fill:#b4b2a4}.faint{fill:#8c8a78}.edge{stroke:#32332a}.strong{stroke:#494a3d}.strong-fill{fill:#494a3d}.accent{fill:#6bc4a8}.accent-soft{fill:#1c3129}.measured{fill:#6bc4a8}.measured-bg{fill:#1b3129}.measured-edge{stroke:#6bc4a8}.estimated{fill:#e0ac4e}.estimated-bg{fill:#33290f}.estimated-edge{stroke:#e0ac4e}.placeholder{fill:#a2a6e0}.placeholder-bg{fill:#23243a}.placeholder-edge{stroke:#a2a6e0}.todo{fill:#ef8a76}.todo-bg{fill:#3a1f19}.todo-edge{stroke:#ef8a76}}</style>
<rect class="paper" width="1180" height="750"/>
<defs><marker id="arrow-line" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="strong-fill"/></marker><marker id="arrow-measured" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="measured"/></marker><marker id="arrow-estimated" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="estimated"/></marker><marker id="arrow-placeholder" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="placeholder"/></marker><marker id="arrow-todo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="todo"/></marker></defs>
<text class="ink t" x="44" y="58">One question, four links, and nobody answers all four</text>
<text class="soft s" x="44" y="87.75">Every tool on this page answers part of “what does running this code cost” and hands the rest on. Reading left to right is reading the order the work</text>
<text class="soft s" x="44" y="109.05">has to happen in; the pill under each link is what this package's own answer to it is worth, including the one it has to refuse.</text>
<text class="faint k" x="44" y="136.6">THE LINK</text>
<g><rect class="accent" x="44" y="154.6" width="16" height="137.3" rx="10"/><rect class="surface edge card" x="50" y="154.6" width="249" height="137.3" rx="10"/><text class="ink h" x="66" y="188.41">What ran, and how much of</text><text class="ink h" x="66" y="210.42">it?</text><text class="faint n" x="66" y="235.37">A named unit of work, and a count</text><text class="faint n" x="66" y="253.12">of how many a full run performs.</text></g>
<g><rect class="accent" x="323" y="154.6" width="16" height="137.3" rx="10"/><rect class="surface edge card" x="329" y="154.6" width="249" height="137.3" rx="10"/><text class="ink h" x="345" y="188.41">What did it draw?</text><text class="faint n" x="345" y="213.36">A counter, and a rule for sharing a</text><text class="faint n" x="345" y="231.11">machine several things are using.</text></g>
<g><rect class="accent" x="602" y="154.6" width="16" height="137.3" rx="10"/><rect class="surface edge card" x="608" y="154.6" width="249" height="137.3" rx="10"/><text class="ink h" x="624" y="188.41">What does that cost?</text><text class="faint n" x="624" y="213.36">A tariff, a grid intensity, a water</text><text class="faint n" x="624" y="231.11">figure, a hardware footprint.</text></g>
<g><rect class="accent" x="881" y="154.6" width="16" height="137.3" rx="10"/><rect class="surface edge card" x="887" y="154.6" width="249" height="137.3" rx="10"/><text class="ink h" x="903" y="188.41">Per what, and how well</text><text class="ink h" x="903" y="210.42">founded?</text><text class="faint n" x="903" y="235.37">A committed artefact somebody can</text><text class="faint n" x="903" y="253.12">open in a pull request and disagree</text><text class="faint n" x="903" y="270.87">with.</text></g>
<text class="faint k" x="44" y="329.87">ANSWERED BEST BY</text>
<g><rect class="sunken edge card" x="44" y="347.87" width="255" height="107.8" rx="10"/><text class="soft b" x="60" y="379.13">The repository itself. Green</text><text class="soft b" x="60" y="397.59">Metrics Tool describes the run as</text><text class="soft b" x="60" y="416.05">a file; Infracost and Carbonifer</text><text class="soft b" x="60" y="434.51">read a plan.</text></g>
<g><rect class="sunken edge card" x="323" y="347.87" width="255" height="107.8" rx="10"/><text class="soft b" x="339" y="379.13">Scaphandre, PowerAPI, JoularJX,</text><text class="soft b" x="339" y="397.59">Kepler, CEEMS, EnergiBridge —</text><text class="soft b" x="339" y="416.05">per process, per method, per</text><text class="soft b" x="339" y="434.51">container, per job.</text></g>
<g><rect class="sunken edge card" x="602" y="347.87" width="255" height="107.8" rx="10"/><text class="soft b" x="618" y="379.13">Green Algorithms, Boavizta,</text><text class="soft b" x="618" y="397.59">Climatiq, Electricity Maps, Cloud</text><text class="soft b" x="618" y="416.05">Carbon Footprint — the sourced</text><text class="soft b" x="618" y="434.51">catalogues.</text></g>
<g><rect class="sunken edge card" x="881" y="347.87" width="255" height="107.8" rx="10"/><text class="soft b" x="897" y="379.13">Almost nobody. A filed Software</text><text class="soft b" x="897" y="397.59">Carbon Intensity (SCI) figure, and</text><text class="soft b" x="897" y="416.05">this.</text></g>
<text class="faint k" x="44" y="493.71">AND HERE</text>
<g><rect class="surface edge card" x="44" y="511.71" width="255" height="121.4" rx="10"/><text class="soft b" x="60" y="542.97">reads your code, then runs a</text><text class="soft b" x="60" y="561.43">capped slice once you agree</text><rect class="measured-bg" x="60" y="578.63" width="75.8" height="20" rx="6"/><text class="measured k" x="69" y="592.83" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g>
<g><rect class="surface edge card" x="323" y="511.71" width="255" height="121.4" rx="10"/><text class="soft b" x="339" y="542.97">reads the machine's counter; will</text><text class="soft b" x="339" y="561.43">not split it per process</text><rect class="todo-bg" x="339" y="578.63" width="46.9" height="20" rx="6"/><text class="todo k" x="348" y="592.83" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">TODO</text></g>
<g><rect class="surface edge card" x="602" y="511.71" width="255" height="121.4" rx="10"/><text class="soft b" x="618" y="542.97">sourced catalogues, and a</text><text class="soft b" x="618" y="561.43">held-open field where none</text><text class="soft b" x="618" y="579.89">publishes</text><rect class="estimated-bg" x="618" y="597.09" width="83.0" height="20" rx="6"/><text class="estimated k" x="627" y="611.29" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g>
<g><rect class="surface edge card" x="881" y="511.71" width="255" height="121.4" rx="10"/><text class="soft b" x="897" y="542.97">every number carries its status</text><text class="soft b" x="897" y="561.43">and the numbers it came from</text><rect class="measured-bg" x="897" y="578.63" width="75.8" height="20" rx="6"/><text class="measured k" x="906" y="592.83" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g>
<path class="strong" d="M302.0,223.2 L319.0,223.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M581.0,223.2 L598.0,223.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M860.0,223.2 L877.0,223.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<line class="edge" x1="44" y1="663.1" x2="1136" y2="663.1" stroke-width="1"/>
<text class="faint n" x="44" y="684.215">The pills are this package's own four statuses, used on itself. The second link is the one it refuses: a counter meters hardware, so the figure it reads is the machine's and not the</text>
<text class="faint n" x="44" y="701.965">run's, and it says so rather than dividing by something plausible. That refusal is the sixth column of the table above, where five other tools score higher.</text>
</svg>
