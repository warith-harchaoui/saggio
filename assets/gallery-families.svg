<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="gt gd" font-family="Roboto, -apple-system, Helvetica, Arial, sans-serif">
<title id="gt">What each kind of tool hands you</title>
<desc id="gd">Five families of cost and carbon tool compared on the artefact they produce, the unit their answer is per, and what each does when an input is missing.</desc>
<style>.paper{fill:#FFFFFF}.ink{fill:#1A1A1A}.muted{fill:#6B6B6B}.rule{stroke:#E4E4E4}.h{font-size:15px;font-weight:600;letter-spacing:.01em}.k{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.b{font-size:14px}.t{font-size:26px;font-weight:700;letter-spacing:-.01em}.s{font-size:14.5px}.n{font-size:12.5px}@media (prefers-color-scheme: dark){.paper{fill:#141414}.ink{fill:#F2F2F2}.muted{fill:#9A9A9A}.rule{stroke:#2E2E2E}.chip{fill-opacity:.26}}</style>
<rect class="paper" width="1180" height="560"/>
<text class="t ink" x="44" y="56">What each kind of tool hands you</text>
<text class="s muted" x="44" y="84">And what it does when an input is missing — the column that decides whether a figure can be quoted.</text>
<text class="k muted" x="44" y="146">Tool family</text>
<text class="k muted" x="268" y="146">The artefact it produces</text>
<text class="k muted" x="596" y="146">Its answer is per</text>
<text class="k muted" x="858" y="146">When a number is missing</text>
<line class="rule" x1="44" y1="160" x2="1136" y2="160" stroke-width="1"/>
<rect x="44" y="177" width="4" height="24" rx="2" fill="#007AFF"/>
<text class="h ink" x="60" y="196" font-weight="700">saggio</text>
<text class="b muted" x="268" y="196">a committed YAML model + a report</text>
<text class="b muted" x="596" y="196">one unit of work you named</text>
<rect class="chip" x="848" y="175" width="300" height="29" rx="8" fill="#007AFF" fill-opacity="0.13"/>
<text class="b ink" x="858" y="196">writes TODO, and the report says so</text>
<line class="rule" x1="44" y1="226" x2="1136" y2="226" stroke-width="1"/>
<rect x="44" y="239" width="4" height="24" rx="2" fill="#28CD41"/>
<text class="h ink" x="60" y="258" font-weight="600">Episode trackers</text>
<text class="b muted" x="268" y="258">a CSV log of the run that just ended</text>
<text class="b muted" x="596" y="258">one episode, however long it was</text>
<rect class="chip" x="848" y="237" width="300" height="29" rx="8" fill="#28CD41" fill-opacity="0.13"/>
<text class="b ink" x="858" y="258">emits a number anyway</text>
<line class="rule" x1="44" y1="288" x2="1136" y2="288" stroke-width="1"/>
<rect x="44" y="301" width="4" height="24" rx="2" fill="#AF52DE"/>
<text class="h ink" x="60" y="320" font-weight="600">Power daemons</text>
<text class="b muted" x="268" y="320">a live metrics stream, per process</text>
<text class="b muted" x="596" y="320">a moment, continuously</text>
<rect class="chip" x="848" y="299" width="300" height="29" rx="8" fill="#AF52DE" fill-opacity="0.13"/>
<text class="b ink" x="858" y="320">the series has a gap</text>
<line class="rule" x1="44" y1="350" x2="1136" y2="350" stroke-width="1"/>
<rect x="44" y="363" width="4" height="24" rx="2" fill="#FF9500"/>
<text class="h ink" x="60" y="382" font-weight="600">Calculators</text>
<text class="b muted" x="268" y="382">one answer to a form you filled in</text>
<text class="b muted" x="596" y="382">the hypothetical you described</text>
<rect class="chip" x="848" y="361" width="300" height="29" rx="8" fill="#FF9500" fill-opacity="0.13"/>
<text class="b ink" x="858" y="382">the field is required</text>
<line class="rule" x1="44" y1="412" x2="1136" y2="412" stroke-width="1"/>
<rect x="44" y="425" width="4" height="24" rx="2" fill="#808080"/>
<text class="h ink" x="60" y="444" font-weight="600">Spend tools</text>
<text class="b muted" x="268" y="444">a dashboard or a pull-request comment</text>
<text class="b muted" x="596" y="444">a bill, or a plan you have not run</text>
<rect class="chip" x="848" y="423" width="300" height="29" rx="8" fill="#808080" fill-opacity="0.13"/>
<text class="b ink" x="858" y="444">the line is absent from the bill</text>
<line class="rule" x1="44" y1="480" x2="1136" y2="480" stroke-width="1"/>
<text class="n muted" x="44" y="510">Families, not products: the named tools behind each row, with what separates them, are in LANDSCAPE.md. None of these rows is a verdict on quality —</text>
<text class="n muted" x="44" y="529">a live metrics stream is the right artefact for a daemon and the wrong one for a figure in a report, and the reverse holds too.</text>
</svg>
