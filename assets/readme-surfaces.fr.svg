<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="882" viewBox="0 0 1180 882" role="img" aria-labelledby="surfaces-title surfaces-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="surfaces-title">Un seul moteur, cinq surfaces</title>
<desc id="surfaces-desc">Cinq surfaces — une bibliothèque Python, la ligne de commande, une API HTTP, un protocole d'agent et une Agent Skill — appellent toutes les mêmes fonctions publiques, si bien que chacune rend le même modèle, les mêmes règles et le même rapport ; aucune ne peut ce que la bibliothèque ne peut pas, et la surface HTTP n'exécute le code de personne.</desc>
<style>.paper{fill:#fbfbfa}.surface{fill:#ffffff}.sunken{fill:#f4f4f2}.ink{fill:#1a1a18}.soft{fill:#55554e}.faint{fill:#707068}.edge{stroke:#e2e2dc}.strong{stroke:#c9c9c0}.strong-fill{fill:#c9c9c0}.accent{fill:#1f6f5c}.accent-soft{fill:#e6f1ed}.measured{fill:#1f6f5c}.measured-bg{fill:#e6f1ed}.measured-edge{stroke:#1f6f5c}.estimated{fill:#936511}.estimated-bg{fill:#fbf1dd}.estimated-edge{stroke:#936511}.placeholder{fill:#5b5f97}.placeholder-bg{fill:#ecedf7}.placeholder-edge{stroke:#5b5f97}.todo{fill:#a33a2c}.todo-bg{fill:#fbeae7}.todo-edge{stroke:#a33a2c}.card{stroke-width:1}.t{font-size:26px;font-weight:700;letter-spacing:-.01em}.s{font-size:15px}.k{font-size:11.5px;font-weight:700;letter-spacing:.09em}.h{font-size:15.5px;font-weight:650}.b{font-size:13px}.n{font-size:12.5px}.c{font-size:12.5px}.v{font-size:17px;font-weight:650}@media (prefers-color-scheme: dark){.paper{fill:#14150f}.surface{fill:#1c1d16}.sunken{fill:#232419}.ink{fill:#eceadf}.soft{fill:#b4b2a4}.faint{fill:#8c8a78}.edge{stroke:#32332a}.strong{stroke:#494a3d}.strong-fill{fill:#494a3d}.accent{fill:#6bc4a8}.accent-soft{fill:#1c3129}.measured{fill:#6bc4a8}.measured-bg{fill:#1b3129}.measured-edge{stroke:#6bc4a8}.estimated{fill:#e0ac4e}.estimated-bg{fill:#33290f}.estimated-edge{stroke:#e0ac4e}.placeholder{fill:#a2a6e0}.placeholder-bg{fill:#23243a}.placeholder-edge{stroke:#a2a6e0}.todo{fill:#ef8a76}.todo-bg{fill:#3a1f19}.todo-edge{stroke:#ef8a76}}</style>
<rect class="paper" width="1180" height="882"/>
<defs><marker id="arrow-line" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="strong-fill"/></marker><marker id="arrow-measured" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="measured"/></marker><marker id="arrow-estimated" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="estimated"/></marker><marker id="arrow-placeholder" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="placeholder"/></marker><marker id="arrow-todo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="todo"/></marker></defs>
<text class="ink t" x="44" y="58">Un seul moteur, cinq surfaces</text>
<text class="soft s" x="44" y="87.75">La personne qui produit un chiffre est rarement celle qui doit le déclarer, et la plupart des lecteurs n'installeront jamais un paquet Python. Le même</text>
<text class="soft s" x="44" y="109.05">moteur répond donc de cinq façons — et chacune est un adaptateur au-dessus des mêmes fonctions publiques, règle imposée par des tests plutôt</text>
<text class="soft s" x="44" y="130.35">qu'habitude.</text>
<text class="faint k" x="44" y="157.9">PAR OÙ ON L'ATTEINT</text>
<text class="faint k" x="486" y="157.9">CE QUI S'EXÉCUTE VRAIMENT</text>
<text class="faint k" x="830" y="157.9">CE QUI REVIENT</text>
<path class="strong" d="M436.0,234.5 C457.5,234.5 457.5,482.2 479.0,482.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M436.0,353.7 C457.5,353.7 457.5,482.2 479.0,482.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M436.0,482.2 C457.5,482.2 457.5,482.2 479.0,482.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M436.0,610.6 C457.5,610.6 457.5,482.2 479.0,482.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M436.0,729.9 C457.5,729.9 457.5,482.2 479.0,482.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M786.0,482.2 C804.5,482.2 804.5,369.8 823.0,369.8" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M786.0,482.2 C804.5,482.2 804.5,557.6 823.0,557.6" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<g><rect class="accent" x="44" y="181.9" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="181.9" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="245.4" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="215.71">Bibliothèque</text><text class="soft b" x="66" y="238.17">Un script, un notebook, un autre paquet.</text><text class="soft c" x="76" y="262.12" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">import saggio</text></g><g><rect class="accent" x="44" y="301.12" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="301.12" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="364.6" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="334.93">Ligne de commande</text><text class="soft b" x="66" y="357.39">Un terminal, et l'intégration continue.</text><text class="soft c" x="76" y="381.34" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">saggio audit .</text></g><g><rect class="accent" x="44" y="420.34" width="16" height="123.7" rx="10"/><rect class="surface edge card" x="50" y="420.34" width="386" height="123.7" rx="10"/><rect class="sunken" x="66" y="502.3" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="454.15">API HTTP</text><text class="soft b" x="66" y="476.61">Un navigateur, un service interne, une chaîne de</text><text class="soft b" x="66" y="495.07">reporting.</text><text class="soft c" x="76" y="519.02" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">uvicorn saggio.api.app:app</text></g><g><rect class="accent" x="44" y="558.02" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="558.02" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="621.5" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="591.83">Protocole d'agent</text><text class="soft b" x="66" y="614.29">Poser la question avec ses mots, dans sa langue.</text><text class="soft c" x="76" y="638.24" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">uvicorn saggio.api.mcp:app</text></g><g><rect class="accent" x="44" y="677.24" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="677.24" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="740.7" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="711.05">Skill</text><text class="soft b" x="66" y="733.51">Claude, et tout agent qui lit les Agent Skills.</text><text class="soft c" x="76" y="757.46" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">skills/saggio/</text></g>
<g><rect class="surface edge card" x="486" y="357.425" width="300" height="249.5" rx="10"/><rect class="sunken" x="502" y="402.4" width="268.0" height="132.2" rx="7"/><text class="ink h" x="502" y="391.235">Les mêmes fonctions publiques</text><text class="soft c" x="512" y="419.185" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">read_repository()</text><text class="soft c" x="512" y="436.935" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">run_slice()</text><text class="soft c" x="512" y="454.685" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">audit()</text><text class="soft c" x="512" y="472.435" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">validate()</text><text class="soft c" x="512" y="490.185" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">render_markdown()</text><text class="soft c" x="512" y="507.935" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">render_html()</text><text class="soft c" x="512" y="525.685" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">compare()</text><text class="faint n" x="502" y="550.435">Une surface ajoute l'analyse des arguments</text><text class="faint n" x="502" y="568.185">et l'affichage. Rien d'autre, et rien qui lui</text><text class="faint n" x="502" y="585.935">soit propre.</text></g>
<g><rect class="accent" x="830" y="303.41" width="16" height="132.8" rx="10"/><rect class="surface edge card" x="836" y="303.41" width="300" height="132.8" rx="10"/><text class="ink h" x="852" y="337.22">La même réponse</text><text class="soft b" x="852" y="359.68">Un modèle, un jeu de règles, un rapport.</text><text class="soft b" x="852" y="378.14">Un chiffre produit par une surface est</text><text class="soft b" x="852" y="396.6">celui que produisent les autres, puisque</text><text class="soft b" x="852" y="415.06">c'est la même fonction qui l'a produit.</text></g><g><rect class="todo" x="830" y="454.26" width="16" height="206.7" rx="10"/><rect class="surface edge card" x="836" y="454.26" width="300" height="206.7" rx="10"/><text class="ink h" x="852" y="488.07">Et les deux limites qui s'ensuivent</text><text class="soft b" x="852" y="510.53">Aucune surface ne peut ce que la</text><text class="soft b" x="852" y="528.99">bibliothèque ne peut pas : une capacité</text><text class="soft b" x="852" y="547.45">réservée à l'une serait interdite à tous les</text><text class="soft b" x="852" y="565.91">autres appelants. Et la surface HTTP</text><text class="soft b" x="852" y="584.37">n'exécute le code de personne — à travers</text><text class="soft b" x="852" y="602.83">un réseau, il n'y a personne à qui</text><text class="soft b" x="852" y="621.29">demander un consentement — et ne clone</text><text class="soft b" x="852" y="639.75">un dépôt que là où l'exploitant l'a permis.</text></g>
<line class="edge" x1="44" y1="812.5" x2="1136" y2="812.5" stroke-width="1"/>
<text class="faint n" x="44" y="833.585">Une sixième surface est un adaptateur de plus au-dessus des mêmes fonctions, et UTILISER.md dit ce qu'elle a et n'a pas le droit de faire.</text>
</svg>
