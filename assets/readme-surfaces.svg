<g><rect class="accent" x="44" y="160.6" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="160.6" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="224.1" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="194.41">Library</text><text class="soft b" x="66" y="216.87">A script, a notebook, another package.</text><text class="soft c" x="76" y="240.82" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">import saggio</text></g><g><rect class="accent" x="44" y="279.82" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="279.82" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="343.3" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="313.63">Command line</text><text class="soft b" x="66" y="336.09">A terminal, and continuous integration.</text><text class="soft c" x="76" y="360.04" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">saggio audit .</text></g><g><rect class="accent" x="44" y="399.04" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="399.04" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="462.5" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="432.85">HTTP API</text><text class="soft b" x="66" y="455.31">A browser, an internal service, a reporting pipeline.</text><text class="soft c" x="76" y="479.26" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">uvicorn saggio.api.app:app</text></g><g><rect class="accent" x="44" y="518.26" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="518.26" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="581.7" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="552.07">Agent protocol</text><text class="soft b" x="66" y="574.53">Asking in your own words, in your own language.</text><text class="soft c" x="76" y="598.48" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">uvicorn saggio.api.mcp:app</text></g><g><rect class="accent" x="44" y="637.48" width="16" height="105.2" rx="10"/><rect class="surface edge card" x="50" y="637.48" width="386" height="105.2" rx="10"/><rect class="sunken" x="66" y="700.9" width="354.0" height="25.8" rx="7"/><text class="ink h" x="66" y="671.29">Skill</text><text class="soft b" x="66" y="693.75">Claude, and any agent that reads Agent Skills.</text><text class="soft c" x="76" y="717.7" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">skills/saggio/</text></g>
<g><rect class="surface edge card" x="486" y="326.895" width="300" height="249.5" rx="10"/><rect class="sunken" x="502" y="371.9" width="268.0" height="132.2" rx="7"/><text class="ink h" x="502" y="360.705">The same public functions</text><text class="soft c" x="512" y="388.655" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">read_repository()</text><text class="soft c" x="512" y="406.405" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">run_slice()</text><text class="soft c" x="512" y="424.155" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">audit()</text><text class="soft c" x="512" y="441.905" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">validate()</text><text class="soft c" x="512" y="459.655" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">render_markdown()</text><text class="soft c" x="512" y="477.405" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">render_html()</text><text class="soft c" x="512" y="495.155" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">compare()</text><text class="faint n" x="502" y="519.905">A surface adds argument parsing and</text><text class="faint n" x="502" y="537.655">printing. Nothing else, and nothing of its</text><text class="faint n" x="502" y="555.405">own.</text></g>
<g><rect class="accent" x="830" y="272.88" width="16" height="132.8" rx="10"/><rect class="surface edge card" x="836" y="272.88" width="300" height="132.8" rx="10"/><text class="ink h" x="852" y="306.69">The same answer</text><text class="soft b" x="852" y="329.15">One model, one set of rules, one report. A</text><text class="soft b" x="852" y="347.61">figure produced through one surface is the</text><text class="soft b" x="852" y="366.07">figure the others produce, because it is</text><text class="soft b" x="852" y="384.53">the same function that produced it.</text></g><g><rect class="todo" x="830" y="423.73" width="16" height="206.7" rx="10"/><rect class="surface edge card" x="836" y="423.73" width="300" height="206.7" rx="10"/><text class="ink h" x="852" y="457.54">And the two limits that follow</text><text class="soft b" x="852" y="480">No surface may do what the library</text><text class="soft b" x="852" y="498.46">cannot: a capability only one of them had</text><text class="soft b" x="852" y="516.92">would be locked away from every other</text><text class="soft b" x="852" y="535.38">caller. And the HTTP surface runs</text><text class="soft b" x="852" y="553.84">nobody's code — over a network there is</text><text class="soft b" x="852" y="572.3">nobody to ask for consent — cloning a</text><text class="soft b" x="852" y="590.76">repository only where the operator</text><text class="soft b" x="852" y="609.22">allowed it.</text></g>
<line class="edge" x1="44" y1="772.7" x2="1136" y2="772.7" stroke-width="1"/>
<text class="faint n" x="44" y="793.825">A sixth surface is another adapter over the same functions, and USING.md says what it may and may not do.</text>
</svg>
