<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="823" viewBox="0 0 1180 823" role="img" aria-labelledby="chain-title chain-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chain-title">Where one figure comes from, and why it cannot outrank its inputs</title>
<desc id="chain-desc">A derivation chain for one inference: runtime and power draw, both measured, give the machine's energy; multiplied by an estimated power usage effectiveness it gives the building's energy, which is therefore only estimated; multiplied by an estimated grid carbon intensity it gives the carbon figure. The water branch ends in TODO because no water usage effectiveness is published for a self-run room.</desc>
<style>.paper{fill:#fbfbfa}.surface{fill:#ffffff}.sunken{fill:#f4f4f2}.ink{fill:#1a1a18}.soft{fill:#55554e}.faint{fill:#707068}.edge{stroke:#e2e2dc}.strong{stroke:#c9c9c0}.strong-fill{fill:#c9c9c0}.accent{fill:#1f6f5c}.accent-soft{fill:#e6f1ed}.measured{fill:#1f6f5c}.measured-bg{fill:#e6f1ed}.measured-edge{stroke:#1f6f5c}.estimated{fill:#936511}.estimated-bg{fill:#fbf1dd}.estimated-edge{stroke:#936511}.placeholder{fill:#5b5f97}.placeholder-bg{fill:#ecedf7}.placeholder-edge{stroke:#5b5f97}.todo{fill:#a33a2c}.todo-bg{fill:#fbeae7}.todo-edge{stroke:#a33a2c}.card{stroke-width:1}.t{font-size:26px;font-weight:700;letter-spacing:-.01em}.s{font-size:15px}.k{font-size:11.5px;font-weight:700;letter-spacing:.09em}.h{font-size:15.5px;font-weight:650}.b{font-size:13px}.n{font-size:12.5px}.c{font-size:12.5px}.v{font-size:17px;font-weight:650}@media (prefers-color-scheme: dark){.paper{fill:#14150f}.surface{fill:#1c1d16}.sunken{fill:#232419}.ink{fill:#eceadf}.soft{fill:#b4b2a4}.faint{fill:#8c8a78}.edge{stroke:#32332a}.strong{stroke:#494a3d}.strong-fill{fill:#494a3d}.accent{fill:#6bc4a8}.accent-soft{fill:#1c3129}.measured{fill:#6bc4a8}.measured-bg{fill:#1b3129}.measured-edge{stroke:#6bc4a8}.estimated{fill:#e0ac4e}.estimated-bg{fill:#33290f}.estimated-edge{stroke:#e0ac4e}.placeholder{fill:#a2a6e0}.placeholder-bg{fill:#23243a}.placeholder-edge{stroke:#a2a6e0}.todo{fill:#ef8a76}.todo-bg{fill:#3a1f19}.todo-edge{stroke:#ef8a76}}</style>
<rect class="paper" width="1180" height="823"/>
<defs><marker id="arrow-line" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="strong-fill"/></marker><marker id="arrow-measured" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="measured"/></marker><marker id="arrow-estimated" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="estimated"/></marker><marker id="arrow-placeholder" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="placeholder"/></marker><marker id="arrow-todo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="todo"/></marker></defs>
<text class="ink t" x="44" y="58">Where one figure comes from, and why it cannot outrank its inputs</text>
<text class="soft s" x="44" y="87.75">One inference on a median-sized request, with the numbers from the starter model this package ships. Follow the colour down the left edge of each</text>
<text class="soft s" x="44" y="109.05">box: a computed value can be no better founded than the weakest box upstream of it.</text>
<path class="measured-edge" d="M272.0,313.4 L325.0,400.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="measured-edge" d="M272.0,487.0 L325.0,400.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="measured-edge" d="M560.0,400.2 L613.0,226.6" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="estimated-edge" d="M560.0,224.4 L613.0,226.6" fill="none" stroke-width="1.4" marker-end="url(#arrow-estimated)"/>
<path class="measured-edge" d="M560.0,400.2 L613.0,573.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="todo-edge" d="M560.0,576.0 L613.0,573.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-todo)"/>
<path class="estimated-edge" d="M848.0,226.6 L901.0,400.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-estimated)"/>
<path class="estimated-edge" d="M848.0,400.2 L901.0,400.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-estimated)"/>
<g><rect class="measured" x="44" y="236.56" width="16" height="153.6" rx="10"/><rect class="surface edge card" x="50" y="236.56" width="222" height="153.6" rx="10"/><text class="ink h" x="66" y="270.37">runtime</text><text class="ink v" x="66" y="296.91">0.1 s</text><text class="faint n" x="66" y="319.46">off the clock, over the slice that</text><text class="faint n" x="66" y="337.21">ran</text><rect class="measured-bg" x="66" y="354.21" width="75.8" height="20" rx="6"/><text class="measured k" x="75" y="368.41" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g><g><rect class="measured" x="44" y="410.21" width="16" height="153.6" rx="10"/><rect class="surface edge card" x="50" y="410.21" width="222" height="153.6" rx="10"/><text class="ink h" x="66" y="444.02">power draw</text><text class="ink v" x="66" y="470.56">600 W</text><text class="faint n" x="66" y="493.11">off this machine's own</text><text class="faint n" x="66" y="510.86">counters</text><rect class="measured-bg" x="66" y="527.86" width="75.8" height="20" rx="6"/><text class="measured k" x="75" y="542.06" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g>
<g><rect class="estimated" x="332" y="136.6" width="16" height="175.7" rx="10"/><rect class="surface edge card" x="338" y="136.6" width="222" height="175.7" rx="10"/><text class="ink h" x="354" y="170.41">power usage</text><text class="ink h" x="354" y="192.42">effectiveness</text><text class="ink v" x="354" y="218.96">1.5</text><text class="faint n" x="354" y="241.51">a catalogue row, with its</text><text class="faint n" x="354" y="259.26">source and its date</text><rect class="estimated-bg" x="354" y="276.26" width="83.0" height="20" rx="6"/><text class="estimated k" x="363" y="290.46" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g><g><rect class="measured" x="332" y="332.26" width="16" height="135.9" rx="10"/><rect class="surface edge card" x="338" y="332.26" width="222" height="135.9" rx="10"/><text class="ink h" x="354" y="366.07">the machine's energy</text><text class="ink v" x="354" y="392.61">1.67e-05 kWh</text><text class="faint n" x="354" y="415.16">runtime × power draw</text><rect class="measured-bg" x="354" y="432.16" width="75.8" height="20" rx="6"/><text class="measured k" x="363" y="446.36" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g><g><rect class="todo" x="332" y="488.16" width="16" height="175.7" rx="10"/><rect class="surface edge card" x="338" y="488.16" width="222" height="175.7" rx="10"/><text class="ink h" x="354" y="521.97">water usage</text><text class="ink h" x="354" y="543.98">effectiveness</text><text class="ink v" x="354" y="570.52">—</text><text class="faint n" x="354" y="593.07">no row: a self-run room</text><text class="faint n" x="354" y="610.82">publishes none</text><rect class="todo-bg" x="354" y="627.82" width="46.9" height="20" rx="6"/><text class="todo k" x="363" y="642.02" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">TODO</text></g>
<g><rect class="estimated" x="620" y="149.735" width="16" height="153.7" rx="10"/><rect class="surface edge card" x="626" y="149.735" width="222" height="153.7" rx="10"/><text class="ink h" x="642" y="183.545">the building's energy</text><text class="ink v" x="642" y="210.085">2.5e-05 kWh</text><text class="faint n" x="642" y="232.635">the machine's energy × the</text><text class="faint n" x="642" y="250.385">overhead above</text><rect class="estimated-bg" x="642" y="267.385" width="83.0" height="20" rx="6"/><text class="estimated k" x="651" y="281.585" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g><g><rect class="estimated" x="620" y="323.385" width="16" height="153.6" rx="10"/><rect class="surface edge card" x="626" y="323.385" width="222" height="153.6" rx="10"/><text class="ink h" x="642" y="357.195">grid carbon intensity</text><text class="ink v" x="642" y="383.735">56 gCO2e/kWh</text><text class="faint n" x="642" y="406.285">a catalogue row for the</text><text class="faint n" x="642" y="424.035">country you stated</text><rect class="estimated-bg" x="642" y="441.035" width="83.0" height="20" rx="6"/><text class="estimated k" x="651" y="455.235" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g><g><rect class="todo" x="620" y="497.035" width="16" height="153.7" rx="10"/><rect class="surface edge card" x="626" y="497.035" width="222" height="153.7" rx="10"/><text class="ink h" x="642" y="530.845">water</text><text class="ink v" x="642" y="557.385">—</text><text class="faint n" x="642" y="579.935">the machine's energy × an</text><text class="faint n" x="642" y="597.685">effectiveness nobody has</text><rect class="todo-bg" x="642" y="614.685" width="46.9" height="20" rx="6"/><text class="todo k" x="651" y="628.885" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">TODO</text></g>
<g><rect class="estimated" x="908" y="323.385" width="16" height="153.6" rx="10"/><rect class="surface edge card" x="914" y="323.385" width="222" height="153.6" rx="10"/><text class="ink h" x="930" y="357.195">carbon</text><text class="ink v" x="930" y="383.735">0.0014 gCO2e</text><text class="faint n" x="930" y="406.285">the building's energy × the</text><text class="faint n" x="930" y="424.035">intensity above</text><rect class="estimated-bg" x="930" y="441.035" width="83.0" height="20" rx="6"/><text class="estimated k" x="939" y="455.235" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g>
<line class="edge" x1="44" y1="693.8" x2="1136" y2="693.8" stroke-width="1"/>
<text class="faint n" x="44" y="714.945">Take the counters away and the two measured boxes read estimated — a wattage from the catalogue instead of a reading — and every box downstream of them follows. Nothing</text>
<text class="faint n" x="44" y="732.695">else in the file changes, and nothing has to be edited for it to happen.</text>
<text class="faint n" x="44" y="757.445">The water branch is the rule at its least convenient and its most useful. A self-run room publishes no water usage effectiveness, so the figure stays TODO: an invented water</text>
<text class="faint n" x="44" y="775.195">number in a sustainability report is the worst kind of number there is.</text>
</svg>
