<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="909" viewBox="0 0 1180 909" role="img" aria-labelledby="pipeline-title pipeline-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="pipeline-title">From your repository to a figure somebody can quote</title>
<desc id="pipeline-desc">Three sources of fact — reading the repository, running a capped slice once you have agreed, and sourced catalogues — write one committed YAML model. The validator checks it, and the Markdown report, the self-contained web page, the Word and PDF documents, the team dashboard and the drift gate are all rendered from that one file.</desc>
<style>.paper{fill:#fbfbfa}.surface{fill:#ffffff}.sunken{fill:#f4f4f2}.ink{fill:#1a1a18}.soft{fill:#55554e}.faint{fill:#707068}.edge{stroke:#e2e2dc}.strong{stroke:#c9c9c0}.strong-fill{fill:#c9c9c0}.accent{fill:#1f6f5c}.accent-soft{fill:#e6f1ed}.measured{fill:#1f6f5c}.measured-bg{fill:#e6f1ed}.measured-edge{stroke:#1f6f5c}.estimated{fill:#936511}.estimated-bg{fill:#fbf1dd}.estimated-edge{stroke:#936511}.placeholder{fill:#5b5f97}.placeholder-bg{fill:#ecedf7}.placeholder-edge{stroke:#5b5f97}.todo{fill:#a33a2c}.todo-bg{fill:#fbeae7}.todo-edge{stroke:#a33a2c}.card{stroke-width:1}.t{font-size:26px;font-weight:700;letter-spacing:-.01em}.s{font-size:15px}.k{font-size:11.5px;font-weight:700;letter-spacing:.09em}.h{font-size:15.5px;font-weight:650}.b{font-size:13px}.n{font-size:12.5px}.c{font-size:12.5px}.v{font-size:17px;font-weight:650}@media (prefers-color-scheme: dark){.paper{fill:#14150f}.surface{fill:#1c1d16}.sunken{fill:#232419}.ink{fill:#eceadf}.soft{fill:#b4b2a4}.faint{fill:#8c8a78}.edge{stroke:#32332a}.strong{stroke:#494a3d}.strong-fill{fill:#494a3d}.accent{fill:#6bc4a8}.accent-soft{fill:#1c3129}.measured{fill:#6bc4a8}.measured-bg{fill:#1b3129}.measured-edge{stroke:#6bc4a8}.estimated{fill:#e0ac4e}.estimated-bg{fill:#33290f}.estimated-edge{stroke:#e0ac4e}.placeholder{fill:#a2a6e0}.placeholder-bg{fill:#23243a}.placeholder-edge{stroke:#a2a6e0}.todo{fill:#ef8a76}.todo-bg{fill:#3a1f19}.todo-edge{stroke:#ef8a76}}</style>
<rect class="paper" width="1180" height="909"/>
<defs><marker id="arrow-line" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="strong-fill"/></marker><marker id="arrow-measured" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="measured"/></marker><marker id="arrow-estimated" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="estimated"/></marker><marker id="arrow-placeholder" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="placeholder"/></marker><marker id="arrow-todo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="todo"/></marker></defs>
<text class="ink t" x="44" y="58">From your repository to a figure somebody can quote</text>
<text class="soft s" x="44" y="87.75">Three sources of fact write one file. Everything anybody reads is rendered from that file, and nothing in it may state a number without saying where it</text>
<text class="soft s" x="44" y="109.05">came from.</text>
<text class="faint k" x="44" y="136.6">WHERE THE FACTS COME FROM</text>
<text class="faint k" x="416" y="136.6">WHAT GETS COMMITTED</text>
<text class="faint k" x="824" y="136.6">WHAT PEOPLE READ</text>
<path class="strong" d="M356.0,246.3 C382.5,246.3 382.5,376.9 409.0,376.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="measured-edge" d="M356.0,460.5 C382.5,460.5 382.5,376.9 409.0,376.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="estimated-edge" d="M356.0,699.2 C382.5,699.2 382.5,376.9 409.0,376.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-estimated)"/>
<path class="strong" d="M764.0,376.9 C790.5,376.9 790.5,255.9 817.0,255.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M764.0,376.9 C790.5,376.9 790.5,365.9 817.0,365.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M764.0,376.9 C790.5,376.9 790.5,475.8 817.0,475.8" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M764.0,376.9 C790.5,376.9 790.5,585.7 817.0,585.7" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M764.0,376.9 C790.5,376.9 790.5,704.9 817.0,704.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<g><rect class="strong-fill" x="44" y="160.6" width="16" height="171.3" rx="10"/><rect class="surface edge card" x="50" y="160.6" width="306" height="171.3" rx="10"/><text class="ink h" x="66" y="194.41">Reading the repository</text><text class="soft b" x="66" y="216.87">Languages, frameworks, how much work</text><text class="soft b" x="66" y="235.33">one full run performs, which paid</text><text class="soft b" x="66" y="253.79">interfaces you call and the line that calls</text><text class="soft b" x="66" y="272.25">them.</text><text class="faint n" x="66" y="293.2">Deterministic, and every finding quotes its</text><text class="faint n" x="66" y="310.95">evidence.</text></g><g><rect class="measured" x="44" y="349.95" width="16" height="221.1" rx="10"/><rect class="surface edge card" x="50" y="349.95" width="306" height="221.1" rx="10"/><text class="ink h" x="66" y="383.76">Running a capped slice of it</text><text class="soft b" x="66" y="406.22">With --run, and only once you have agreed:</text><text class="soft b" x="66" y="424.68">seconds off the clock, joules off whatever</text><text class="soft b" x="66" y="443.14">counters this machine publishes to an</text><text class="soft b" x="66" y="461.6">ordinary user.</text><text class="faint n" x="66" y="482.55">The slice covers a share your own</text><text class="faint n" x="66" y="500.3">configuration states, so projecting to a whole</text><text class="faint n" x="66" y="518.05">run is arithmetic.</text><rect class="measured-bg" x="66" y="535.05" width="75.8" height="20" rx="6"/><text class="measured k" x="75" y="549.25" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g><g><rect class="estimated" x="44" y="589.05" width="16" height="220.4" rx="10"/><rect class="surface edge card" x="50" y="589.05" width="306" height="220.4" rx="10"/><text class="ink h" x="66" y="622.86">Sourced catalogues</text><text class="soft b" x="66" y="645.32">Wattages, grid carbon intensities, tariffs,</text><text class="soft b" x="66" y="663.78">the building's overhead, published</text><text class="soft b" x="66" y="682.24">manufacturing footprints.</text><text class="faint n" x="66" y="703.19">Every row carries the page it came from</text><text class="faint n" x="66" y="720.94">and the date somebody read it. No row for</text><text class="faint n" x="66" y="738.69">your part is a normal outcome, and it is</text><text class="faint n" x="66" y="756.44">named.</text><rect class="estimated-bg" x="66" y="773.44" width="83.0" height="20" rx="6"/><text class="estimated k" x="75" y="787.64" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text><rect class="todo-bg" x="157.029" y="773.44" width="46.9" height="20" rx="6"/><text class="todo k" x="166.029" y="787.64" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">TODO</text></g>
<g><rect class="surface edge card" x="416" y="266.785" width="348" height="220.2" rx="10"/><rect class="sunken" x="432" y="348.7" width="316.0" height="122.3" rx="7"/><text class="ink h" x="432" y="300.595" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">cost_of_running.yaml</text><text class="soft b" x="432" y="323.055">Committed next to the code, and reviewed in a</text><text class="soft b" x="432" y="341.515">pull request like the rest of it.</text><text class="soft c" x="442" y="364.445" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">carbon:</text><text class="soft c" x="442" y="380.775" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">  value: 0.0014</text><text class="soft c" x="442" y="397.105" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">  unit: "gCO2e"</text><text class="soft c" x="442" y="413.435" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">  status: "estimated"</text><text class="soft c" x="442" y="429.765" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">  derived_from:</text><text class="soft c" x="442" y="446.095" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">    - scenarios[0].costs.energy</text><text class="soft c" x="442" y="462.425" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">    - assumptions.grid_carbon_intensity</text></g><g><rect class="accent" x="416" y="505.025" width="16" height="198.2" rx="10"/><rect class="surface edge card" x="422" y="505.025" width="342" height="198.2" rx="10"/><text class="ink h" x="438" y="538.835">What the validator enforces</text><text class="soft b" x="438" y="561.295">Every number lives inside a quantity, so an extra</text><text class="soft b" x="438" y="579.755">block cannot smuggle a figure past the rules.</text><text class="soft b" x="438" y="603.215">Every derived value is recomputed from the</text><text class="soft b" x="438" y="621.675">inputs it names, units parsed down to their base</text><text class="soft b" x="438" y="640.135">dimensions.</text><text class="soft b" x="438" y="663.595">Nothing claims to be better founded than the</text><text class="soft b" x="438" y="682.055">weakest input it came from.</text></g>
<g><rect class="surface edge card" x="824" y="207.965" width="312" height="95.9" rx="10"/><text class="ink h" x="840" y="241.775">Markdown</text><text class="soft b" x="840" y="264.235">Straight into the pull request, next to the diff</text><text class="soft b" x="840" y="282.695">that moved the number.</text></g><g><rect class="surface edge card" x="824" y="317.895" width="312" height="95.9" rx="10"/><text class="ink h" x="840" y="351.705">One self-contained web page</text><text class="soft b" x="840" y="374.165">Offline, light and dark, and it recomputes for</text><text class="soft b" x="840" y="392.625">another country in the browser.</text></g><g><rect class="surface edge card" x="824" y="427.825" width="312" height="95.9" rx="10"/><text class="ink h" x="840" y="461.635">Word and PDF</text><text class="soft b" x="840" y="484.095">For whoever needs a document, with a title</text><text class="soft b" x="840" y="502.555">block saying what produced it and when.</text></g><g><rect class="surface edge card" x="824" y="537.755" width="312" height="95.9" rx="10"/><text class="ink h" x="840" y="571.565" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">saggio dashboard</text><text class="soft b" x="840" y="594.025">Every committed model on one page, led by</text><text class="soft b" x="840" y="612.485">how much of each is measured.</text></g><g><rect class="surface edge card" x="824" y="647.685" width="312" height="114.4" rx="10"/><text class="ink h" x="840" y="681.495" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">saggio diff</text><text class="soft b" x="840" y="703.955">Fails the build when a cost worsened, a</text><text class="soft b" x="840" y="722.415">status weakened, or a quantity quietly</text><text class="soft b" x="840" y="740.875">disappeared.</text></g>
<line class="edge" x1="44" y1="839.4" x2="1136" y2="839.4" stroke-width="1"/>
<text class="faint n" x="44" y="860.565">Nothing on the right may say anything the file does not. What nobody can supply stays TODO the whole way through — never a zero, never a plausible number.</text>
</svg>
