<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="823" viewBox="0 0 1180 823" role="img" aria-labelledby="chain-title chain-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chain-title">D'où vient un chiffre, et pourquoi il ne peut pas dépasser ses apports</title>
<desc id="chain-desc">Une chaîne de dérivation pour une inférence : la durée et la puissance, toutes deux mesurées, donnent l'énergie de la machine ; multipliée par une efficacité énergétique du site estimée, elle donne l'énergie du bâtiment, qui n'est donc qu'estimée ; multipliée par une intensité carbone estimée, elle donne le chiffre du carbone. La branche de l'eau finit en TODO, faute d'efficacité d'usage de l'eau publiée pour une salle exploitée en propre.</desc>
<style>.paper{fill:#fbfbfa}.surface{fill:#ffffff}.sunken{fill:#f4f4f2}.ink{fill:#1a1a18}.soft{fill:#55554e}.faint{fill:#707068}.edge{stroke:#e2e2dc}.strong{stroke:#c9c9c0}.strong-fill{fill:#c9c9c0}.accent{fill:#1f6f5c}.accent-soft{fill:#e6f1ed}.measured{fill:#1f6f5c}.measured-bg{fill:#e6f1ed}.measured-edge{stroke:#1f6f5c}.estimated{fill:#936511}.estimated-bg{fill:#fbf1dd}.estimated-edge{stroke:#936511}.placeholder{fill:#5b5f97}.placeholder-bg{fill:#ecedf7}.placeholder-edge{stroke:#5b5f97}.todo{fill:#a33a2c}.todo-bg{fill:#fbeae7}.todo-edge{stroke:#a33a2c}.card{stroke-width:1}.t{font-size:26px;font-weight:700;letter-spacing:-.01em}.s{font-size:15px}.k{font-size:11.5px;font-weight:700;letter-spacing:.09em}.h{font-size:15.5px;font-weight:650}.b{font-size:13px}.n{font-size:12.5px}.c{font-size:12.5px}.v{font-size:17px;font-weight:650}@media (prefers-color-scheme: dark){.paper{fill:#14150f}.surface{fill:#1c1d16}.sunken{fill:#232419}.ink{fill:#eceadf}.soft{fill:#b4b2a4}.faint{fill:#8c8a78}.edge{stroke:#32332a}.strong{stroke:#494a3d}.strong-fill{fill:#494a3d}.accent{fill:#6bc4a8}.accent-soft{fill:#1c3129}.measured{fill:#6bc4a8}.measured-bg{fill:#1b3129}.measured-edge{stroke:#6bc4a8}.estimated{fill:#e0ac4e}.estimated-bg{fill:#33290f}.estimated-edge{stroke:#e0ac4e}.placeholder{fill:#a2a6e0}.placeholder-bg{fill:#23243a}.placeholder-edge{stroke:#a2a6e0}.todo{fill:#ef8a76}.todo-bg{fill:#3a1f19}.todo-edge{stroke:#ef8a76}}</style>
<rect class="paper" width="1180" height="823"/>
<defs><marker id="arrow-line" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="strong-fill"/></marker><marker id="arrow-measured" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="measured"/></marker><marker id="arrow-estimated" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="estimated"/></marker><marker id="arrow-placeholder" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="placeholder"/></marker><marker id="arrow-todo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="todo"/></marker></defs>
<text class="ink t" x="44" y="58">D'où vient un chiffre, et pourquoi il ne peut pas dépasser ses apports</text>
<text class="soft s" x="44" y="87.75">Une inférence sur une requête de taille médiane, avec les chiffres du modèle de départ que livre ce paquet. Suivez la couleur au bord gauche de</text>
<text class="soft s" x="44" y="109.05">chaque case : une valeur calculée ne peut pas être mieux fondée que la plus faible des cases en amont.</text>
<path class="measured-edge" d="M272.0,313.4 L325.0,400.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="measured-edge" d="M272.0,487.0 L325.0,400.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="measured-edge" d="M560.0,400.2 L613.0,215.6" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="estimated-edge" d="M560.0,224.4 L613.0,215.6" fill="none" stroke-width="1.4" marker-end="url(#arrow-estimated)"/>
<path class="measured-edge" d="M560.0,400.2 L613.0,584.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-measured)"/>
<path class="todo-edge" d="M560.0,576.0 L613.0,584.9" fill="none" stroke-width="1.4" marker-end="url(#arrow-todo)"/>
<path class="estimated-edge" d="M848.0,215.6 L901.0,400.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-estimated)"/>
<path class="estimated-edge" d="M848.0,400.2 L901.0,400.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-estimated)"/>
<g><rect class="measured" x="44" y="236.56" width="16" height="153.6" rx="10"/><rect class="surface edge card" x="50" y="236.56" width="222" height="153.6" rx="10"/><text class="ink h" x="66" y="270.37">durée d'exécution</text><text class="ink v" x="66" y="296.91">0,1 s</text><text class="faint n" x="66" y="319.46">à l'horloge, sur la tranche</text><text class="faint n" x="66" y="337.21">exécutée</text><rect class="measured-bg" x="66" y="354.21" width="75.8" height="20" rx="6"/><text class="measured k" x="75" y="368.41" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g><g><rect class="measured" x="44" y="410.21" width="16" height="153.6" rx="10"/><rect class="surface edge card" x="50" y="410.21" width="222" height="153.6" rx="10"/><text class="ink h" x="66" y="444.02">puissance appelée</text><text class="ink v" x="66" y="470.56">600 W</text><text class="faint n" x="66" y="493.11">aux compteurs de cette</text><text class="faint n" x="66" y="510.86">machine</text><rect class="measured-bg" x="66" y="527.86" width="75.8" height="20" rx="6"/><text class="measured k" x="75" y="542.06" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g>
<g><rect class="estimated" x="332" y="136.6" width="16" height="175.7" rx="10"/><rect class="surface edge card" x="338" y="136.6" width="222" height="175.7" rx="10"/><text class="ink h" x="354" y="170.41">efficacité énergétique du</text><text class="ink h" x="354" y="192.42">site</text><text class="ink v" x="354" y="218.96">1,5</text><text class="faint n" x="354" y="241.51">une ligne de catalogue, avec sa</text><text class="faint n" x="354" y="259.26">source et sa date</text><rect class="estimated-bg" x="354" y="276.26" width="83.0" height="20" rx="6"/><text class="estimated k" x="363" y="290.46" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g><g><rect class="measured" x="332" y="332.26" width="16" height="135.9" rx="10"/><rect class="surface edge card" x="338" y="332.26" width="222" height="135.9" rx="10"/><text class="ink h" x="354" y="366.07">énergie de la machine</text><text class="ink v" x="354" y="392.61">1,67e-05 kWh</text><text class="faint n" x="354" y="415.16">durée × puissance</text><rect class="measured-bg" x="354" y="432.16" width="75.8" height="20" rx="6"/><text class="measured k" x="363" y="446.36" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g><g><rect class="todo" x="332" y="488.16" width="16" height="175.7" rx="10"/><rect class="surface edge card" x="338" y="488.16" width="222" height="175.7" rx="10"/><text class="ink h" x="354" y="521.97">efficacité d'usage de</text><text class="ink h" x="354" y="543.98">l'eau</text><text class="ink v" x="354" y="570.52">—</text><text class="faint n" x="354" y="593.07">aucune ligne : une salle en</text><text class="faint n" x="354" y="610.82">propre n'en publie pas</text><rect class="todo-bg" x="354" y="627.82" width="46.9" height="20" rx="6"/><text class="todo k" x="363" y="642.02" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">TODO</text></g>
<g><rect class="estimated" x="620" y="138.73" width="16" height="153.7" rx="10"/><rect class="surface edge card" x="626" y="138.73" width="222" height="153.7" rx="10"/><text class="ink h" x="642" y="172.54">énergie du bâtiment</text><text class="ink v" x="642" y="199.08">2,5e-05 kWh</text><text class="faint n" x="642" y="221.63">énergie de la machine × le</text><text class="faint n" x="642" y="239.38">surcoût ci-dessus</text><rect class="estimated-bg" x="642" y="256.38" width="83.0" height="20" rx="6"/><text class="estimated k" x="651" y="270.58" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g><g><rect class="estimated" x="620" y="312.38" width="16" height="175.7" rx="10"/><rect class="surface edge card" x="626" y="312.38" width="222" height="175.7" rx="10"/><text class="ink h" x="642" y="346.19">intensité carbone du</text><text class="ink h" x="642" y="368.2">réseau</text><text class="ink v" x="642" y="394.74">56 gCO2e/kWh</text><text class="faint n" x="642" y="417.29">une ligne de catalogue pour le</text><text class="faint n" x="642" y="435.04">pays que vous avez énoncé</text><rect class="estimated-bg" x="642" y="452.04" width="83.0" height="20" rx="6"/><text class="estimated k" x="651" y="466.24" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g><g><rect class="todo" x="620" y="508.04" width="16" height="153.6" rx="10"/><rect class="surface edge card" x="626" y="508.04" width="222" height="153.6" rx="10"/><text class="ink h" x="642" y="541.85">eau</text><text class="ink v" x="642" y="568.39">—</text><text class="faint n" x="642" y="590.94">énergie de la machine × une</text><text class="faint n" x="642" y="608.69">efficacité que personne n'a</text><rect class="todo-bg" x="642" y="625.69" width="46.9" height="20" rx="6"/><text class="todo k" x="651" y="639.89" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">TODO</text></g>
<g><rect class="estimated" x="908" y="323.385" width="16" height="153.6" rx="10"/><rect class="surface edge card" x="914" y="323.385" width="222" height="153.6" rx="10"/><text class="ink h" x="930" y="357.195">carbone</text><text class="ink v" x="930" y="383.735">0,0014 gCO2e</text><text class="faint n" x="930" y="406.285">énergie du bâtiment ×</text><text class="faint n" x="930" y="424.035">l'intensité ci-dessus</text><rect class="estimated-bg" x="930" y="441.035" width="83.0" height="20" rx="6"/><text class="estimated k" x="939" y="455.235" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g>
<line class="edge" x1="44" y1="693.8" x2="1136" y2="693.8" stroke-width="1"/>
<text class="faint n" x="44" y="714.945">Retirez les compteurs : les deux cases measured passent à estimated — une puissance du catalogue plutôt qu'un relevé — et toutes les cases en aval suivent. Rien d'autre ne change</text>
<text class="faint n" x="44" y="732.695">dans le fichier, et il n'y a rien à éditer pour que cela arrive.</text>
<text class="faint n" x="44" y="757.445">La branche de l'eau, c'est la règle au plus gênant et au plus utile. Une salle exploitée en propre ne publie aucune efficacité d'usage de l'eau, donc le chiffre reste TODO : un chiffre</text>
<text class="faint n" x="44" y="775.195">d'eau inventé dans un rapport de durabilité est le pire des chiffres qui soient.</text>
</svg>
