<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="768" viewBox="0 0 1180 768" role="img" aria-labelledby="landscape-links-title landscape-links-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="landscape-links-title">Une question, quatre maillons, et personne ne les tient tous les quatre</title>
<desc id="landscape-links-desc">La question « combien coûte l'exécution de ce code » dessinée en quatre maillons dans l'ordre : ce qui a tourné et en quelle quantité, ce qu'il a tiré, ce que cela coûte, et par quoi et sur quoi cela repose. Sous chaque maillon figurent les outils qui y répondent le mieux — le dépôt et les lecteurs de plan pour le premier, les mesureurs de puissance pour le deuxième, les catalogues sourcés pour le troisième, presque personne pour le quatrième — et une pastille disant ce que vaut la réponse de ce paquet : measured, TODO, estimated, measured. Aucun outil de la page ne tient les quatre maillons.</desc>
<style>.paper{fill:#fbfbfa}.surface{fill:#ffffff}.sunken{fill:#f4f4f2}.ink{fill:#1a1a18}.soft{fill:#55554e}.faint{fill:#707068}.edge{stroke:#e2e2dc}.strong{stroke:#c9c9c0}.strong-fill{fill:#c9c9c0}.accent{fill:#1f6f5c}.accent-soft{fill:#e6f1ed}.measured{fill:#1f6f5c}.measured-bg{fill:#e6f1ed}.measured-edge{stroke:#1f6f5c}.estimated{fill:#936511}.estimated-bg{fill:#fbf1dd}.estimated-edge{stroke:#936511}.placeholder{fill:#5b5f97}.placeholder-bg{fill:#ecedf7}.placeholder-edge{stroke:#5b5f97}.todo{fill:#a33a2c}.todo-bg{fill:#fbeae7}.todo-edge{stroke:#a33a2c}.card{stroke-width:1}.t{font-size:26px;font-weight:700;letter-spacing:-.01em}.s{font-size:15px}.k{font-size:11.5px;font-weight:700;letter-spacing:.09em}.h{font-size:15.5px;font-weight:650}.b{font-size:13px}.n{font-size:12.5px}.c{font-size:12.5px}.v{font-size:17px;font-weight:650}@media (prefers-color-scheme: dark){.paper{fill:#14150f}.surface{fill:#1c1d16}.sunken{fill:#232419}.ink{fill:#eceadf}.soft{fill:#b4b2a4}.faint{fill:#8c8a78}.edge{stroke:#32332a}.strong{stroke:#494a3d}.strong-fill{fill:#494a3d}.accent{fill:#6bc4a8}.accent-soft{fill:#1c3129}.measured{fill:#6bc4a8}.measured-bg{fill:#1b3129}.measured-edge{stroke:#6bc4a8}.estimated{fill:#e0ac4e}.estimated-bg{fill:#33290f}.estimated-edge{stroke:#e0ac4e}.placeholder{fill:#a2a6e0}.placeholder-bg{fill:#23243a}.placeholder-edge{stroke:#a2a6e0}.todo{fill:#ef8a76}.todo-bg{fill:#3a1f19}.todo-edge{stroke:#ef8a76}}</style>
<rect class="paper" width="1180" height="768"/>
<defs><marker id="arrow-line" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="strong-fill"/></marker><marker id="arrow-measured" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="measured"/></marker><marker id="arrow-estimated" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="estimated"/></marker><marker id="arrow-placeholder" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="placeholder"/></marker><marker id="arrow-todo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="todo"/></marker></defs>
<text class="ink t" x="44" y="58">Une question, quatre maillons, et personne ne les tient tous les quatre</text>
<text class="soft s" x="44" y="87.75">Chaque outil de cette page répond à une part de « combien coûte l'exécution de ce code » et passe le reste. Lire de gauche à droite, c'est lire l'ordre</text>
<text class="soft s" x="44" y="109.05">dans lequel le travail doit se faire ; la pastille sous chaque maillon dit ce que vaut la réponse de ce paquet, y compris celle qu'il doit refuser.</text>
<text class="faint k" x="44" y="136.6">LE MAILLON</text>
<g><rect class="accent" x="44" y="154.6" width="16" height="137.3" rx="10"/><rect class="surface edge card" x="50" y="154.6" width="249" height="137.3" rx="10"/><text class="ink h" x="66" y="188.41">Qu'est-ce qui a tourné, et</text><text class="ink h" x="66" y="210.42">combien ?</text><text class="faint n" x="66" y="235.37">Une unité de travail nommée, et le</text><text class="faint n" x="66" y="253.12">compte de celles qu'une exécution</text><text class="faint n" x="66" y="270.87">complète accomplit.</text></g>
<g><rect class="accent" x="323" y="154.6" width="16" height="137.3" rx="10"/><rect class="surface edge card" x="329" y="154.6" width="249" height="137.3" rx="10"/><text class="ink h" x="345" y="188.41">Qu'a-t-il tiré ?</text><text class="faint n" x="345" y="213.36">Un compteur, et une règle de</text><text class="faint n" x="345" y="231.11">partage pour une machine que</text><text class="faint n" x="345" y="248.86">plusieurs choses utilisent.</text></g>
<g><rect class="accent" x="602" y="154.6" width="16" height="137.3" rx="10"/><rect class="surface edge card" x="608" y="154.6" width="249" height="137.3" rx="10"/><text class="ink h" x="624" y="188.41">Qu'est-ce que cela coûte ?</text><text class="faint n" x="624" y="213.36">Un tarif, une intensité carbone, une</text><text class="faint n" x="624" y="231.11">valeur d'eau, une empreinte</text><text class="faint n" x="624" y="248.86">matérielle.</text></g>
<g><rect class="accent" x="881" y="154.6" width="16" height="137.3" rx="10"/><rect class="surface edge card" x="887" y="154.6" width="249" height="137.3" rx="10"/><text class="ink h" x="903" y="188.41">Par quoi, et sur quoi cela</text><text class="ink h" x="903" y="210.42">repose-t-il ?</text><text class="faint n" x="903" y="235.37">Un artefact commité que quelqu'un</text><text class="faint n" x="903" y="253.12">peut ouvrir dans une pull request et</text><text class="faint n" x="903" y="270.87">contester.</text></g>
<text class="faint k" x="44" y="329.87">QUI Y RÉPOND LE MIEUX</text>
<g><rect class="sunken edge card" x="44" y="347.87" width="255" height="107.8" rx="10"/><text class="soft b" x="60" y="379.13">Le dépôt lui-même. Green Metrics</text><text class="soft b" x="60" y="397.59">Tool décrit l'exécution dans un</text><text class="soft b" x="60" y="416.05">fichier ; Infracost et Carbonifer</text><text class="soft b" x="60" y="434.51">lisent un plan.</text></g>
<g><rect class="sunken edge card" x="323" y="347.87" width="255" height="107.8" rx="10"/><text class="soft b" x="339" y="379.13">Scaphandre, PowerAPI, JoularJX,</text><text class="soft b" x="339" y="397.59">Kepler, CEEMS, EnergiBridge —</text><text class="soft b" x="339" y="416.05">par processus, par méthode, par</text><text class="soft b" x="339" y="434.51">conteneur, par travail.</text></g>
<g><rect class="sunken edge card" x="602" y="347.87" width="255" height="107.8" rx="10"/><text class="soft b" x="618" y="379.13">Green Algorithms, Boavizta,</text><text class="soft b" x="618" y="397.59">Climatiq, Electricity Maps, Cloud</text><text class="soft b" x="618" y="416.05">Carbon Footprint — les catalogues</text><text class="soft b" x="618" y="434.51">sourcés.</text></g>
<g><rect class="sunken edge card" x="881" y="347.87" width="255" height="107.8" rx="10"/><text class="soft b" x="897" y="379.13">Presque personne. Un chiffre</text><text class="soft b" x="897" y="397.59">Software Carbon Intensity (SCI)</text><text class="soft b" x="897" y="416.05">déclaré, et celui-ci.</text></g>
<text class="faint k" x="44" y="493.71">ET ICI</text>
<g><rect class="surface edge card" x="44" y="511.71" width="255" height="121.4" rx="10"/><text class="soft b" x="60" y="542.97">lit votre code, puis exécute une</text><text class="soft b" x="60" y="561.43">tranche bornée si vous y consentez</text><rect class="measured-bg" x="60" y="578.63" width="75.8" height="20" rx="6"/><text class="measured k" x="69" y="592.83" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g>
<g><rect class="surface edge card" x="323" y="511.71" width="255" height="121.4" rx="10"/><text class="soft b" x="339" y="542.97">lit le compteur de la machine ;</text><text class="soft b" x="339" y="561.43">refuse de le découper par</text><text class="soft b" x="339" y="579.89">processus</text><rect class="todo-bg" x="339" y="597.09" width="46.9" height="20" rx="6"/><text class="todo k" x="348" y="611.29" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">TODO</text></g>
<g><rect class="surface edge card" x="602" y="511.71" width="255" height="121.4" rx="10"/><text class="soft b" x="618" y="542.97">des catalogues sourcés, et un</text><text class="soft b" x="618" y="561.43">champ tenu ouvert là où rien n'est</text><text class="soft b" x="618" y="579.89">publié</text><rect class="estimated-bg" x="618" y="597.09" width="83.0" height="20" rx="6"/><text class="estimated k" x="627" y="611.29" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">estimated</text></g>
<g><rect class="surface edge card" x="881" y="511.71" width="255" height="121.4" rx="10"/><text class="soft b" x="897" y="542.97">chaque chiffre porte son statut et</text><text class="soft b" x="897" y="561.43">les chiffres dont il vient</text><rect class="measured-bg" x="897" y="578.63" width="75.8" height="20" rx="6"/><text class="measured k" x="906" y="592.83" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">measured</text></g>
<path class="strong" d="M302.0,223.2 L319.0,223.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M581.0,223.2 L598.0,223.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<path class="strong" d="M860.0,223.2 L877.0,223.2" fill="none" stroke-width="1.4" marker-end="url(#arrow-line)"/>
<line class="edge" x1="44" y1="663.1" x2="1136" y2="663.1" stroke-width="1"/>
<text class="faint n" x="44" y="684.215">Les pastilles sont les quatre statuts de ce paquet, appliqués à lui-même. Le deuxième maillon est celui qu'il refuse : un compteur mesure du matériel, donc la valeur qu'il lit est</text>
<text class="faint n" x="44" y="701.965">celle de la machine et non celle de l'exécution, et il le dit plutôt que de diviser par quelque chose de plausible. Ce refus est la sixième colonne du tableau plus haut, où cinq autres</text>
<text class="faint n" x="44" y="719.715">outils font mieux.</text>
</svg>
