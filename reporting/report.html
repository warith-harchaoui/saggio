<!doctype html>
<!-- Written by saggio from the shell in reporting/report.html.
     Self-contained on purpose: the stylesheet, the script, the logo and this
     model's own data are inlined, so the page opens offline and asks nobody for
     anything. reporting/README.md documents the shell and how to adapt it. -->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="saggio">
<title>{{TITLE}}</title>
<link rel="icon" href="{{LOGO}}">
<style>
{{STYLE}}
</style>
</head>
<body>
<nav class="bar">
  <span class="brand"><img src="{{LOGO}}" alt="">saggio</span>
  <span class="spacer"></span>
  <select id="language-picker" aria-label="Language">{{LANGUAGES}}</select>
  <button id="theme-toggle" type="button" aria-label="Switch theme">☾</button>
  <button type="button" onclick="window.print()" data-i18n="bar.print">Save as PDF</button>
</nav>
<main class="wrap">
{{BODY}}
<footer>
<p><span data-i18n="footer.generated">Generated by saggio.</span>
<a href="{{PROJECT_URL}}" rel="noopener">{{PROJECT_URL}}</a></p>
</footer>
</main>
<script type="application/json" id="report-data">{{DATA}}</script>
<script>
{{SCRIPT}}
</script>
</body>
</html>
