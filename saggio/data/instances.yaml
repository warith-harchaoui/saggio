# Machine shapes a cost model can name, and what they draw under load.
# ------------------------------------------------------------------------------
# `sustained_power_w` is the whole-node figure a report uses when nothing has
# been measured: accelerator TDP plus a working allowance for host CPU, memory,
# and the rest of the chassis. It is a nameplate-derived estimate, never a
# measurement, and a report says so. Measure with `... measure` and the number
# is replaced by one that says `measured` instead.

