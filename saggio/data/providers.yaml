# Where the code runs: datacenter overhead, water, and what a kilowatt-hour costs.
# ------------------------------------------------------------------------------
# PUE (power usage effectiveness) is the multiplier between the energy a server
# draws and the energy the building draws to keep it running: 1.0 would be a
# datacenter with no cooling, lighting, or conversion loss, which does not exist.
# WUE (water usage effectiveness) is litres of water per kilowatt-hour of IT
# load, on-site only; it excludes the water used to generate the electricity.
#
# `price_usd_per_kwh: null` means the provider does not sell electricity by the
# kilowatt-hour at all: on a cloud instance you buy hours of a machine, and the
# electricity is inside that price. When it is null, a money cost computed from
# energy is a TODO, not a zero.
#
# `operated_by` says who runs the machine, and it is the one fact that decides
# which GHG Protocol scope a cost belongs in. `self` means the reporting
# organisation buys the kilowatt-hour and owns the hardware: the electricity is
# its **scope 2**, the hardware its **scope 3 category 2** (capital goods).
# `vendor` means it buys a service and somebody else buys the kilowatt-hour: both
# are its **scope 3 category 1** (purchased goods and services), and are that
# vendor's scope 2 and 3.2 rather than its own.
#
# It is a classification rather than a measurement, so it carries no source of
# its own: the rule it feeds is cited where the rule lives, in
# `saggio.estimate.ghg`. A row that omits it gets no scope at all rather than a
# guessed one — the two answers differ by which company reports the emission,
# which is not a detail anybody should infer from a provider's name.

schema_version: "2.1"

providers:
  - key: on-prem
    name: "On-premises"
    operated_by: self
    pue: 1.5
    wue_l_per_kwh: null
    price_usd_per_kwh: null
    source_url: "https://www.uptimeinstitute.com/resources/research-and-reports/uptime-institute-global-data-center-survey-results-2024"
    retrieved_date: "2026-09-12"
    notes: "Industry-average PUE for a self-run room; measure your own if you can. Price comes from the country tariff."
  - key: on-prem-eu
    name: "On-premises, European Union"
    operated_by: self
    pue: 1.36
    wue_l_per_kwh: 0.58
    price_usd_per_kwh: null
    source_url: "https://data.consilium.europa.eu/doc/document/ST-13443-2026-INIT/en/pdf"
    retrieved_date: "2026-10-19"
    notes: >-
      Union-wide averages for 2024, reported under Article 12 of the Energy
      Efficiency Directive and published by the Commission as COM(2026) 500
      final on 2026-09-21. PUE is the energy-weighted average over the 681 data
      centres whose figure the quality review accepted; WUE is the same over the
      458 that reported water above zero, which excludes dry-cooled rooms and so
      overstates the average room. Mandatory reporting over a known population
      beats a voluntary global survey for a room inside the Union, which is the
      only reason this row exists beside `on-prem`. Two limits the report states
      about itself: only about 36% of the data centres in scope reported at all,
      and 70.1% of what they reported passed the quality review. Facility-level
      figures are not public and cannot be: Article 5(5) of Delegated Regulation
      (EU) 2024/1364 requires the database to be anonymised.
