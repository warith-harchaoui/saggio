# Translations for the HTML report.
#
# Keys match the data-i18n attributes the renderer writes. This file is the only
# copy: it is packaged with the wheel and read through importlib.resources, so a
# translator edits one file and both a checkout and an installed copy change.
#
# Add a top-level language code to add a language. The picker in the report is
# built from whatever this file contains.

# How this language writes a number: the character between the units and the
# tenths. It lives here rather than with the engine's sentences because both
# halves need it — the renderer formats a figure server-side, and the what-if
# panel recomputes in the browser from the table this page carries. Applied
# between two digits and nowhere else; a blanket substitution would rewrite
# dates, schema versions, dotted field paths and URLs.

