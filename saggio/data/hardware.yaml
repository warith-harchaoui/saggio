# Hardware registry: the source of truth for device power and throughput.
# -----------------------------------------------------------------------
# Each row carries provenance (source_url + retrieved_date) because a hardware
# figure is a sourced value like any other, not folklore. Numeric values are
# vendor-datasheet figures (SXM/OAM at the default power cap; dense BF16 for
# throughput; peak theoretical memory bandwidth for the default memory
# configuration). The seed source_url values point at the vendor product pages
# and should be verified and deep-linked through the `saggio catalog add gpu`
# and `saggio catalog add cpu` flow as the catalogue grows.
#
# memory_gb is the board's own memory, and it is what says whether a projection
# is worth making at all. Projecting a run measured on an 80 GB board onto a 24 GB
# one gives an arithmetic answer to a run that would not start. The Apple rows
# carry no memory_gb on purpose: their memory is unified with the host and chosen
# per machine, so it is a property of a laptop rather than of a part.
#
# For a processor, `cores`, `single_thread_score` and `throughput_score` are what
# make a projection onto another part possible at all. A processor publishes no
# peak figure worth scaling by: clock speed and core count do not give one,
# because the work done per cycle differs between parts. A published benchmark
# does, and a processor has two speeds that do not move together — one thread on
# one core, and every core busy at once — so both scores are wanted and the two
# of them bracket the answer. `benchmark` names which benchmark they came from,
# and a projection refuses to divide a score of one thing by a score of another.
#
# The scores ship empty. Filling one in means taking a published result — for
# example SPECrate2017_int_base from a result page on spec.org — dividing it by
# that system's socket count so two parts are compared one socket against one
# socket, and recording the result's own URL and the date it was read, like every
# other row here. `cores` is per socket, and where it is absent the row's own
# notes did not state it unambiguously; a part with both performance and
# efficiency cores needs a decision about what to count before it gets one.
#
# embodied_kgco2e is what building the part emitted, cradle-to-gate, per device.
# It is the one column here whose source is never a datasheet: it comes from a
# product carbon footprint, so it carries its own `embodied_source_url` and
# `embodied_retrieved_date` rather than borrowing the row's. `embodied_scope`
# states the boundary in words, because every published footprint excludes the
# use phase and most exclude end of life, and a number without its boundary is
# not a number anybody can use. There is deliberately no lifetime column: the
# footprints exclude the use phase on purpose, so the vendor gave the numerator
# and withheld the denominator, and how long a card stays in service is a fact
# about a fleet rather than about a part.
#
# `machines` holds whole products rather than parts: a laptop, a desktop, a
# rack server. They are here for one column, embodied_kgco2e, because that is
# the level manufacturers publish footprints at. Apple writes a product
# environmental report for each Mac and none for the chip inside it; Dell, HPE
# and Lenovo publish one per server model. A machine row is matched on
# `model_identifiers`, exactly as the firmware names the product (`sysctl
# hw.model` on a Mac, /sys/class/dmi/id/product_name on Linux), never by a
# resemblance: the 16-inch laptop is not the 14-inch one. Its figure is the
# manufacturing phase of the vendor's own lifecycle figure, and when the vendor
# gives only a total and a share, embodied_scope writes the multiplication out
# and names the configuration it was published for.
#
# memory_bandwidth_gbps is what makes a projection onto another accelerator
# honest rather than optimistic. A workload that waits on memory gains the ratio
# of bandwidths, not the ratio of peak FLOP/s, and the two differ by more than a
# factor of two between an A100 and an H100. A row without it can still be
# projected onto, and the projection then says it is reporting an upper bound on
# the speed-up rather than a bracket around it.

