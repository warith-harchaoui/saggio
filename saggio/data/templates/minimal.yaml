# The smallest cost model that is still honest.
# ------------------------------------------------------------------------------
# Nothing here is filled in, and that is the point: a scaffold whose numbers are
# all TODO tells the truth, while a scaffold full of plausible defaults would
# tell a lie that survives into a report. Fill the TODOs in, or measure them with
# `saggio measure`, and the statuses will rise on their own.

schema_version: "2.1"

date_updated: "YYYY-MM-DD"

unit_of_work:
  name: "TODO: the one thing whose cost this model reports"
  description: >-
    TODO: say what one unit is, precisely enough that two people would count it
    the same way. "One inference on a median-sized request" is a unit.
    "Some usage" is not.
  status: "TODO"
  out_of_scope: []

deployment:
  provider: "on-prem"
  country: "TODO"

assumptions:
  power_draw:
    value: null
    unit: "W"
    status: "TODO"
    notes: "Average watts while one unit of work runs. Measure it, or name the instance type."
  electricity_price:
    value: null
    unit: "USD/kWh"
    currency: "USD"
    status: "TODO"
    notes: "Set the country and this comes from the grid catalogue."
  grid_carbon_intensity:
    value: null
    unit: "gCO2e/kWh"
    status: "TODO"
    notes: "Set the country and this comes from the grid catalogue."
  pue:
    value: null
    unit: "ratio"
    status: "TODO"
    notes: "Datacenter overhead. Set the provider and this comes from the providers catalogue."

scenarios:
  - name: "default"
    runtime:
      value: null
      unit: "s"
      status: "TODO"
      notes: "Wall-clock seconds for one unit of work."
    costs:
      time:
        value: null
        unit: "s"
        status: "TODO"
        derived_from: ["scenarios[0].runtime"]
      energy:
        value: null
        unit: "kWh"
        status: "TODO"
        derived_from: ["scenarios[0].runtime", "assumptions.power_draw", "assumptions.pue"]
      money:
        value: null
        unit: "USD"
        currency: "USD"
        status: "TODO"
        derived_from: ["scenarios[0].costs.energy", "assumptions.electricity_price"]
      carbon:
        value: null
        unit: "gCO2e"
        status: "TODO"
        derived_from: ["scenarios[0].costs.energy", "assumptions.grid_carbon_intensity"]

exclusions:
  - "Making the hardware. Only the electricity to run it is counted."
  - "The people. Salaries, offices, and travel are out of scope."

provenance_rules:
  - "Every sourced value carries source_url and retrieved_date."
  - "A derived value names its inputs and never outranks the weakest of them."
  - "The country is stated, never inferred from a developer's locale."
