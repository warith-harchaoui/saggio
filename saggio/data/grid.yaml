# Electricity grids, by country.
# ------------------------------------------------------------------------------
# One row per country: what a kilowatt-hour emits there, what it costs, and which
# IANA timezones sit in it. Rows are keyed by ISO 3166-1 alpha-2 code, because a
# cost model writes `country: FR` and a dropdown that offered "France" instead
# could never match it.
#
# Every row carries provenance. Carbon intensity and price both move, so both are
# treated as sourced estimates that go stale (one month, per the catalog's
# freshness policy) rather than as constants of nature. Refresh with
# `saggio catalog freshness` and re-read the sources.
#
# in_european_union : present and true only on the twenty-seven Member States.
# It is a membership fact rather than a measurement, so it carries no source of
# its own and no retrieved date; the Union's own list is at
# https://european-union.europa.eu/principles-countries-history/eu-countries_en.
# It is here because one figure in the providers catalogue is scoped by it. The
# recast Energy Efficiency Directive obliges Member States -- not Europe, not
# the European Economic Area -- to make large data centres report their energy
# and water, and the Union-wide averages the Commission publishes from that duty
# are the `on-prem-eu` row. So the flag answers exactly one question: may this
# country's self-run room use that row. The United Kingdom, Norway and
# Switzerland sit in Europe and are not Member States, which is why a
# continent-shaped guess would have been wrong rather than merely imprecise.
#
# carbon_gco2e_per_kwh : annual average operating emissions of the national grid.
# price_usd_per_kwh    : indicative price, household or small-business tariff.
# timezones            : IANA zones used to offer, never to assert, a country.
#
# carbon_data_year is per row, and it is not the year the figure was read. Ember
# does not publish every country up to the same year: most reach 2025, Ukraine's
# series stops in 2022. One data year for the whole file used to be written onto
# all thirty-eight rows, so Ukraine's 2022 reading shipped as a 2025 one. Nothing
# about 250.5 gCO2e/kWh could have shown that; the stamp was the only place it
# could appear, and it said the wrong thing.
#
# carbon_source_url is the page Ember publishes the series on, which a reader can
# open. It is deliberately not `api.ember-energy.org`, where the refresh reads it
# from: without a key that endpoint answers HTTP 403 and no number at all, so
# thirty-eight rows cited a link that showed whoever followed it an error.

schema_version: "2.1"

# Country keys are quoted on purpose. Unquoted, YAML reads NO as the boolean false
# and Norway disappears from the catalogue without an error anywhere.
