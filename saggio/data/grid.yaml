    name: "Australia"
    carbon_gco2e_per_kwh: 580
    price_usd_per_kwh: 0.22
    timezones: ["Australia/Sydney", "Australia/Melbourne", "Australia/Brisbane", "Australia/Perth", "Australia/Adelaide"]
    source_url: "https://ember-energy.org/data/electricity-data-explorer/"
