# --- Ce que couvrent les compteurs propres d'une puce Apple
#     (analyze/apple.py, power/soc.py)

apple.soc_scope: >-
  les cœurs processeur, les cœurs graphiques et le moteur neuronal de la puce, par les compteurs d'énergie du système sur puce
apple.soc_memory_scope: >-
  la mémoire de la puce, par son propre compteur d'énergie
apple.soc_model_note: >-
  Ce sont les compteurs d'énergie propres à la puce : un modèle à l'intérieur du
  silicium plutôt qu'un appareil de mesure sur le rail d'alimentation, et Apple
  dit explicitement qu'ils ne sont pas une base pour comparer une machine à une
  autre. N'y figurent pas : l'écran, le stockage, le réseau, les ventilateurs et
  les pertes propres de l'alimentation.
apple.intel_mac: >-
  C'est un Mac Intel, dont macOS ne publie le compteur de paquet que par
  powermetrics, qui exige des droits d'administrateur et ne peut donc pas être lu par un appel de bibliothèque.
apple.unknown_layout: >-
  Cette puce Apple publie ses canaux d'énergie sous des noms que ce paquet ne
  reconnaît pas : rien n'a donc été mesuré plutôt que quelque chose deviné.
  Signaler les noms de canaux dans un ticket suffit à ajouter la pièce.
apple.silent_counters: >-
  La bibliothèque de relevé de ce Mac se charge, et le groupe d'énergie qu'elle
  publie ne porte aucun canal pour les cœurs processeur : rien n'a donc été
  mesuré plutôt que quelque chose deviné. Deux machines répondent ainsi : celle
  dont la puce est atteinte à travers un hyperviseur, qui garde les compteurs
  pour l'hôte, et celle dont ce paquet n'a pas appris à lire les noms de canaux.
  Signaler ces noms dans un ticket permet de les distinguer.
soc.figure_covers: "Le chiffre couvre {scope}, lu sur les compteurs {channels}."
soc.figure_covers_both: >-
  Le chiffre couvre {scope} et {memory}, lus sur les compteurs {channels}.
report.whatif.here_measured: "cette machine, telle qu'elle a été mesurée"
report.whatif.here_estimated: "cette machine, telle que le catalogue l'estime"
report.chain_caption: >-
  Chaque case est colorée selon la solidité de son chiffre. Une couleur faible en
  amont plafonne tout ce qui est en aval : c'est la règle du maillon faible,
  dessinée.
