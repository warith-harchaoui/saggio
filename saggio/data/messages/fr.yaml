# --- La prose propre au rapport statique (saggio/report/markdown.py)

report.title: "Coût d'exécution de {name}"
report.title.default: "Coût d'exécution de ce code"
report.weakest: >-
  **Ce modèle ne vaut que son chiffre le plus faible, qui est `{status}`.**
  {meaning}
report.updated: "Dernière mise à jour {date}. Schéma {schema}."
report.schema_only: "Schéma {schema}."
report.not_known: "non connu"
report.no_numbers: "Ce modèle n'énonce encore aucun chiffre."
report.unit.excluded: "Ne fait pas partie d'une unité :"
report.scenario.no_costs: "_Ce scénario n'énonce encore aucun coût._"
report.not_placed: "**non rangé**"
report.inventory.lede: >-
  Le scope dépend de qui exploite la machine : c'est pourquoi le même code se
  range sur une ligne différente, dans le bilan d'une entreprise différente,
  selon l'endroit où il tourne.
report.inventory.founded: >-
  Solidité de ces chiffres : {summary}. Une déclaration de durabilité doit dire
  quelle part d'un bilan repose sur des estimations plutôt que sur des relevés ;
  chaque nombre de ce rapport le dit déjà.
report.services.lede: >-
  Les tarifs ne sont pas recopiés dans ce modèle. Un prix d'API recopié
  aujourd'hui sera faux dans trois mois : le rapport dit donc où vit le prix du
  jour et laisse le chiffre ouvert jusqu'à ce que quelqu'un le lise.
report.models.lede: >-
  Un tarif n'est pas un coût. Voici ce que le fournisseur facture par unité ;
  combien de ces unités une unité de travail dépense est la moitié ouverte, et
  lire le code ne permet pas de l'établir.
report.no_rate: "_Aucun tarif publié n'a été trouvé pour ce modèle._"
report.projections.lede: "Une projection n'est pas une mesure de ce vers quoi elle projette."
report.projection.assumes: "Ce qu'elle suppose"
report.projection.limits: "Où elle casse"
report.projection.bracketed: "{dimension}, encadré"
report.projection.bracket_note: "Le plus rapide et le plus lent que les preuves admettent."
report.measurement.hot_path: "Où est passé le temps :"
report.measurement.function: "Fonction"
report.measurement.cumulative: "Secondes cumulées"
report.measurement.calls: "Appels"
report.measurement.warnings: "À lire avant de se fier aux chiffres ci-dessus :"
