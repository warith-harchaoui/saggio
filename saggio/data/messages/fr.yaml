# --- Sur quoi reposent les chiffres, tel qu'un audit l'écrit
#     (auditor/assumptions.py)

assumption.embodied.generic_cpu: >-
  Aucun accélérateur n'a été identifié, et le processeur ne s'est résolu qu'en un
  défaut générique, dont l'empreinte serait générique elle aussi. Exclu plutôt
  que supposé nul.
assumption.embodied.nothing_identified: >-
  Ni accélérateur ni processeur n'ont pu être identifiés : le carbone de
  fabrication de cette machine n'est donc pas quelque chose que ce modèle puisse
  énoncer. Exclu plutôt que supposé nul.
assumption.embodied.no_footprint: >-
  Aucune empreinte carbone produit n'est au dossier pour {part}. Ajoutez
  `embodied_kgco2e` à sa ligne de catalogue avec l'URL de l'empreinte elle-même
  et la date de lecture ; `saggio catalog add {section}` fait le reste.
assumption.embodied.published: "Empreinte carbone produit publiée."
assumption.lifetime: >-
  Combien de temps ce matériel reste en service, ce que vous seul savez. Les
  empreintes publiées sont du berceau à la sortie d'usine et excluent la phase
  d'usage : aucune n'énonce de durée de vie. Les chiffres rapportés se groupent
  entre trois et six ans ; choisir dans cette fourchette fait varier le carbone
  incorporé d'un facteur deux, et c'est pourquoi la question est posée plutôt que
  tranchée.
assumption.market_factor: >-
  Le facteur d'émission de l'électricité que vous avez contractée, qu'aucun
  catalogue ne peut porter : c'est une propriété de votre contrat, pas de votre
  pays. {sources} Enregistrez-le avec le document fournisseur ou le certificat
  qui l'énonce et la date de lecture — c'est le seul chiffre du modèle que
  personne d'autre ne peut vérifier et que rien ici ne peut rafraîchir. Le
  laisser ouvert est une réponse complète ; un zéro parce que l'électricité est
  « verte » n'en est pas une.
assumption.power.measured: >-
  Lu sur la machine pendant l'exécution de la tranche. {scope} {boundary}
assumption.runtime.measured: "Temps d'horloge de `{command}`."
assumption.runtime.not_measured: >-
  Aucune exécution n'a été mesurée. Mesurez la vraie commande avec
  `saggio measure`, ou relancez l'audit avec --run.

