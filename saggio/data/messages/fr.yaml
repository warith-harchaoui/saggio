energy.power.nameplate: "Somme des plaques, méthode Green Algorithms : {parts}"
energy.total.none: "Aucun montant ne portait de nombre."
energy.total.currencies: >-
  Les montants sont dans des devises différentes ({currencies}) ; convertissez-les
