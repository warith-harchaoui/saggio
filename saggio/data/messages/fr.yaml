# --- La prose propre au rapport statique (saggio/report/markdown.py)

report.title: "Coût d'exécution de {name}"
report.title.default: "Coût d'exécution de ce code"
report.weakest: >-
  **Ce modèle ne vaut que son chiffre le plus faible, qui est `{status}`.**
  {meaning}
report.updated: "Dernière mise à jour {date}. Schéma {schema}."
report.schema_only: "Schéma {schema}."
report.not_known: "non connu"
report.no_numbers: "Ce modèle n'énonce encore aucun chiffre."
report.unit.excluded: "Ne fait pas partie d'une unité :"
report.scenario.no_costs: "_Ce scénario n'énonce encore aucun coût._"
report.not_placed: "**non rangé**"
report.inventory.lede: >-
  Le scope dépend de qui exploite la machine : c'est pourquoi le même code se
  range sur une ligne différente, dans le bilan d'une entreprise différente,
  selon l'endroit où il tourne.
report.inventory.founded: >-
  Solidité de ces chiffres : {summary}. Une déclaration de durabilité doit dire
  quelle part d'un bilan repose sur des estimations plutôt que sur des relevés ;
  chaque nombre de ce rapport le dit déjà.
report.services.lede: >-
  Les tarifs ne sont pas recopiés dans ce modèle. Un prix d'API recopié
  aujourd'hui sera faux dans trois mois : le rapport dit donc où vit le prix du
  jour et laisse le chiffre ouvert jusqu'à ce que quelqu'un le lise.
report.models.lede: >-
  Un tarif n'est pas un coût. Voici ce que le fournisseur facture par unité ;
  combien de ces unités une unité de travail dépense est la moitié ouverte, et
  lire le code ne permet pas de l'établir.
report.no_rate: "_Aucun tarif publié n'a été trouvé pour ce modèle._"
report.projections.lede: "Une projection n'est pas une mesure de ce vers quoi elle projette."
report.projection.assumes: "Ce qu'elle suppose"
report.projection.limits: "Où elle casse"
report.projection.bracketed: "{dimension}, encadré"
report.projection.bracket_note: "Le plus rapide et le plus lent que les preuves admettent."
report.measurement.hot_path: "Où est passé le temps :"
report.measurement.function: "Fonction"
report.measurement.cumulative: "Secondes cumulées"
report.measurement.calls: "Appels"
report.measurement.warnings: "À lire avant de se fier aux chiffres ci-dessus :"
report.generated: "Produit par [saggio](https://github.com/warith-harchaoui/saggio)."

# --- Comment chaque grandeur a été calculée, et ce qu'elle exige
#     (estimate/energy.py)

energy.needs.it: "Exige à la fois un temps d'exécution et une puissance moyenne."
energy.needs.facility: >-
  Exige l'énergie propre à la machine et l'efficacité énergétique du site (PUE).
energy.needs.carbon: >-
  Exige l'énergie tirée et l'intensité carbone du réseau là où le code tourne.
energy.needs.market: >-
  Exige l'énergie tirée et le facteur d'émission de l'électricité que vous avez
  contractée. Une moyenne de réseau relève de l'autre méthode et ne convient pas
  ici.
energy.needs.water: >-
  Exige l'énergie de la machine et une efficacité d'usage de l'eau publiée.
energy.needs.money: "Exige l'énergie tirée et un prix du kilowattheure."
energy.negative.it: >-
  Un temps ou une puissance négatifs sont une erreur de signe, pas un coût.
energy.negative.facility: >-
  Une énergie ou un facteur de surcoût négatifs sont une erreur de signe, pas un
  coût.
energy.negative.carbon: >-
  Une énergie ou une intensité négatives sont une erreur de signe, pas un coût.
energy.negative.market: >-
  Une énergie ou un facteur négatifs sont une erreur de signe, pas un coût.
energy.negative.water: >-
  Une énergie ou une efficacité négatives sont une erreur de signe, pas un coût.
energy.negative.money: >-
  Une énergie ou un prix négatifs sont une erreur de signe, pas un coût.
energy.method.it: "temps en heures x puissance moyenne en watts / 1000."
energy.method.facility: >-
  Énergie de la machine x efficacité énergétique du site : ce que tire le
  bâtiment.
energy.method.carbon: >-
  Énergie du site x intensité carbone du réseau, émissions d'exploitation
  seulement.
energy.method.market: >-
  Énergie du site x votre facteur d'émission contracté, émissions d'exploitation
  seulement. Market-based : déclaré à côté du chiffre location-based, pas à sa
  place.
energy.method.water: >-
  Énergie de la machine x efficacité d'usage de l'eau sur site ; l'eau utilisée
  pour produire l'électricité n'est pas comptée.
energy.method.money: >-
  Énergie du site x prix du kilowattheure ; le matériel et les salaires ne sont
  pas compris.
energy.method.total: "Somme des coûts monétaires d'une unité de travail."
energy.power.no_cpu: >-
  Le processeur n'est pas identifié : sa puissance ne peut donc pas être
  recherchée.
energy.power.unknown_part: >-
  {part} n'est pas dans le catalogue matériel ; ajoutez-le avec le TDP de sa
  fiche technique avant qu'une puissance puisse être donnée.
energy.power.unknown_accelerators: >-
  Cette machine a {count} accélérateur(s) que le catalogue matériel ne reconnaît
  pas, et leur puissance de carte est l'essentiel de ce qu'ils tirent. Ajoutez la
  ligne avec `saggio catalog add gpu` et le TDP de leur fiche technique, ou
