  Lire et étendre les catalogues de matériel, de réseaux, de fournisseurs et de
  services.
cli.help.list.summary: "Afficher les lignes d'un catalogue."
cli.help.catalog.list.json: "Les afficher en JSON."
cli.help.add.summary: "Ajouter une ligne localement, provenance obligatoire."
cli.help.catalog.add.key: "La clé de la ligne, par exemple H200 ou FR."
cli.help.catalog.add.source_url: "D'où viennent les chiffres."
cli.help.catalog.add.retrieved_date: "AAAA-MM-JJ de votre lecture."
cli.help.catalog.add.field: >-
  Un champ de la ligne, répétable, par exemple --field tdp_w=700.
cli.help.read_pcf.summary: >-
  Lire l'empreinte carbone produit d'un fournisseur et en ébaucher une ligne.
cli.help.catalog.read-pcf.document: >-
  Le lien https vers la fiche du fournisseur, ou un chemin vers une fiche déjà
  téléchargée.
cli.help.catalog.read-pcf.json: "Afficher la lecture en JSON."
cli.help.refresh.summary: >-
  Relire les chiffres d'un catalogue à la source qu'il cite. Lecture seule
  sauf si --write est donné.
cli.help.catalog.refresh.catalog: >-
  Quel catalogue : `grid` ou `hardware`.
cli.help.catalog.refresh.api_key: >-
  Clé d'API Ember, facultative. À défaut, EMBER_API_KEY. Sans clé, la colonne
  carbone est lue dans le jeu de données annuel publié par Ember — la même série
  sous CC-BY-4.0, celle que chaque ligne cite ; avec une clé, elle est lue dans
  l'API d'Ember, et l'exécution dit laquelle a répondu. Rien d'extérieur à Ember
  ne sert de substitut, parce que l'autre série ouverte qui paraît équivalente
  mesure le cycle de vie et non les émissions d'exploitation.
cli.help.catalog.refresh.year: >-
  Année des données. Par défaut la plus récente dont chaque pays dispose, qui
  n'est pas la même année pour tous : une ligne enregistre la sienne.
cli.help.catalog.refresh.column: >-
  Quelle colonne relire. Pour `grid` : `carbon` interroge Ember, `price` la page
  de tarifs, `timezones` vérifie les noms contre la base IANA qui les définit,
  `both` fait carbone et prix, `all` fait les trois. Pour `hardware` :
  `embodied` demande les empreintes de processeurs. Chaque colonne porte sa
  propre source et sa propre date, parce qu'elles ne viennent pas du même endroit
  et ne bougent pas ensemble.
cli.help.catalog.refresh.write: >-
  Appliquer le résultat à ce fichier de catalogue. Sans ce drapeau, rien n'est
  écrit.
cli.help.catalog.refresh.json: "Afficher le résultat en JSON."
cli.help.freshness.summary: >-
  Lister les lignes que personne n'a vérifiées récemment. Sort en 1 si l'une est
  périmée.
cli.help.catalog.freshness.within: >-
  Avertir aussi des lignes qui se périment dans tant de jours, sans échouer. Par
  défaut {default} ; 0 éteint l'avertissement.
cli.help.catalog.freshness.json: "Les afficher en JSON."
cli.help.language: >-
  Langue de ce que cette commande écrit, demande et affiche. Les phrases déjà
  enregistrées dans un modèle restent telles qu'elles ont été écrites.

# --- Projeter une tranche sur une exécution entière (estimate/extrapolate.py)

project.no_number: "La tranche ne porte aucun nombre : il n'y a donc rien à projeter."
project.bad_fraction: >-
  Une part exécutée de {fraction} est en dehors de (0, 1] ; ce doit être la part de
  l'exécution entière réellement exécutée.
project.scaling_refused: >-
  La montée en charge de ce travail a été mesurée et la mesure a refusé
  d'énoncer un exposant : {reason} Tant que ce n'est pas résolu, projeter par le
  rapport des tailles affirmerait une proportionnalité que les exécutions
  disponibles n'étayent pas.
project.linear.notes: "Projeté à partir d'une tranche couvrant {percent} de l'exécution."
project.linear.method: "Course entière = tranche mesurée / {fraction}."
project.linear.assumption.same_per_unit: >-
  Le travail restant coûte autant par unité que la tranche exécutée.
project.linear.assumption.spread_evenly: >-
  Le démarrage, les points de reprise et le chargement des données sont répartis
  uniformément sur l'exécution.
project.linear.limit.later_stages: >-
  Une exécution dont les étapes tardives changent de forme — un ordonnancement du taux
  d'apprentissage qui change la taille de lot, par exemple — ne monte pas linéairement.
project.linear.limit.one_off: >-
  Les coûts payés une seule fois, entièrement dans la tranche, sont comptés
  comme s'ils revenaient du début à la fin.
project.linear.limit.unchecked: >-
  Rien ici n'a vérifié que le travail est uniforme. Mesurer quelques tranches de
  tailles différentes transformerait cette hypothèse en un exposant ; voir
  saggio.estimate.scaling.
project.scaled.notes: >-
  Projeté à partir d'une tranche couvrant {percent} de l'exécution, avec un exposant de
  montée en charge mesuré de {exponent}.
project.scaled.method: "Course entière = tranche mesurée / {fraction}^{exponent}. {method}"
project.scaled.assumption.keeps_scaling: >-
  Le travail conserve la montée en charge qu'on lui a mesurée sur les tailles
  exécutées.
project.scaled.assumption.grows_with_size: >-
  Le démarrage, les points de reprise et le chargement des données croissent
  avec la taille comme ils l'ont fait sur les tranches mesurées.
project.scaled.limit.beyond_measured: >-
  Au-delà de la plus grande taille mesurée, l'exposant est une extrapolation :
  il décrit comment le travail a crû là où on l'a regardé croître, pas une loi.
project.scaled.limit.range: >-
  L'exposant tient entre les tailles {smallest} et {largest}, et l'exécution entière
  vaut environ {whole} à la même échelle, soit {times} fois la plus grande taille
  réellement exécutée.

# --- Projeter sur une autre machine (estimate/extrapolate.py, moitié matérielle)

project.refused: "Refusé."
project.no_runtime: "La durée ne porte aucun nombre : il n'y a donc rien à projeter."

project.machine.unknown_precision: >-
  {precision} n'est pas une précision que ce paquet sait chercher. Connues :
  {known}.
project.machine.unknown_accelerator: >-
  Pas au catalogue matériel : {missing}. Accélérateurs connus : {known}. Ajoutez le
  manquant avec `saggio catalog add gpu`.
project.machine.no_throughput: >-
  Le catalogue n'a pas de {column} pour {missing} : il n'existe donc aucun rapport
  {precision} par lequel mettre à l'échelle. Deux puces ne gardent pas le même rapport
  d'une précision à l'autre : mettre cette durée à l'échelle avec le chiffre d'une autre
  précision énoncerait donc autre chose que ce qu'on demande. Renseignez cette colonne
  d'après la fiche technique du fabricant, avec `saggio catalog add gpu {first} --field
  {column}=...`, ou mesurez sur la cible.
project.machine.declared_memory_bound: >-
  Le travail a été déclaré limité par la mémoire et le catalogue n'a pas de {column}
  pour l'une de ces puces. Ajoutez les lignes de bande passante avant de projeter une
  exécution limitée par la mémoire.

project.machine.basis.compute: >-
  le rapport des débits arithmétiques de crête en {precision}, {target} /
  {source} TFLOP/s
project.machine.basis.bandwidth: >-
  le rapport des bandes passantes mémoire, {target} / {source} Go/s
project.machine.basis.compute_bound: >-
  {basis}, le travail ayant été tenu pour limité par l'arithmétique
project.machine.basis.memory_bound: >-
  {basis}, le travail ayant été tenu pour limité par la mémoire plutôt que par
  l'arithmétique
project.machine.basis.slower: >-
  le plus lent des deux rapports ({basis}), rien n'ayant établi lequel de
  l'arithmétique et de la mémoire limite ce travail

project.machine.assumption.half_precisions: >-
  Le FP16 et le BF16 sont mis à l'échelle par la même colonne du catalogue, parce que,
  pour ces puces, les fabricants n'annoncent qu'un seul débit dense de cœurs tensoriels,
  couvrant les deux.
project.machine.assumption.same_share: >-
  Les deux accélérateurs atteignent sur ce travail une part comparable de leur
  propre débit de crête.
project.machine.assumption.enough_memory: >-
  La cible a assez de mémoire pour contenir le même ensemble de travail, ce que le
  catalogue peut démentir mais ne peut pas confirmer.
project.machine.assumption.one_accelerator: >-
  Un seul accélérateur, avec la même taille de lot et le même parallélisme que
  ceux mesurés.
project.machine.assumption.between: >-
  Le travail est limité par l'arithmétique ({compute}x) ou par la bande passante mémoire
  ({bandwidth}x), et se situe entre les deux.

project.machine.limit.less_memory: >-
  {target} a {target_memory} Go de mémoire contre {source_memory} Go sur {source}. Rien
  ici ne sait quelle part l'exécution mesurée en a utilisée : c'est donc une durée pour
  une exécution qui pourrait ne pas démarrer du tout. Vérifiez l'ensemble de travail
  avant de citer le chiffre.
project.machine.limit.datasheet: >-
  Le débit de crête et la bande passante de crête sont des chiffres de fiche technique,
  pas des mesures. Une vraie exécution n'atteint qu'une fraction de l'un comme de
  l'autre, et cette fraction diffère selon la puce.
project.machine.limit.not_accelerator_bound: >-
  Un travail limité par le stockage, par le chargeur de données ou par le processeur
  hôte ne suivra ni l'un ni l'autre rapport, et peut n'y gagner rien du tout.
project.machine.limit.multi_accelerator: >-
  La montée en charge sur plusieurs accélérateurs, l'interconnexion et le coût
  des communications ne sont pas modélisés ici.
project.machine.limit.no_bracket: >-
  Le catalogue n'a pas de {column} pour l'une de ces puces : rien n'encadre donc le
  chiffre par le bas. C'est l'extrémité de l'intervalle où l'arithmétique limite : une
  borne haute sur l'accélération, et donc une borne basse sur ce que coûte l'exécution.

project.machine.bound.best: >-
  Au mieux : chaque partie de l'exécution obtient la totalité du facteur {ratio}x.

project.processor.unknown_processor: >-
  Pas au catalogue matériel : {missing}. Processeurs connus : {known}. Ajoutez le
  manquant avec `saggio catalog add cpu`.
project.processor.different_benchmarks: >-
  {source} est noté au banc {source_benchmark} et {target} au banc {target_benchmark}.
  Deux indices ne forment un rapport que s'ils viennent du même banc d'essai, passé de
  la même façon ; renotez l'un au banc de l'autre avant de projeter.
project.processor.no_scores: >-
  Le catalogue n'a ni {single} ni {throughput}, ni pour {source} ni pour {target} : il
  n'existe donc aucun rapport par lequel mettre à l'échelle. Contrairement à un
  accélérateur, un processeur n'annonce aucun chiffre de crête digne d'être mis à
  l'échelle — la fréquence et le nombre de cœurs n'en donnent pas, parce que le travail
  fait par cycle diffère d'une puce à l'autre. Un indice publié, lui, en donne un :
  prenez le SPECrate2017_int_base d'un résultat sur spec.org, divisez-le par le nombre
  de sockets pour que deux puces se comparent socket à socket, et inscrivez dans
  `{benchmark}` de quel banc d'essai il s'agit, afin que rien ne soit jamais divisé par
  l'indice d'autre chose.

project.processor.basis.only_single: >-
  le rapport des indices mono-fil, le seul que le catalogue puisse soutenir
project.processor.basis.only_throughput: >-
  le rapport des indices de débit tous cœurs, le seul que le catalogue puisse
  soutenir
project.processor.basis.single: >-
  le rapport des indices mono-fil, l'exécution ayant occupé {parallelism} cœurs en
  moyenne
project.processor.basis.throughput: >-
  le rapport des indices de débit tous cœurs, l'exécution ayant occupé {parallelism}
  cœurs sur {cores} en moyenne
project.processor.basis.slower_single: >-
  le plus lent des deux rapports (celui des indices mono-fil), {measured}
project.processor.basis.slower_throughput: >-
  le plus lent des deux rapports (celui des indices de débit tous cœurs),
  {measured}
project.processor.measured.none: >-
  rien n'ayant mesuré combien de cœurs l'exécution a occupés
project.processor.measured.between: >-
  l'exécution ayant occupé {parallelism} cœurs, ce qui n'est ni un seul cœur ni la
  plupart d'entre eux

project.processor.assumption.still_single: >-
  L'exécution projetée est aussi mono-fil que l'exécution mesurée l'était.
project.processor.assumption.spreads: >-
  L'exécution projetée s'étale sur les cœurs de la cible comme elle s'est étalée sur les
  {cores} de la source, ce qu'une puce bien plus pourvue en cœurs peut ne pas lui
  permettre.
project.processor.assumption.same_share: >-
  Les deux processeurs atteignent sur ce travail une part comparable de leur
  propre indice, ce qui est une hypothèse plus solide pour un banc d'essai que
  pour une fiche technique, et reste une hypothèse.
project.processor.assumption.same_surroundings: >-
  La même mémoire, le même stockage et la même interconnexion autour des deux
  puces.

project.processor.limit.one_result: >-
  Un indice publié est un résultat, sur un système, avec un compilateur et un jeu
  d'options. Un autre résultat pour la même puce peut en différer d'un cinquième, et un
  travail qui ne ressemble pas à celui du banc d'essai, bien davantage.
project.processor.limit.not_processor_bound: >-
  Un travail limité par le stockage, par le réseau ou par un verrou ne suivra aucun des
  deux rapports, et peut n'y gagner rien du tout.
project.processor.limit.no_bracket: >-
  Un seul des deux indices est au catalogue pour ces puces : rien n'encadre donc le
  chiffre. Ajoutez l'autre avant de le citer comme un intervalle.

project.processor.bound.best: >-
  Au mieux : l'exécution obtient la totalité du facteur {ratio}x.

project.hardware.bound.worst: "Au pire dans l'encadrement : {ratio}x."
project.hardware.notes: >-
  Mis à l'échelle de {source} vers {target} par {ratio}x, d'après {basis}.
project.hardware.method: >-
  Durée sur {target} = durée sur {source} / {ratio}, où {ratio} est {basis}.

# --- Ce qu'un audit écrit dans le modèle qu'il construit (auditor/build.py)

audit.no_country: >-
  Aucun pays n'a été résolu : les chiffres carbone et monétaires restent donc
  ouverts. Passez --country avec un code ISO, par exemple --country FR.
audit.country_not_catalogued: >-
  Le catalogue des réseaux n'a aucune ligne pour {country} : son intensité
  carbone et son tarif restent donc ouverts. Ajoutez-la avec
  `saggio catalog add country`.
audit.no_local_model: >-
  Aucun modèle local n'était joignable ; la lecture est purement statique.
audit.machine_provenance: >-
  Ceci décrit la machine qui a exécuté l'audit, pas l'endroit où le code tourne.
  {origin} a été cloné et lu ici. Remplacez la machine, le fournisseur et le pays
  par ceux sur lesquels il tourne réellement avant qu'aucun chiffre ci-dessous ne
  signifie quoi que ce soit sur ce projet.
audit.scenario_description: >-
  Une unité de travail telle que cet audit l'a trouvée, sur la machine où il a
  tourné.
audit.exclusion.hardware: >-
  La fabrication du matériel. Seule l'électricité qui le fait tourner est
  comptée.
audit.exclusion.people: >-
  Les gens. Salaires, bureaux et déplacements sont hors périmètre.
audit.rule.provenance: >-
  Toute valeur sourcée porte un source_url et un retrieved_date.
audit.rule.weakest: >-
  Une valeur dérivée nomme ses entrées et ne surclasse jamais la plus faible
  d'entre elles.
audit.rule.country: >-
  Le pays est indiqué par un humain, jamais déduit de la locale d'un développeur.
audit.clone.no_git: >-
  git n'est pas dans le PATH, et le clonage en a besoin. Installez git, ou clonez
  le dépôt vous-même et auditez le répertoire.
audit.clone.timeout: "Le clonage de {url} a dépassé {seconds}."
audit.clone.failed: "Impossible de cloner {url} : {detail}"

# --- Plier une mesure dans un modèle (saggio/fold.py)

fold.no_units: "Une commande ne peut pas avoir accompli {units} unités de travail."
fold.no_duration: "Une exécution sans durée n'est pas la mesure d'une durée."
fold.no_such_scenario: "Ce modèle n'a aucun scénario nommé {name}."
fold.no_scenario: "Ce modèle n'a aucun scénario où plier une mesure."
fold.invalid_before: "Le modèle ne valide pas avant le pliage : {issues}"
fold.invalid_after: "Le modèle ne validerait plus : {issues}"
fold.change.idle: >-
  exclusions : la capacité au repos n'est plus déclarée dehors, parce que la
  puissance a été lue sur la machine entière
fold.change.whole_run: >-
  exécution entière : projetée à partir des coûts par unité ci-dessus
fold.change.repeated_runs: >-
  exécutions répétées : l'exécution entière fois le facteur d'échelle pragmatique du
  modèle
fold.timed: "Chronométré avec `saggio measure` : {command}."
fold.timed_no_command: "Chronométré avec `saggio measure`."
fold.per_unit: >-
  La commande a accompli {units} unités de travail : le chiffre est donc le temps
  d'horloge divisé par {units}.
fold.power_read: >-
  Lu sur la machine pendant l'exécution de la commande. {scope} {boundary}
  {spread}
fold.whole_run.description: >-
  Ce que coûterait une exécution entière, à partir des coûts par unité de {scenario}. Une
  exécution entière accomplit {units} {unit}, comme {source} l'indique. Cela suppose
  qu'une unité de travail est un(e) {singular} ; si l'unité de travail du modèle désigne
  autre chose, réénoncez ceci.
fold.repeated.open: >-
  Le chiffre de l'exécution entière ou le facteur d'échelle pragmatique est encore
  ouvert.
fold.repeated.scaled: >-
  L'exécution entière fois le facteur d'échelle énoncé de {factor}.
fold.repeated.description: >-
  Ce que coûteraient toutes les exécutions ensemble : la projection de l'exécution
  entière multipliée par le facteur d'échelle pragmatique que le modèle énonce — combien
  de fois ce calcul est réellement effectué, réglages et reprises compris. Ce facteur
  est l'estimation de l'équipe elle-même ; rien ici ne peut le connaître, et c'est
  pourquoi il vit dans les hypothèses, là où le validateur le surveille.

# --- Ce que cette machine laisse lire (analyze/capability.py)
#
# Les noms d'interfaces gardent l'orthographe du produit — powercap, IOReport,
# nvidia-smi — et seuls les mots autour sont traduits. Renommer une interface du
# noyau laisserait un lecteur sans rien à chercher.

capability.platypus_note: >-
  Linux garde ce compteur réservé à root depuis la 5.10, et c'est volontaire :
  échantillonné assez vite, il laisse fuir ce que d'autres processus calculent
  (CVE-2020-8694, l'attaque PLATYPUS). L'ouvrir à un groupe est un jugement sur
  qui partage cette machine : c'est pourquoi la manœuvre est affichée ici plutôt
  que faite à votre place.
capability.rapl.remedy.until_reboot: "Jusqu'au prochain redémarrage :"
capability.rapl.remedy.across_reboots: >-
  D'un redémarrage à l'autre, une règle udev qui ne touche que les fichiers
  d'énergie :
capability.rapl.remedy.in_file: "dans {path}."
capability.powermetrics.note: >-
  macOS publie les mêmes chiffres par powermetrics, qui exige des droits
  d'administrateur. Ce paquet ne les demandera pas ; lancez
  `sudo powermetrics --samplers cpu_power -n 1` vous-même si vous voulez
  comparer avec ce qui a été mesuré ici.
capability.unsupported: >-
  saggio prend en charge Linux et macOS. Windows est hors périmètre,
  délibérément et pour de bonnes raisons : il ne publie à un processus non
  privilégié aucun compteur d'énergie processeur indépendant du fournisseur,
  aucun total de temps processeur à l'échelle de la machine que ce paquet puisse
  lire, et aucune comptabilité POSIX des ressources d'un enfant. L'Energy Meter
  Interface existe sur certains appareils via un pilote de fournisseur, et les
  chiffres par application de powercfg sont un modèle de batterie, pas un
  compteur. Un outil dont toute la proposition est qu'un nombre dit jusqu'où on
  peut s'y fier ne devrait pas prétendre prendre en charge une plate-forme où il
  ne pourrait jamais qu'estimer.

capability.rapl.name: "powercap Linux (RAPL)"
capability.rapl.covers: >-
  le paquet processeur, et la mémoire là où une zone existe pour elle
capability.rapl.covers.with_memory: "le paquet processeur et sa mémoire"
capability.rapl.covers.without_memory: >-
  le paquet processeur, mais pas la mémoire à côté
capability.rapl.absent: >-
  Aucune zone powercap n'est publiée ici. C'est une machine ARM, une machine
  virtuelle dont l'hôte ne transmet pas les compteurs, ou un conteneur sans
  /sys/class/powercap monté.
capability.rapl.reads: "Zones qui répondent : {zones}."
capability.rapl.blocked: "{count} zone(s) sont là et vous sont fermées. {why}"

capability.apple.name: "Compteurs du système sur puce Apple (IOReport)"
capability.apple.covers: >-
  les cœurs processeur, les cœurs graphiques, le moteur neuronal et la mémoire
capability.apple.reads: >-
  Lus en utilisateur ordinaire ; aucun mot de passe n'est demandé et aucun n'est
  nécessaire.
capability.apple.absent: "Pas un Mac Apple Silicon."

capability.powermetrics.name: "powermetrics (macOS)"
capability.powermetrics.covers: "les mêmes sous-systèmes, par l'outil d'Apple"
capability.powermetrics.absent: "Pas installé sur cette machine."

capability.nvidia.name: "Pilote NVIDIA (nvidia-smi)"
capability.nvidia.covers: "la carte accélératrice entière"
capability.nvidia.absent: >-
  Aucun nvidia-smi dans le PATH : il n'y a donc aucun pilote NVIDIA à interroger.
capability.nvidia.energy: >-
  La carte tient un compteur d'énergie cumulé, qui est lu exactement.
capability.nvidia.sampled: >-
  La carte publie une puissance instantanée plutôt qu'un total : elle est donc
  échantillonnée sur toute l'exécution, et le nombre d'échantillons voyage avec
  la moyenne.

capability.graphics.name: "Pilote graphique Linux (amdgpu, i915, xe)"
capability.graphics.covers: "le périphérique graphique"
capability.graphics.absent: >-
  Aucun périphérique graphique ici ne publie de capteur de puissance par sysfs.
capability.graphics.energy: >-
  Un compteur cumulé {file} est publié aux utilisateurs ordinaires : aucun outil
  de fournisseur et aucun privilège ne sont donc nécessaires.
capability.graphics.power: >-
  {file} est publié aux utilisateurs ordinaires ; il est instantané, donc
  échantillonné sur toute l'exécution.
capability.graphics.blocked: >-
  Le nœud de surveillance est là, mais ni son compteur d'énergie ni son capteur
  de puissance ne peuvent être lus.

capability.node.name: "Contrôleur de carte mère (IPMI, DCMI, Redfish)"
capability.node.covers: >-
  le nœud entier, ventilateurs, stockage et pertes de l'alimentation comprises
capability.node.detail: >-
  Le compteur propre d'un serveur est le seul chiffre ici qui couvre la machine
  entière plutôt qu'une partie, et il s'atteint avec des identifiants du
  contrôleur d'administration plutôt qu'avec un fichier. Ce paquet ne détient pas
  ces identifiants et ne les demande pas ; sur une grappe, le chiffre que votre
  exploitant collecte déjà est le meilleur, et le modèle peut le porter comme
  valeur mesurée.
capability.summary.covers: "couvre : {covers}"
capability.summary.remedy: "pour l'ouvrir : {remedy}"
capability.nothing_measures_detail: >-
  Rien ici ne mesure la puissance : l'énergie sera donc estimée à partir du catalogue matériel, et chaque chiffre qui en dérive portera `estimated`
  plutôt que `measured`. C'est un chiffre plus faible, pas un chiffre faux.

# --- Ce qu'un compteur de puissance couvre, et ce qu'il rate
#     (analyze/power/tables.py)

power.rapl_scope: >-
  Intel RAPL ne compte que le paquet processeur : la consommation d'un
  accélérateur discret n'y est pas comprise, donc une charge GPU mesurée ainsi
  est sous-comptée.
power.accelerator.counter: >-
  la carte accélératrice entière, par le compteur d'énergie cumulé du pilote
power.accelerator.sampled: >-
  la carte accélératrice entière, comme moyenne de {count} relevés de puissance
  de carte instantanée pris toutes les {interval} au long de l'exécution
power.graphics.counter: >-
  le périphérique graphique, par le compteur d'énergie cumulé du pilote dans
  sysfs, qui n'exige ni outil de fournisseur ni droits d'administrateur
power.graphics.sampled: >-
  le périphérique graphique, comme moyenne de {count} relevés de puissance de
  carte instantanée pris dans sysfs toutes les {interval} au long de l'exécution
power.memory_measured: >-
  La mémoire est mesurée et non estimée ici : la machine publie son propre
  compteur d'énergie mémoire, donc le chiffre est ce que la mémoire a tiré et non
  ce que sa capacité installée suggère qu'elle tirerait.
power.both_measured: >-
  Le chiffre est le paquet processeur et la carte accélératrice additionnés. Ce
  qu'aucun des deux compteurs ne voit, c'est le reste de la machine : la mémoire
  hors du paquet, le stockage, les ventilateurs et les pertes propres de
  l'alimentation.
power.package_missing: >-
  Le paquet processeur n'est pas compris : aucun compteur lisible sur cette
  machine, donc le chiffre est l'accélérateur seul et sous-estime le total.
power.accelerator_missing: >-
  Aucun accélérateur NVIDIA n'a répondu : rien en dehors du paquet processeur
  n'est donc compris.
power.accelerator_wrapped: >-
  Le compteur d'énergie de l'accélérateur a bouclé ou s'est remis à zéro pendant
  l'exécution : sa consommation n'est donc pas comprise ; la carte, elle, a bien
  répondu.
power.wrap_recovered: >-
  Le compteur d'énergie du processeur a dépassé son plafond une fois pendant
  l'exécution et a été débouclé par sa plage publiée. Cette récupération est
  exacte tant que le processeur est resté en moyenne sous {ceiling} ; au-delà, le
  compteur aurait dépassé le plafond deux fois et ce chiffre sous-estimerait
  l'exécution.
power.unavailable.darwin: >-
  macOS ne publie la puissance du paquet que par powermetrics, qui exige des
  droits d'administrateur et ne peut donc pas être lu par un appel de bibliothèque.
power.unavailable.linux: >-
  Aucun compteur RAPL lisible n'a été trouvé : c'est une machine ARM, un
  conteneur sans les fichiers sysfs, ou des fichiers qui ne sont pas lisibles par
  tous.

# --- Ajuster comment le travail croît avec le job, et refuser de l'ajuster
#     (estimate/scaling.py)

scaling.reading.linear: >-
  Le travail a crû proportionnellement à la taille : projeter par le rapport des
  tailles est donc fondé sur l'intervalle mesuré.
scaling.reading.superlinear: >-
  Le travail a crû plus vite que la taille, à la puissance {exponent}. Doubler le job
  multiplie le coût par {doubling} et non par 2 : une projection qui aurait divisé par
  le rapport des tailles sous-estimerait l'exécution entière.
scaling.reading.sublinear: >-
  Le travail a crû moins vite que la taille, à la puissance {exponent}. Sur ces tailles,
  l'exécution est dominée par des coûts qui ne croissent pas avec le job — démarrage,
  imports, chargement d'un modèle : les tranches mesurent donc surtout de la surcharge,
  et une projection à partir d'elles surestimerait l'exécution entière.
scaling.refuse.too_few: >-
  {count} exécution(s) chronométrée(s) ne suffisent pas pour ajuster un exposant
  de montée en charge ; il en faut {needed} de tailles différentes, parce que
  deux points ajustent une droite exactement et n'écartent donc rien.
scaling.refuse.not_finite: >-
  Une exécution a rapporté une taille ou une durée qui n'est pas un nombre fini :
  aucune courbe ne peut passer par là.
scaling.refuse.not_positive: >-
  Une exécution de taille {size} a pris {seconds}. Une loi de puissance s'ajuste
  sur des logarithmes : chaque taille et chaque durée doivent donc être
  strictement positives ; une exécution trop courte pour l'horloge demande une
  tranche plus grande, pas plus petite.
scaling.refuse.narrow_range: >-
  Les tailles exécutées s'étendent sur un facteur {span}, de {smallest} à
  {largest}. Distinguer une droite d'une courbe demande au moins un facteur
  {needed}, et idéalement des ordres de grandeur ; sur un intervalle aussi
  étroit, tous les exposants s'ajustent à peu près aussi bien.
scaling.refuse.one_size: >-
  Toutes les exécutions avaient la même taille : il n'y a aucune tendance à
  ajuster.
scaling.refuse.negative: >-
  L'ajustement donne un exposant de {exponent} : les grandes exécutions ont fini
  plus tôt que les petites. Le travail ne rétrécit pas quand il y en a plus : ceci
  mesure donc autre chose — un démarrage qui domine chaque échelon, un cache qui
  se remplit, ou un autre processus sur la machine. Exécutez des tranches plus
  grandes sur une machine plus calme, ou regardez ce que faisait la machine avec
  `saggio power`.
scaling.refuse.bad_fit: >-
  Une loi de puissance n'explique que {explained} de la variation sur {count}
  exécutions, sous les {required} exigés. Les tranches ne mesurent pas un comportement
  unique et constant — un cache qui se remplit, un ordonnancement qui change de forme,
  ou une machine occupée ailleurs au même moment : aucun exposant tiré d'elles ne
  décrirait l'exécution.
scaling.notes: >-
  Ajusté sur {count} exécutions de tailles {smallest} à {largest}, R² =
  {r_squared}.
scaling.method: >-
  Moindres carrés de log(secondes) sur log(taille) sur {count} exécutions :
  secondes = {coefficient} × taille^{exponent}.
scaling.limit.range: >-
  L'exposant a été mesuré entre les tailles {smallest} et {largest}. En dehors de
  cet intervalle, c'est une extrapolation comme une autre.
scaling.limit.changes_shape: >-
  Un coût qui change de forme en cours d'exécution réelle — un ordonnancement du taux
  d'apprentissage qui change la taille de lot, un jeu de données qui cesse de tenir en
  mémoire — n'est pas visible dans des tranches qui ont toutes tourné avant.

