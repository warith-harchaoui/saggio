refresh.embodied.wrong_die: >-
  la surface de die d'après laquelle elle a calculé n'est pas celle de cette puce :
  {die}. L'empreinte est fonction du die, si bien qu'un die par défaut est une empreinte
  par défaut portant le nom de cette puce.
refresh.embodied.no_footprint: "la réponse ne portait aucune empreinte lisible."

refresh.tariffs.no_browser: >-
