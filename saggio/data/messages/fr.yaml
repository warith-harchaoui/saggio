# --- Ce que rapporte une relecture du catalogue à sa source (catalog/refresh/*.py)

refresh.not_a_file: >-
  {path} n'existe pas. Cette commande modifie un catalogue ; elle n'en crée pas.

refresh.grid.no_key: >-
  Pas de clé d'API Ember. Renseignez {variable}, ou passez --api-key. Ember en
  délivre une gratuitement sur https://ember-energy.org/data/ — ce paquet ne se rafraîchira à partir d'aucune autre source. {refused}
refresh.grid.refused_fallback: >-
  La série carbon-intensity-electricity d'Our World in Data est accessible sans
  clé et dérive d'Ember, mais ses propres métadonnées l'appellent intensité
  carbone en cycle de vie. Cette colonne, elle, porte les émissions
  d'exploitation. Substituer l'une à l'autre changerait le sens de chaque modèle
  déjà déposé sans rien changer à la confiance que chacun d'eux affiche.
refresh.grid.no_iso3: >-
  aucun code ISO 3166-1 alpha-3 enregistré pour cette clé : la source ne peut donc pas
  être interrogée à son sujet. Ajoutez-en un à ISO3_OF_ISO2.
refresh.grid.no_answer: "Ember n'a pas répondu : {error}"
refresh.grid.unreadable_shape: >-
  Ember a répondu sous une forme non reconnue. Le catalogue est intact ; rien ici ne
  devinera le contenu d'une réponse illisible.
refresh.grid.no_figure: "la source n'a renvoyé aucun chiffre pour ce pays."
refresh.grid.dataset_unreadable: >-
  Le jeu de données publié par Ember n'a pas pu être lu : {error}
refresh.grid.dataset_no_country: >-
  le jeu de données publié ne porte aucune intensité pour ce pays.
refresh.grid.dataset_no_country_year: >-
  le jeu de données publié ne porte aucune intensité pour ce pays en {year}.
refresh.grid.columns_gone: >-
  Le jeu de données publié par Ember n'a plus {columns}. Le catalogue est intact :
  un rafraîchissement qui n'aurait silencieusement rien trouvé s'afficherait
  comme un rafraîchissement n'ayant rien trouvé à changer.

refresh.embodied.accelerators_refused: >-
  Cette source ne détient qu'un archétype de GPU générique, et non des données par
  modèle : elle répond 575,1 kgCO2e pour toutes les cartes, d'une GTX 1080 Ti à une
  H100, soit trois fois et demie le chiffre vérifié par NVIDIA elle-même pour une H100.
  Un nombre qui arrive en portant le nom du modèle demandé, et qui est le même pour tous
  les modèles, vaut moins que pas de nombre du tout. Les empreintes d'accélérateurs sont
  saisies à la main d'après une empreinte carbone produit publiée, une carte à la fois.
refresh.embodied.no_vendor_name: "aucun nom de fabricant enregistré pour cette clé."
refresh.embodied.no_answer: "la source n'a pas répondu : {error}"
refresh.embodied.substituted: >-
