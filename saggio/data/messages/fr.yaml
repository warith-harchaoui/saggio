energy.needs.it: "Exige à la fois un temps d'exécution et une puissance moyenne."
energy.needs.facility: >-
  Exige l'énergie propre à la machine et l'efficacité énergétique du site (PUE).
energy.needs.carbon: >-
  Exige l'énergie tirée et l'intensité carbone du réseau là où le code tourne.
energy.needs.market: >-
  Exige l'énergie tirée et le facteur d'émission de l'électricité que vous avez
  contractée. Une moyenne de réseau relève de l'autre méthode et ne convient pas
  ici.
energy.needs.water: >-
  Exige l'énergie de la machine et une efficacité d'usage de l'eau publiée.
energy.needs.money: "Exige l'énergie tirée et un prix du kilowattheure."
energy.negative.it: >-
  Un temps ou une puissance négatifs sont une erreur de signe, pas un coût.
energy.negative.facility: >-
  Une énergie ou un facteur de surcoût négatifs sont une erreur de signe, pas un
  coût.
energy.negative.carbon: >-
  Une énergie ou une intensité négatives sont une erreur de signe, pas un coût.
energy.negative.market: >-
  Une énergie ou un facteur négatifs sont une erreur de signe, pas un coût.
energy.negative.water: >-
  Une énergie ou une efficacité négatives sont une erreur de signe, pas un coût.
energy.negative.money: >-
  Une énergie ou un prix négatifs sont une erreur de signe, pas un coût.
energy.method.it: "temps en heures x puissance moyenne en watts / 1000."
energy.method.facility: >-
  Énergie de la machine x efficacité énergétique du site : ce que tire le
