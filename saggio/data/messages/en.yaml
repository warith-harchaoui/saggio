# --- How each quantity was computed, and what it needs (estimate/energy.py)

energy.needs.it: "Needs both a runtime and an average power draw."
energy.needs.facility: "Needs the machine's own energy and the site's power usage effectiveness."
energy.needs.carbon: "Needs the energy drawn and the grid carbon intensity where it runs."
energy.needs.market: >-
  Needs the energy drawn and the emission factor of the electricity you
  contracted for. A grid average is the other method and will not do here.
energy.needs.water: "Needs the machine's energy and a published water usage effectiveness."
energy.needs.money: "Needs the energy drawn and a price per kilowatt-hour."
energy.negative.it: "A negative runtime or power draw is a sign error, not a cost."
energy.negative.facility: "A negative energy or overhead ratio is a sign error, not a cost."
energy.negative.carbon: "A negative energy or intensity is a sign error, not a cost."
energy.negative.market: "A negative energy or factor is a sign error, not a cost."
energy.negative.water: "A negative energy or effectiveness is a sign error, not a cost."
energy.negative.money: "A negative energy or price is a sign error, not a cost."
energy.method.it: "runtime in hours x average power in watts / 1000."
energy.method.facility: "Machine energy x power usage effectiveness: what the building draws."
energy.method.carbon: "Facility energy x grid carbon intensity, operating emissions only."
energy.method.market: >-
  Facility energy x your contracted emission factor, operating emissions only.
  Market-based: reported beside the location-based figure, not instead of it.
energy.method.water: >-
  Machine energy x on-site water usage effectiveness; the water used to generate
  the electricity is not included.
energy.method.money: >-
  Facility energy x price per kilowatt-hour; hardware and staff are not included.
energy.method.total: "Sum of the money costs of one unit of work."
energy.power.no_cpu: "The CPU is not identified, so its power cannot be looked up."
energy.power.unknown_part: >-
  {part} is not in the hardware catalogue; add it with its datasheet TDP before a
  power figure can be given.
energy.power.unknown_accelerators: >-
  This machine has {count} accelerator(s) that the hardware catalogue does not
  recognise, and their board power is most of what it draws. Add the row with
  `saggio catalog add gpu` and its datasheet TDP, or name the machine shape with
  --instance.
energy.power.nameplate: "Nameplate sum, Green Algorithms method: {parts}"
energy.total.none: "No money amount carried a number."
energy.total.currencies: >-
  The amounts are in different currencies ({currencies}); convert them before
  adding, and record the rate you used.
energy.total.partial: >-
  {open_count} of the {total_count} money costs carries no number, so this is
  not the total: it is {amount} so far. Fill the open terms in, and the total
  closes with them.

# --- What the figures rest on, as an audit writes it (auditor/assumptions.py)

assumption.embodied.generic_cpu: >-
  No accelerator was identified, and the processor resolved only to a generic
  default, whose footprint would be a generic default too. Excluded rather than
  assumed to be zero.
assumption.embodied.nothing_identified: >-
  Neither an accelerator nor a processor could be identified, so the carbon of
  building this machine is not something this model can state. Excluded rather
  than assumed to be zero.
assumption.embodied.no_footprint: >-
  No product carbon footprint is on file for {part}. Add `embodied_kgco2e` to
  its catalogue row with the footprint's own URL and the date it was read;
  `saggio catalog add {section}` does the rest.
assumption.embodied.published: "Published product carbon footprint."
assumption.lifetime: >-
  How long this hardware stays in service, which only you know. The published
  footprints are cradle-to-gate and exclude the use phase, so none of them
  states a lifespan. Reported figures cluster between three and six years;
  choosing within that range moves the embodied carbon by a factor of two, which
  is why this is asked rather than assumed.
assumption.market_factor: >-
  The emission factor of the electricity you contracted for, which no catalogue
  can hold: it is a property of your contract, not of your country. {sources}
  Record it with the supplier document or certificate that states it and the
  date you read it — this is the one figure in the model nobody else can check
  and nothing here can refresh. Leaving it open is a complete answer; a zero
  because the electricity is 'green' is not one.
assumption.power.measured: "Read from the machine while the slice ran. {scope} {boundary}"
assumption.runtime.measured: "Wall-clock time of `{command}`."
assumption.runtime.not_measured: >-
  No run was measured. Measure the real command with `saggio measure`, or audit
  again with --run.

