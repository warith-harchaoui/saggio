# --- What re-reading a catalogue from its source reports (catalog/refresh/*.py)

refresh.not_a_file: >-
  {path} is not there. This edits a catalogue; it does not create one.

refresh.grid.no_key: >-
  No Ember API key. Set {variable}, or pass --api-key. Ember issues one free at
  https://ember-energy.org/data/ — this package will not refresh from anywhere
  else. {refused}
refresh.grid.refused_fallback: >-
  Our World in Data's carbon-intensity-electricity series is reachable without a
  key and is Ember-derived, but its own metadata calls it lifecycle carbon
  intensity. This column is operating emissions. Substituting one for the other
  would change what every committed model means without changing how trustworthy
  any of them looks.
refresh.grid.no_iso3: >-
  no ISO 3166-1 alpha-3 code on file for this key, so the source cannot be asked
  about it. Add one to ISO3_OF_ISO2.
refresh.grid.no_answer: "Ember did not answer: {error}"
refresh.grid.unreadable_shape: >-
  Ember answered in a shape this does not recognise. The catalogue is untouched;
  nothing here will guess at a response it cannot read.
refresh.grid.no_figure: "the source returned no figure for this country."
refresh.grid.dataset_unreadable: "Ember's published dataset did not read: {error}"
refresh.grid.dataset_no_country: >-
  the published dataset carries no intensity for this country.
refresh.grid.dataset_no_country_year: >-
  the published dataset carries no intensity for this country in {year}.
refresh.grid.columns_gone: >-
  Ember's published dataset no longer has {columns}. The catalogue is untouched:
  a refresh that silently found nothing would print as a refresh that found
  nothing to change.

refresh.embodied.accelerators_refused: >-
  That source holds one generic GPU archetype, not per-model data: it answers
  575.1 kgCO2e for every card from a GTX 1080 Ti to an H100, which is three and
  a half times NVIDIA's own verified figure for an H100. A number that arrives
  wearing the model name you asked for, and is the same for every model, is
  worse than no number. Accelerator footprints are entered by hand from a
  published product carbon footprint, one card at a time.
refresh.embodied.no_vendor_name: "no vendor name on file for this key."
refresh.embodied.no_answer: "the source did not answer: {error}"
refresh.embodied.substituted: >-
  the source answered about {answered}, not {asked}. It substitutes the nearest
  name it holds without saying so.
refresh.embodied.wrong_die: >-
  the die size it computed from is not this chip's: {die}. The footprint is a
  function of the die, so a default die is a default footprint wearing this
  chip's name.
refresh.embodied.no_footprint: "the answer carried no footprint this could read."

refresh.tariffs.no_browser: >-
  No headless browser answered, and that page writes its table with a script
  rather than serving it. Install Chrome or Chromium; nothing here will guess at
  a tariff.
refresh.tariffs.not_published: "the source published no tariff under that name."

refresh.timezones.no_answer: "The timezone database did not answer: {error}"
refresh.timezones.unknown_zones: >-
  These are not zones the database publishes: {zones}. Nothing is stamped: marking a
  list as checked when it did not check out would be, in miniature, the very mistake
  this package objects to.

