  scaling series takes one baseline for the whole ladder.
cli.help.audit.scaling_steps: >-
  Run N differently sized slices and measure how the cost grows with the
  size of the job, instead of assuming it grows in proportion. Three is the
  fewest that can be checked, and costs about 1.3 times one slice. Default
