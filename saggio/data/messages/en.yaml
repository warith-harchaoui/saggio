validate.scenario.not_a_quantity: "must be a quantity with a value and a status"
validate.scenario.money_no_currency: >-
  is on the money dimension {key} but names no currency; add an ISO 4217 code so
  nobody adds dollars to euros
validate.scenario.currency_on_non_money: "names a currency but {key} is not a money dimension"
validate.assumptions.not_mapping: "must be a mapping of name to quantity"
