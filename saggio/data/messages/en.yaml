report.projection.bracket_note: "Fastest and slowest the evidence supports."
report.measurement.hot_path: "Where the time went:"
report.measurement.function: "Function"
report.measurement.cumulative: "Cumulative seconds"
report.measurement.calls: "Calls"
report.measurement.warnings: "Read these before trusting the numbers above:"
