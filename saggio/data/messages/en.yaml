  is estimated with no source_url; add the page the number came from so a reader
  can verify and refresh it
validate.assumptions.measured_without_note: >-
  is measured but says nothing about how; note the instrument in notes
validate.market.no_source: >-
  states a market-based emission factor with no source_url. This is the one
  number in the model nobody else can check and nothing here can refresh, so it
  needs the supplier document, certificate or residual-mix publication that
  states it
validate.market.no_date: >-
  has no retrieved_date; a contract factor is restated every year, so say which
  reading this is
validate.market.alone: >-
  is the market-based half of scope 2 with no location-based figure beside it.
  The guidance requires both, and this is the half a contract can improve, so
  alone it reads better than the disclosure is

