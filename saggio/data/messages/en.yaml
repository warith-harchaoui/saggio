context.country.stated_uncatalogued: "Stated by the caller; not in the grid catalogue."
context.country.from_environment: "Read from ${variable}."
context.country.inferred: >-
  Inferred from the machine timezone {timezone}; confirm it before quoting the
  carbon number.
context.country.unresolved: "Not resolved; state the country the code runs in."
context.country.not_catalogued: >-
  Country {code} is not in the grid catalogue; add it before its carbon
  intensity can be used.
context.grid.missing: "No grid intensity catalogued for {country}."
context.tariff.missing: "No electricity tariff catalogued for {country}."
context.tariff.indicative: "Indicative tariff for {country}."
context.tariff.machine_hours: >-
  {provider} sells machine-hours rather than kilowatt-hours, so the local tariff
  stands in for the electricity inside that price.
context.tariff.unknown_provider: >-
  The provider {provider} is not in the catalogue, so the local tariff stands
  in; add the provider row to price it properly.
context.provider.missing: "Provider {provider} is not in the providers catalogue."
context.pue.published: "Power usage effectiveness published by {provider}."
context.wue.missing: >-
  {provider} publishes no water usage effectiveness. Leave this open rather than
  inventing a figure.
context.wue.published: >-
  On-site water usage effectiveness published by {provider}; it excludes the
