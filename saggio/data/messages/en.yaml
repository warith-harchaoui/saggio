report.title: "Cost of running {name}"
report.title.default: "Cost of running this code"
report.weakest: >-
  **This model is only as good as its weakest number, which is `{status}`.**
  {meaning}
report.updated: "Last updated {date}. Schema {schema}."
report.schema_only: "Schema {schema}."
report.not_known: "not known"
report.no_numbers: "This model states no numbers yet."
report.unit.excluded: "Not part of a unit:"
report.scenario.no_costs: "_This scenario states no costs yet._"
report.not_placed: "**not placed**"
report.inventory.lede: >-
  The scope turns on who operates the machine, which is why the same code lands
  on a different line of a different company's inventory depending on where it
  runs.
report.inventory.founded: >-
  How well founded these are: {summary}. A sustainability disclosure is asked to
  state how much of an inventory rests on estimates rather than readings; every
  number in this report already says so.
report.services.lede: >-
  Prices are not copied into this model. An API price copied today is wrong by
  next quarter, so the report says where the current one lives and leaves the
  figure open until somebody reads it.
report.models.lede: >-
  A rate is not a cost. These are what the vendor charges per unit; how many of
  those units one unit of work spends is the open half, and reading the code
  cannot establish it.
report.no_rate: "_No published rate was found for this model._"
report.projections.lede: "A projection is not a measurement of the thing it projects to."
report.projection.assumes: "What it assumes"
report.projection.limits: "Where it breaks"
