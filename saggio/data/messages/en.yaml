# --- The embodied half, and the SCI score (estimate/embodied.py)

embodied.calendar_note: >-
  Amortised over calendar life, as the SCI specification defines the time share:
  idle time is charged to nobody. Amortising over busy hours instead would give
  a larger figure and is not what the standard says.
embodied.no_footprint: >-
  No product carbon footprint is on file for this hardware, so the carbon of
  building it is open. Nobody has read one for this part; that is not the same
  as it having been free to build. Add an `embodied_kgco2e` to the catalogue row
  with the footprint's own URL and the date it was read.
embodied.no_lifetime: >-
  The hardware's expected lifespan is not stated, so there is nothing to
  amortise over. Every vendor footprint here is cradle-to-gate and excludes the
  use phase on purpose: the vendor gave the numerator and withheld the
  denominator. State `assumptions.hardware_lifetime`; published figures cluster
  between three and six years, and that range alone moves this number by a
  factor of two.
embodied.no_runtime: >-
  The runtime of one unit of work is not known in a unit this can convert, so
  the share of the hardware's life it reserved is open.
embodied.share_open: >-
  A resource share was offered and carries no number, so what fraction of the
  hardware this work reserved is open.
embodied.share_impossible: >-
  A resource share of {share} is outside (0, 1]: a unit of work cannot reserve a
  negative part of a machine, nor more of one than there is.
embodied.method: >-
  M = TE x TS x RS: {footprint} of manufacturing, times {hours} over a
  {years}-year life, times a resource share of {share}. {calendar}
embodied.sci.half_open: >-
  The {missing} half of this score is open, so the score is. SCI is the sum of
  both; reporting one of them under the name of the standard would understate it
  with the standard's authority.
embodied.sci.method: >-
  SCI = (E x I + M) per R, where R is this model's unit of work. {source}

# --- What repeating a measurement says about it (analyze/repeat.py)

repeat.profile_skipped: >-
  No function-level profile was taken: the profiler changes what is being timed,
  so a series with one profiled run among several plain ones would report a
  spread the profiler put there. Run it once for the profile.
repeat.measured_once: >-
  Measured once, so nothing here bounds how far a second run would move it. Pass
  `--repeat N` to find out.
repeat.wide: >-
  The {figure} moved from {low} to {high} across {repeats} runs of the same
  command — {relative} of the median, which is wider than the gate
  `saggio diff` applies to a release. The model carries the median run; this is
  how much it would move if you took it again.
repeat.opening.runtime: "The median of {repeats} runs of the same command"
repeat.opening.other: >-
  Read during the run this model carries, which is the one whose runtime was the
  median of {repeats}; the middle power of the {repeats}{middle} is a different
  run's
repeat.ranged: >-
  {opening}. Across them this figure ranged {low} to {high}{width}. A range from
  {repeats} runs is not a bound: the next run lands outside it about {odds},
  whatever the shape of the variation, and nothing need have changed for it to.
repeat.width: ", a spread of {relative} of their median"
repeat.odds.every_time: "every time"
repeat.odds.one_in: "one time in {count}"
repeat.figure.runtime_s: "runtime"
repeat.figure.power_w: "measured power"
repeat.cannot_run: "A command cannot be run {repeats} times."

# --- What the validator refuses, and why (saggio/model/validate.py)
#
# Each of these follows the field's own path, so a sentence begins mid-phrase:
# "`scenarios` a model must define at least one scenario". Keep that shape — the
# path is the subject, and a translation that repeated it would read twice.

validate.schema.missing: >-
  is missing; assuming "{version}". Add it at the top of the model.
validate.schema.malformed: 'must be a MAJOR.MINOR string such as "{version}"'
validate.schema.newer: >-
  declares major {declared}, newer than this build understands ({version});
  upgrade saggio
validate.schema.older: >-
  declares major {declared}, older than the current {version}; re-audit the
  model or bump it once you have checked the numbers
validate.required_missing: "is required and missing"
validate.date.placeholder: "is still the template placeholder"
validate.date.not_calendar: "must be a {shape} calendar date, got {given}"
validate.unit_of_work.not_mapping: "must be a mapping"
validate.unit_of_work.name_required: >-
  is required: state the one thing whose cost this model reports, such as 'one
  inference on a median request'
validate.deployment.not_mapping: "must be a mapping"
validate.scenarios.none: "a model must define at least one scenario"
validate.unknown_block: "is not a block this build knows; it is carried through untouched"
validate.quantity.hidden_numbers: >-
  hides numbers under {key}, which a quantity does not define; a number the
  walker cannot see is a number outside the rules
validate.quantity.unknown_key: >-
  carries {key}, which a quantity does not define; move it to notes or to its
  own block
validate.quantity.block_where_text: >-
  has a block where {key} should be text; a number hidden inside it would escape
  the rules
validate.quantity.bad_status: >-
  has status {status}; it must be one of measured, estimated, placeholder, TODO
validate.quantity.value_not_number: >-
  has value {value}, which is not a number; write numbers unquoted, or move
  prose to notes
validate.quantity.value_not_finite: >-
  is {value}, which is not a finite number; NaN and infinity state nothing a
  reader can check
validate.quantity.negative: "is {value}; a cost of running code cannot be negative"
validate.quantity.placeholder_with_value: >-
  is status {status} but carries the number {value}; a placeholder or a TODO
  should have no value
validate.quantity.claims_without_number: >-
  claims {status} but has no number; either supply one or lower the status to TODO
validate.quantity.bad_source_kind: "has source_kind {kind}; it must be one of {allowed}"
validate.quantity.bad_currency: >-
  has currency {currency}; it must be a three-letter ISO 4217 code
validate.quantity.template_date: >-
  has retrieved_date {date}, still the template's literal; write the date the
  source was actually read
validate.quantity.date_not_calendar: >-
  has retrieved_date {date}, which is not a calendar date
validate.quantity.stale: >-
  was sourced {age} days ago, past the {limit}-day mark; re-read the source and
  refresh the number
validate.derivation.self: "lists itself in derived_from"
validate.derivation.unknown_reference: >-
  derives from {reference}, which names nothing in this model
validate.derivation.not_a_quantity: >-
  derives from {reference}, which is not a quantity; a derivation must name
  something that carries a status
validate.derivation.outranks: >-
  claims {status} but its weakest input is {ceiling}; a derived value cannot
  outrank the numbers it came from
validate.derivation.circle: >-
  derives in a circle: {circle}. Every value in it is founded on another value
  in it, so none of them rests on anything measured or sourced
validate.derivation.unit_mismatch: >-
  is written in {unit}, which cannot come from the inputs it names: no way of
  multiplying and dividing them gives that unit. The derivation and the unit
  disagree
validate.derivation.does_not_follow: >-
  states {value} but does not follow from the inputs it names, which give
  {expected}. Either the number or the derivation is wrong; naming inputs a
  value did not come from is the one mistake this field exists to make impossible
validate.measured.unit_not_observed: >-
  is measured in {unit}, which a timed run does not observe. The measurement
  block in this model attests durations, energy, power and bytes; it cannot
  attest this one. Say in notes what measured it, or derive it from something
  that was measured
validate.measured.without_how: >-
  is measured but nothing says what measured it: no note, no derivation, and no
  measurement block in this model. `estimated` has to name a source; the
  stronger status should not ask for less
validate.bare_number: >-
  is a bare number; wrap it in a quantity so it carries an honesty status
validate.dimensions.not_list: "must be a list of dimension declarations"
validate.dimensions.entry_not_mapping: "must be a mapping with at least a key"
validate.dimensions.key_required: "is required"
validate.dimensions.duplicate: >-
  declares {key} a second time; the later declaration is ignored, so remove it
  or give this dimension its own key
validate.dimensions.redeclares_builtin: >-
  redeclares the built-in dimension {key}; the built-in label and unit are what
  reports use, so this declaration changes nothing
validate.dimensions.empty_unit: "is empty; say what the numbers are counted in"
validate.scenario.not_mapping: "is not a mapping; a scenario is a block with a name and costs"
