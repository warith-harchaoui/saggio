# --- What a figure says to a reader who cannot see it (report/figures.py)
#
# The accessible description of a figure, not its title: a `<title>` carries a
# `data-i18n` attribute and the language button switches it in the browser,
# while a `<desc>` is composed from the model and is written in the language in
# force at render time. Same split as the rest of the page — the furniture
# switches, what the model says does not.

# A figure's tooltip, which is a name and a value. The separator is a key
# because French puts a space before a colon and this one is composed in
# Python, where the catalogue's typography check cannot see it.
figure.tooltip: "{name}: {value}"

figure.chain.no_status: "no status"
figure.chain.derived: "{node} is {status} and comes from {inputs}."
figure.chain.nothing_derived: "Nothing in this model derives from anything else."
figure.location.description: "Grid carbon intensity in gCO2e per kWh: {listed}."
figure.domains.description: >-
  {listed}, {total} W in total, each read from its own counter.
figure.domains.total: "Total {total} W."


# --- What an Apple chip's own counters cover (analyze/apple.py, power/soc.py)

apple.soc_scope: >-
  the chip's processor cores, graphics cores, and neural engine, from the
  system-on-chip's own energy counters
apple.soc_memory_scope: "the chip's memory, from its own energy counter"
apple.soc_model_note: >-
  These are the chip's own energy counters, which are a model inside the silicon
  rather than a meter on the power rail, and Apple says they are not a basis for
  comparing one machine against another. Left out of them: the display, storage,
  networking, the fans, and the power supply's own losses.
apple.intel_mac: >-
  This is an Intel Mac, whose package counter macOS publishes only through
  powermetrics, which needs administrator rights and so cannot be read from a
  library call.
apple.unknown_layout: >-
  This Apple chip publishes energy channels under names this package does not
  recognise, so nothing was measured rather than something guessed. Reporting the
  channel names in an issue is enough to add the part.
apple.silent_counters: >-
  This Mac's reporting library loads, and the energy group behind it holds no
  channel for the processor cores, so nothing was measured rather than something
  guessed. Two machines answer this way: one whose chip is reached through a
  hypervisor, which keeps the counters with the host, and one whose channel names
  this package has not been taught to read. Reporting the names in an issue
  separates them.
soc.figure_covers: "The figure covers {scope}, read from the {channels} counters."
soc.figure_covers_both: >-
  The figure covers {scope} and {memory}, read from the {channels} counters.
report.whatif.here_measured: "this machine, as measured"
report.whatif.here_estimated: "this machine, as the catalogue estimates it"
report.chain_caption: >-
  Each box is coloured by how well founded that number is. A weak colour
  upstream caps everything downstream of it: that is the weakest-link rule,
  drawn.
