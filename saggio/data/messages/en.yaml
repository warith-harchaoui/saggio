cli.help.catalog.read-pcf.json: "Print the reading as JSON."
cli.help.refresh.summary: >-
  Re-read a catalogue's numbers from the source it cites. Read-only unless
  --write is given.
cli.help.catalog.refresh.catalog: >-
  Which catalogue: `grid` or `hardware`.
cli.help.catalog.refresh.api_key: >-
  Ember API key, optional. Falls back to EMBER_API_KEY. Without one the
  carbon column is read from Ember's published yearly dataset, which is the
  same series under CC-BY-4.0 and what every row cites; with one it is read
  from Ember's API instead, and the run says which answered. Nothing outside
  Ember is used as a substitute, because the other open series that looks
  equivalent measures lifecycle rather than operating emissions.
cli.help.catalog.refresh.year: >-
  Data year. By default the most recent each country has, which is not the
  same year for every country: a row records its own.
cli.help.catalog.refresh.column: >-
  Which column to re-read. For `grid`: `carbon` asks Ember, `price` asks the
  tariff page, `timezones` checks the names against the IANA database that
  defines them, `both` does carbon and price, `all` does the three. For
  `hardware`: `embodied` asks for processor footprints. Each column carries
  its own source and its own date, because they do not come from the same
  place and do not move together.
